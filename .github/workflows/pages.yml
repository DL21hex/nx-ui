# Publica la galería (la documentación con los ejemplos en vivo) en GitHub Pages en cada push a
# main. Es solo el despliegue: las verificaciones siguen en `npm run check` (hook pre-push).
#
# Una sola vez, en GitHub: Settings → Pages → Build and deployment → Source: «GitHub Actions».
#
# Las acciones van fijadas por SHA (el comentario dice la versión) y cada job tiene solo los permisos
# que usa: el que instala dependencias no puede desplegar ni pedir un token OIDC.
name: Galería en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Un despliegue que ya empezó termina; el siguiente espera su turno.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      # Sin scripts de instalación: la galería no los necesita y una dependencia no corre nada aquí.
      - run: npm ci --ignore-scripts
      - run: npm run build:gallery
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist-gallery

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
