# Publica la galería (la documentación con los ejemplos en vivo) en GitHub Pages en cada push a
# main. Es solo el despliegue: las verificaciones siguen en `npm run check` (hook pre-push).
#
# Una sola vez, en GitHub: Settings → Pages → Build and deployment → Source: «GitHub Actions».
#
# Las acciones van fijadas por SHA (el comentario dice la versión) y cada job tiene solo los permisos
# que usa: el que instala dependencias no puede desplegar ni pedir un token OIDC.
name: Galería en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Un despliegue que ya empezó termina; el siguiente espera su turno.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      # Sin scripts de instalación: la galería no los necesita y una dependencia no corre nada aquí.
      - run: npm ci --ignore-scripts
      - run: npm run build:gallery
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist-gallery

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
