    <!-- ================================================================ Cuenta -->
    <template id="page-account">
      <p class="eyebrow">Componentes</p>
      <h1>Cuenta <code class="tag">&lt;nx-account&gt;</code></h1>
      <p class="lead">
        La tarjeta de quien inició sesión, al pie del menú lateral. Un clic y está todo lo suyo: en qué empresa, sede y
        rol trabaja, su estado, el tema y el color de la app (que se repinta en vivo al pasar el mouse por cada muestra),
        el idioma de los números y las fechas, «Ver como…», bloquear la pantalla y cerrar sesión sin perder lo que falta
        por sincronizar.
      </p>

      <div class="demo">
        <div class="demo__controls">
          <label><input type="checkbox" id="acc-collapsed" /> Menú compacto</label>
          <span class="demo__sep"></span>
          <button type="button" class="dlg-plain" id="acc-expire">Simular: la sesión vence en 1 min</button>
          <button type="button" class="dlg-plain" id="acc-pending">Simular 3 cambios sin sincronizar</button>
          <label><input type="checkbox" id="acc-offline" /> Sin conexión</label>
        </div>
        <div class="stage acc-stage" id="acc-stage" lang="es-CO">
          <div class="stage__menu">
            <nx-sidemenu id="acc-menu" active="/ventas/pedidos" collapsible>
              <a slot="header" class="acc-brand" href="#/account"><span class="acc-brand__mark" aria-hidden="true">C</span><span class="acc-brand__name">Crear ERP</span></a>
              <nx-account
                slot="footer"
                id="acc"
                storage="none"
                lock-endpoint="/demo/account/unlock"
                lock-after="15"
                view-as-source="/demo/account/people"
                locale="es-CO"
              ></nx-account>
            </nx-sidemenu>
          </div>
          <div class="stage__main">
            <div class="stage__bar">
              <button type="button" class="icon-btn stage__burger" popovertarget="acc-menu" aria-label="Abrir menú">☰</button>
              <span class="stage__crumb">Ventas</span>
              <strong>Pedidos</strong>
              <span class="acc-bar__org" id="acc-org"></span>
            </div>
            <div class="stage__body">
              <p class="stage__tip">
                Abre la tarjeta de <strong>Diego Llinás</strong> (abajo a la izquierda). Pasa el mouse por los colores: toda
                la página cambia y vuelve al salir; elige uno o el tema oscuro para ver el círculo desde el clic. La clave
                para desbloquear es <kbd>1234</kbd>; <kbd>Ctrl</kbd> <kbd>K</kbd> y escribe «oscuro» o «bogotá».
              </p>
              <p class="stage__loglabel">Eventos</p>
              <ol class="stage__log" id="acc-log"></ol>
            </div>
          </div>
        </div>
      </div>
      <nx-keytips id="acc-kt" key="none" scope="#acc-stage"></nx-keytips>

      <h2>Qué hay en el panel</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fila</th><th>Qué hace</th></tr></thead>
          <tbody>
            <tr><td>Empresa · sede · rol</td><td>Abre el selector dentro del mismo panel: buscador sin tildes («bogota»), recientes arriba cuando hay muchas, agrupado por empresa, <kbd>1</kbd>–<kbd>9</kbd> eligen y <kbd>Esc</kbd> vuelve. Elegir emite <code>nx-account-switch</code>, cancelable.</td></tr>
            <tr><td>Estado</td><td>En línea, Ausente o No molestar (hasta dentro de 1 h, hoy o sin fin). El punto del avatar lo refleja; un anillo ámbar dice que hay cambios en cola y el punto gris, sin conexión.</td></tr>
            <tr><td>Tema y color</td><td>Claro, Sistema u Oscuro en <code>html[data-theme]</code>; las paletas de <code>palettes.css</code> en <code>html[data-nx-palette]</code>. Vista previa al pasar el mouse o el foco; al elegir, transición circular desde el clic (sin ella con movimiento reducido). Se guarda en <code>localStorage</code>.</td></tr>
            <tr><td>Idioma y formatos</td><td>Cada locale con su muestra: «1.234.567,50 · 26 sept 2026» o «1,234,567.50 · Sep 26, 2026». Elegir pone <code>&lt;html lang&gt;</code>: toda la librería lo sigue sola.</td></tr>
            <tr><td>Ver como…</td><td>Busca a una persona en el servidor y muestra la franja «Estás viendo como…» (con <code>view-as-source</code>).</td></tr>
            <tr><td>Bloquear · Ctrl L</td><td>Pantalla de bloqueo con la clave; también tras <code>lock-after</code> minutos sin actividad.</td></tr>
            <tr><td>Cerrar sesión</td><td>Sin preguntar «¿Seguro?». Si hay cambios sin sincronizar, primero se envían (con tope de 10 s y «Salir de todos modos»).</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
        </div>
        <pre role="tabpanel"><code>&lt;nx-sidemenu id="menu" collapsible&gt;
  &lt;nx-account slot="footer" id="cuenta"
    user='{"name":"Diego Llinás","email":"diego@crear.co"}'
    tenants='[{"id":"cc-med","name":"Crear Colombia S.A.S.","detail":"Sede Medellín","role":"Aprobador","group":"Crear Colombia S.A.S."}]'
    current="cc-med"
    items='[{"id":"perfil","label":"Mi perfil","href":"/perfil"},{"id":"config","label":"Configuración","hint":"Ctrl ,"}]'
    session='{"expiresAt":"2026-09-26T18:00:00Z","extendEndpoint":"/api/sesion/extender"}'
    lock-endpoint="/api/desbloquear" lock-after="15"
    view-as-source="/api/personas"
    logout-url="/salir"&gt;&lt;/nx-account&gt;
&lt;/nx-sidemenu&gt;

&lt;!-- Sus acciones también en la paleta de comandos --&gt;
&lt;nx-command account="cuenta"&gt;&lt;/nx-command&gt;

cuenta.addEventListener("nx-account-switch", (e) =&gt; cambiarEmpresa(e.detail.tenant.id));
cuenta.addEventListener("nx-account-logout", () =&gt; limpiarDatosLocales());</code></pre>
        <pre role="tabpanel" hidden><code>import { Account } from "nx-ui/solid/account";

&lt;Account
  slot="footer"
  user={usuario()}
  tenants={empresas()}
  current={empresaActual()}
  session={{ expiresAt: vence(), extendEndpoint: "/api/sesion/extender" }}
  lockEndpoint="/api/desbloquear"
  logoutUrl="/salir"
  onSwitch={(e) =&gt; cambiarEmpresa(e.detail.tenant.id)}
  onTheme={(e) =&gt; guardarPreferencia(e.detail)}
/&gt;</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>user</code></td><td><code>{name, email?, avatar?, initials?}</code> (JSON o propiedad).</td></tr>
            <tr><td><code>tenants</code>, <code>current</code></td><td><code>[{id, name, detail?, role?, group?}]</code> y el id de la actual.</td></tr>
            <tr><td><code>status</code></td><td><code>online</code>, <code>away</code> o <code>dnd</code>.</td></tr>
            <tr><td><code>items</code></td><td>Enlaces de la app: <code>[{id, label, icon?, href?, hint?}]</code>.</td></tr>
            <tr><td><code>palettes</code></td><td><code>["indigo","oceano",…]</code> o <code>[{id, label, color}]</code>. Por defecto, las 9 de <code>palettes.css</code>.</td></tr>
            <tr><td><code>locales</code>, <code>apply-locale</code></td><td><code>[{value, label}]</code> (es-CO, es-MX, en-US, pt-BR). Con <code>apply-locale="false"</code> no toca <code>&lt;html lang&gt;</code>.</td></tr>
            <tr><td><code>storage</code></td><td>Clave de <code>localStorage</code> para tema, paleta y recientes (<code>nx-account</code>); <code>none</code> no guarda.</td></tr>
            <tr><td><code>session</code>, <code>expires-at</code>, <code>warn-before</code></td><td><code>{expiresAt, extendEndpoint?}</code>; aviso <code>warn-before</code> minutos antes (5) con cuenta regresiva y «Extender».</td></tr>
            <tr><td><code>view-as</code>, <code>view-as-source</code></td><td>La persona suplantada (muestra la franja) y dónde buscar personas (<code>GET ?q=</code>).</td></tr>
            <tr><td><code>lock</code>, <code>lock-endpoint</code>, <code>lock-after</code></td><td>Bloquear pantalla (fila y <kbd>Ctrl</kbd> <kbd>L</kbd>), dónde verificar la clave y minutos de inactividad.</td></tr>
            <tr><td><code>logout-url</code></td><td>A dónde ir al salir (solo del mismo origen).</td></tr>
            <tr><td><code>sync</code>, <code>lockVerify</code>, <code>commands</code></td><td>Propiedades: la cola de <code>nx-sync</code>, la verificación propia de la clave y las acciones para <code>&lt;nx-command&gt;</code>.</td></tr>
            <tr><td><code>labels</code>, <code>locale</code>, <code>disabled</code></td><td>Textos, locale de los números y apagar la tarjeta.</td></tr>
            <tr><td>Métodos</td><td><code>show()</code>, <code>hide()</code>, <code>lock()</code>, <code>logout()</code>.</td></tr>
            <tr><td>Eventos</td><td><code>nx-account-switch</code> y <code>nx-account-view-as</code> (cancelables), <code>nx-account-status</code>, <code>nx-account-theme</code>, <code>nx-account-locale</code>, <code>nx-account-select</code>, <code>nx-account-extend</code> (cancelable), <code>nx-account-expired</code>, <code>nx-account-logout</code> (cancelable) y <code>nx-open-change</code>.</td></tr>
          </tbody>
        </table>
      </div>
    </template>
