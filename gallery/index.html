          <section class="vc-sim" aria-labelledby="vc-sim-title">
            <h2 class="vc-sim__title" id="vc-sim-title">Probar sin micrófono</h2>
            <p class="sel-tip">
              Cada frase recorre los mismos eventos que una toma real (parciales, final y la entrega), con una API de voz de
              mentira y un audio sintético en lugar del micrófono, que es lo que mueve el anillo.
            </p>
            <div class="vc-sim__row">
              <div class="vc-phrases" id="vc-phrases" role="group" aria-label="Frases de ejemplo"></div>
              <label class="vc-server"><input type="checkbox" id="vc-server" /> Usar el servidor (<code>engine="server"</code>)</label>
            </div>
          </section>
          <ol class="stage__log btn-events" id="vc-log"></ol>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Reconocimiento</td><td>La Web Speech API del navegador (<code>SpeechRecognition</code>), en el idioma del <code>locale</code> (es-CO por defecto), con resultados parciales que se ven en gris mientras se habla y el final en negro.</td></tr>
                <tr><td>Con servidor</td><td>Sin esa API, o con <code>engine="server"</code>: graba con <code>MediaRecorder</code> (WebM u Ogg con Opus, o MP4 en Safari) y hace <code>POST {endpoint}</code> con el audio. Responde <code>{text}</code>, o NDJSON/SSE con <code>{partial}</code> mientras transcribe. Sin ninguna de las dos, el botón no aparece.</td></tr>
                <tr><td>Cómo se habla</td><td>Tocar para hablar (un toque empieza; otro toque o 2 s de silencio terminan) o <code>hold</code>: mientras se mantiene el botón o la barra espaciadora, útil con guantes o ruido. <code>hotkey</code> («Alt+V») sirve en toda la página y no choca con el toque de Alt de <code>&lt;nx-keytips&gt;</code>. Escape cancela.</td></tr>
                <tr><td>Entrega</td><td>A un <code>&lt;nx-paste-fill&gt;</code>: su <code>fill(text)</code> reparte los datos y queda «Llené 4 campos · Deshacer». A un <code>&lt;input&gt;</code> o <code>&lt;textarea&gt;</code>: se escribe en el cursor (o sobre lo seleccionado) y el campo recibe <code>input</code> y <code>change</code>.</td></tr>
                <tr><td>Español hablado</td><td>Solo al dictar en un campo de texto: los signos dichos («coma», «punto y aparte», «dos puntos», «nueva línea», «abre paréntesis»…), la mayúscula al empezar la frase, el «¿» o «¡» de apertura al dictar el de cierre, y las órdenes «borrar eso» y «borra la última palabra» (<code>commands="false"</code> las apaga). «El punto de venta» o «la coma decimal» quedan como palabras.</td></tr>
                <tr><td>Privacidad</td><td>El micrófono se apaga siempre al terminar, al ocultar la pestaña, al desconectar el elemento o a los <code>max-seconds</code> (30): se detienen todas las pistas y se cierra el <code>AudioContext</code> del medidor. Nunca graba en segundo plano.</td></tr>
              </tbody>
            </table>
          </div>
          <p class="sel-tip">
            <strong>Qué navegadores traen la API de voz.</strong> Chrome y Edge (escritorio y Android) la traen, y el audio se
            reconoce en los servidores de Google o de Microsoft: necesita internet («Sin conexión» si no hay) y el audio sale
            del equipo. Safari la trae en macOS y en iOS. Firefox no la trae, y Brave la tiene pero suele fallar. Donde no hay,
            o si el audio no puede salir hacia un tercero, <code>endpoint</code> con <code>engine="server"</code> usa el
            servidor propio de la app. En la galería, «Usar el servidor» graba de verdad y un servidor de mentira responde una
            frase fija.
          </p>

          <h2>Cómo se usa</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>
            <pre role="tabpanel"><code>&lt;nx-voice for="pedido-fill" hotkey="Alt+V"&gt;&lt;/nx-voice&gt;
    &lt;nx-paste-fill id="pedido-fill" fields='[{"name":"cantidad","kind":"number"}]'&gt;
      &lt;form&gt;…&lt;/form&gt;
    &lt;/nx-paste-fill&gt;

    &lt;!-- En un campo de texto, mantener para hablar --&gt;
    &lt;textarea id="novedades"&gt;&lt;/textarea&gt;
    &lt;nx-voice for="novedades" hold layout="stacked"&gt;&lt;/nx-voice&gt;

    &lt;!-- Sin la API del navegador (o sin mandar audio a terceros): el servidor de la app --&gt;
    &lt;nx-voice for="pedido-fill" engine="server" endpoint="/api/voz"&gt;&lt;/nx-voice&gt;</code></pre>
            <pre role="tabpanel" hidden><code>import { Voice } from "nx32-elements/solid/voice";
import { PasteFill } from "nx32-elements/solid/paste-fill";

    &lt;Voice for="pedido-fill" hotkey="Alt+V" onText={(e) =&gt; registrar(e.detail.text)} /&gt;
    &lt;PasteFill id="pedido-fill"&gt;&lt;form&gt;…&lt;/form&gt;&lt;/PasteFill&gt;</code></pre>
          </div>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>for</code></td><td>El <code>id</code> de un <code>&lt;nx-paste-fill&gt;</code> (recibe <code>fill(text)</code>), un <code>&lt;input&gt;</code> o un <code>&lt;textarea&gt;</code> (se dicta en el cursor). Sin él, solo el evento.</td></tr>
                <tr><td><code>engine</code>, <code>endpoint</code></td><td><code>auto</code> (por defecto: el navegador, si no el servidor), <code>browser</code> o <code>server</code>. <code>endpoint</code> recibe <code>POST</code> con <code>FormData</code> (<code>audio</code>, <code>lang</code>); solo del mismo origen o de uno de <code>allowOrigins</code>.</td></tr>
                <tr><td><code>hold</code>, <code>hotkey</code></td><td>Mantener para hablar; atajo de página («Alt+V», «Ctrl+Shift+D»).</td></tr>
                <tr><td><code>max-seconds</code>, <code>silence</code></td><td>Tope de una toma (30 s) y el silencio que la termina (2000 ms; no aplica con <code>hold</code>).</td></tr>
                <tr><td><code>commands</code>, <code>layout</code></td><td><code>commands="false"</code> apaga «borrar eso» y «borra la última palabra». <code>layout</code>: <code>inline</code> (la transcripción al lado) o <code>stacked</code> (debajo).</td></tr>
                <tr><td><code>locale</code>, <code>labels</code>, <code>disabled</code></td><td>Idioma del reconocimiento (o el <code>lang</code> más cercano), textos (<code>VOICE_LABELS</code>) y apagarlo.</td></tr>
                <tr><td>Métodos y propiedades</td><td><code>start()</code>, <code>stop()</code>, <code>cancel()</code>; <code>state</code> (<code>idle</code>, <code>asking</code>, <code>listening</code>, <code>processing</code>, <code>error</code>, <code>unavailable</code>), <code>supported</code>, <code>text</code>.</td></tr>
                <tr><td>Eventos</td><td><code>nx-voice-start</code>, <code>nx-voice-partial</code> <code>{text}</code>, <code>nx-voice-text</code> <code>{text, confidence, final}</code> (cancelable: no se entrega), <code>nx-voice-end</code> <code>{text, canceled}</code>, <code>nx-voice-error</code> <code>{code, message}</code>, <code>nx-voice-unavailable</code>.</td></tr>
                <tr><td>Funciones</td><td><code>applyDictation</code>, <code>parseDictation</code>, <code>pickVoiceMime</code>, <code>parseVoiceLine</code>, <code>parseVoiceHotkey</code>, <code>voiceHotkeyMatches</code>, <code>speechTranscript</code>, <code>voiceLevel</code>, <code>voiceErrorCode</code>.</td></tr>
              </tbody>
            </table>
          </div>
        </template>

        <!-- ================================================================ Conversación -->

            orden, con menciones, referencias a otros registros y, si hace falta, anclados a un campo: «¿por qué este

          <h2>Conversación en el registro</h2>
          <div class="hilo" lang="es-CO">
            <form class="hilo-card hilo-form" id="hilo-form" autocomplete="off" aria-labelledby="hilo-title">
              <header class="hilo-form__head">

            <nx-thread

              id="hilo-thread"
              record="OC-2291"
              endpoint="/demo/thread/comentarios"

              people-source="/demo/thread/personas"

            envío» se ve el reintento sin duplicar.

          <ol class="stage__log btn-events" id="hilo-log"></ol>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Lista</td><td>Del más viejo al más nuevo, agrupada por día («Hoy», «Ayer», «lun 21 sept»), con la hora relativa y la exacta al pasar el cursor. «Nuevos» marca el primer comentario de otra persona desde tu última visita (se recuerda por registro y persona). Con muchos comentarios pinta los últimos 50 y «Ver anteriores».</td></tr>
                <tr><td>Respuestas</td><td>De un solo nivel: responder cita arriba, en pequeño, el comentario al que responde (un clic lleva a él). Nada de árboles.</td></tr>
                <tr><td>Lo propio</td><td>Se edita en su lugar y se borra al instante, con «Deshacer» en un aviso (sin «¿Seguro?»).</td></tr>
                <tr><td>Anclas</td><td>Los campos con <code>data-thread</code> (o los de <code>anchors</code>) llevan junto a su etiqueta un globito con los comentarios abiertos sobre ese campo. Es un botón propio, insertado sin mover nada del formulario. Clic: el hilo se filtra a ese campo y el redactor queda «Sobre: Descuento». Una conversación anclada se resuelve y queda plegada.</td></tr>
                <tr><td>Redactor</td><td>Crece con lo que se escribe. <kbd>Enter</kbd> envía, <kbd>Mayús</kbd>+<kbd>Enter</kbd> es otra línea (en el celular, el botón Enviar). El borrador sobrevive a recargar la página.</td></tr>
                <tr><td>Texto</td><td>Siempre texto: solo se reconocen las menciones, las referencias, las URL (<code>https://…</code>, en otra pestaña) y los saltos de línea. Nada de HTML de quien escribe.</td></tr>
                <tr><td>Envío</td><td>Optimista: aparece al instante («Enviando…»); si falla, «No se envió · Reintentar» sin perder el texto. El <code>clientId</code> evita duplicados en el reintento.</td></tr>
                <tr><td>En vivo</td><td>Con <code>stream</code> (SSE o NDJSON) llegan comentarios, ediciones, borrados y «escribiendo…», con reconexión de espera creciente. Sin stream, un sondeo suave con la pestaña visible.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>

            <pre role="tabpanel" hidden><code>import { Thread } from "nx32-elements/solid/thread";

    &lt;Thread record="OC-2291" endpoint="/api/comentarios" stream="/api/comentarios/stream"
      peopleSource="/api/personas" refsSource="/api/referencias"

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>record</code>, <code>endpoint</code></td><td>El registro y su API: <code>GET ?record=</code>, <code>POST</code> <code>{record, text, anchor?, replyTo?, clientId}</code>, <code>PATCH /{id}</code> <code>{text}</code> o <code>{resolved}</code>, <code>DELETE /{id}</code>. Sin <code>endpoint</code>, todo es local (propiedad <code>comments</code> y eventos).</td></tr>
                <tr><td><code>stream</code>, <code>poll</code></td><td>SSE o NDJSON (<code>comment</code>, <code>update</code>, <code>delete</code>, <code>typing</code>); sin él, cada <code>poll</code> segundos (30; <code>0</code> no sondea).</td></tr>
                <tr><td><code>people-source</code>, <code>refs-source</code>, <code>ref-patterns</code></td><td><code>?q=</code> → personas <code>{id, name, detail?, avatar?}</code> y registros <code>{id, label, detail?, href}</code>. Los patrones (JSON de expresiones regulares, con tope de largo; se descartan las que pueden colgar) reconocen códigos como <code>FV-1873</code> sin <kbd>#</kbd>.</td></tr>
                <tr><td><code>me</code>, <code>anchors</code>, <code>presence</code></td><td>Quién escribe (sin él, solo se lee), campos anclables además de <code>[data-thread]</code> (<code>name</code> o selectores), y el <code>id</code> del <code>&lt;nx-presence&gt;</code> del que se lee «Laura está viendo».</td></tr>
                <tr><td><code>readonly</code>, <code>disabled</code>, <code>locale</code>, <code>labels</code></td><td>Sin redactor ni acciones; redactor apagado; fechas y horas; textos (<code>THREAD_LABELS</code>).</td></tr>
                <tr><td>Métodos</td><td><code>reload()</code>, <code>focusComposer(ancla?)</code>, <code>filter(ancla | null)</code>.</td></tr>
                <tr><td>Eventos</td><td><code>nx-thread-post</code> (cancelable, antes de enviar), <code>nx-thread-change</code> <code>{comments}</code>, <code>nx-thread-mention</code> <code>{comment, people}</code> (la app avisa por su lado), <code>nx-thread-error</code> <code>{action, message, id?}</code>.</td></tr>
                <tr><td>Teclado</td><td>En la lista de sugerencias: <kbd>↑</kbd> <kbd>↓</kbd>, <kbd>Enter</kbd> o <kbd>Tab</kbd> eligen, <kbd>Esc</kbd> cierra. Editando: <kbd>Enter</kbd> guarda, <kbd>Esc</kbd> cancela.</td></tr>
              </tbody>
            </table>
          </div>

                cada paso con su responsable, su fecha límite y la evidencia que exige (fotos, archivos, firma, una nota, un

                </button>

              <p class="sel-tip">
                Abre «Foto del camión en el muelle» (vencida) y toma una foto; en «Contar láminas», escribe 110: se puede cerrar,
                pero queda fuera de rango y pide la nota. En «Conteo» los pasos van en orden, y las firmas esperan el conteo.

              <h2>Cómo funciona</h2>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Haces</th><th>Pasa</th></tr></thead>
                  <tbody>
                    <tr><td>Abres un paso (clic o <kbd>Enter</kbd>)</td><td>Se despliega en su lugar, uno a la vez, con la ayuda y los campos de la evidencia que pide. Las flechas pasan de un paso a otro; <kbd>Esc</kbd> lo cierra.</td></tr>
                    <tr><td>Entregas la evidencia</td><td>«Marcar como hecho» se habilita cuando está completa y, mientras tanto, dice qué falta («Falta: Foto del camión (2 fotos más)»). Un paso sin evidencia se marca con su casilla.</td></tr>
                    <tr><td>Un número fuera de rango, o «No conforme»</td><td>Se puede cerrar, pero con un aviso claro y una nota obligatoria; el paso queda marcado «fuera de rango».</td></tr>
                    <tr><td>Omitir o reabrir</td><td>Piden un motivo, y quedan en la actividad con quién y cuándo. Al reabrir, la evidencia queda como borrador.</td></tr>
                    <tr><td>Orden</td><td><code>sequential</code> (todo, o solo algunas secciones) y <code>dependsOn</code>: los bloqueados se ven, dicen qué va primero y no se abren para editar.</td></tr>
                    <tr><td>Sin conexión</td><td>El cambio se ve al instante y queda «pendiente de enviar»; se sigue trabajando. Al volver la red se envía en orden. Un error del servidor revierte ese paso con un aviso.</td></tr>
                    <tr><td>Completas los requeridos</td><td>«Procedimiento completo», quién lo completó y cuándo, y «Cerrar procedimiento» (cancelable): queda en solo lectura.</td></tr>
                  </tbody>
                </table>
              </div>

              <h2>Protocolo</h2>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Ruta</th><th>Forma</th></tr></thead>
                  <tbody>
                    <tr><td><code>GET {endpoint}</code></td><td><code>{title?, steps?, state?, closed?, log?}</code>. Solo si no pasas <code>state</code>; <code>reload()</code> la vuelve a pedir.</td></tr>
                    <tr><td><code>POST {endpoint}/steps/{id}/files</code></td><td><code>FormData</code> con cada foto o archivo nuevo en <code>files</code>; responde <code>{files: [{url, id?}]}</code> en el mismo orden. Va antes del cambio.</td></tr>
                    <tr><td><code>PATCH {endpoint}/steps/{id}</code></td><td><code>{status, evidence, reason?, note?, clientId}</code>: la evidencia son metadatos (<code>{name, type, size, url}</code>, la firma <code>{svg, meta}</code>, el valor). <code>clientId</code> sirve para no aplicar dos veces un reintento. Si responde un estado (<code>{status, …}</code>), ese queda.</td></tr>
                    <tr><td><code>POST {endpoint}/close</code></td><td><code>{clientId, at}</code>: cerrar el procedimiento.</td></tr>
                    <tr><td>Sin red, <code>408</code>, <code>429</code>, <code>502</code>–<code>504</code></td><td>El cambio espera y se reintenta (1 s, 2 s, 4 s… hasta 30 s, y al volver el evento <code>online</code>).</td></tr>
                    <tr><td>Otro error</td><td>Ese paso vuelve a como estaba; <code>{message}</code> va en el aviso y en <code>nx-checklist-error</code>.</td></tr>
                  </tbody>
                </table>
              </div>

                  <button role="tab" aria-selected="true">HTML</button>

              <h2>API</h2>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
                  <tbody>
                    <tr><td><code>steps</code></td><td>JSON: <code>[{id, title, hint?, section?, assignee?: {id, name}, due?, required?, evidence?, dependsOn?, canSkip?}]</code>. <code>due</code>: con hora local («2026-09-28T17:00»), con zona, o solo el día (vence al terminar ese día).</td></tr>
                    <tr><td><code>evidence</code></td><td><code>[{type: "photo"|"file"|"signature"|"note"|"number"|"choice", label?, min?, max?, unit?, options?, count?, accept?, required?}]</code>. En <code>options</code>, <code>{value, label, note: true}</code> exige nota; «No conforme» la exige sin decirlo.</td></tr>
                    <tr><td><code>state</code></td><td>JSON por <code>id</code>: <code>{status: "todo"|"done"|"skipped"|"blocked", by, at, evidence, reason?, note?}</code>. Sin él, <code>GET {endpoint}</code>.</td></tr>
                    <tr><td><code>endpoint</code>, <code>me</code>, <code>handoff</code></td><td>La base de las rutas; quién usa la pantalla (<code>{id, name}</code>); la base de <code>&lt;nx-handoff&gt;</code> para «Tomar con el celular».</td></tr>
                    <tr><td><code>sequential</code></td><td>Vacío: todo en orden. Una lista JSON (o un nombre): solo esas secciones. Omitidos y opcionales no detienen a nadie.</td></tr>
                    <tr><td><code>mode</code>, <code>items</code></td><td><code>run</code> (por defecto) o <code>summary</code> con <code>[{id, title, href?, done, total, overdue?, assignee?, due?}]</code>.</td></tr>
                    <tr><td><code>heading</code>, <code>readonly</code>, <code>disabled</code>, <code>locale</code>, <code>labels</code></td><td>Nombre (si el servidor no manda <code>title</code>), solo lectura, textos (<code>CHECKLIST_LABELS</code>; «uno|varios» con <code>{n}</code>) y formato de fechas y números.</td></tr>
                    <tr><td><code>open(stepId)</code>, <code>reload()</code></td><td>Abrir un paso; volver a traer el procedimiento (lo que falta por enviar queda encima).</td></tr>
                    <tr><td><code>progress</code>, <code>pending</code>, <code>closed</code></td><td><code>{done, total, required, requiredDone, skipped, overdue, complete}</code>; los cambios sin enviar <code>[{clientId, step, status, at}]</code>; quién lo cerró.</td></tr>
                    <tr><td>Eventos</td><td><code>nx-checklist-change</code> <code>{step, status, evidence, reason?, note?}</code>, <code>nx-checklist-complete</code> <code>{by, at, progress}</code> (cancelable), <code>nx-checklist-open</code> <code>{item}</code> (summary, cancelable), <code>nx-checklist-error</code> <code>{message, step?, status?}</code>.</td></tr>
                    <tr><td>Funciones</td><td><code>checklistProgress</code>, <code>checklistBlocks</code>, <code>checklistDeps</code>, <code>checklistMissing</code>, <code>checklistInRange</code>, <code>checklistOverdue</code>, <code>checklistDueText</code>…: la misma lógica, para validar en un backend en JavaScript.</td></tr>
                  </tbody>
                </table>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>value</code></td><td>Una frase («los lunes a las 8») o una RRULE (<code>DTSTART:…</code> + <code>RRULE:…</code>, <code>RRULE:…</code> o <code>FREQ=…</code>). Al leer, la RRULE.</td></tr>
                <tr><td><code>rule</code>, <code>text</code>, <code>next</code></td><td>Solo lectura: la RRULE, la frase canónica y las próximas fechas (<code>Date[]</code>). <code>toJSON()</code> da <code>{rrule, text, holidays, next}</code>.</td></tr>
                <tr><td><code>start</code></td><td>Desde cuándo (ISO; por defecto hoy): el <code>DTSTART</code> si la frase no dice «desde…».</td></tr>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Sobrevive a recargar</td><td>Al conectar pide <code>GET {endpoint}?active=1</code> (en curso y recientes de las últimas 24 h). Los ids en curso también se guardan en <code>localStorage</code>: si el servidor no los lista, se piden uno por uno.</td></tr>
                <tr><td>Una sola conexión</td><td><code>stream</code> (SSE o NDJSON) con los eventos de todos los trabajos, abierto solo mientras hay alguno en curso. Si se corta, reconecta a 1 s, 2 s, 4 s… hasta 30 s (o lo que diga <code>Retry-After</code>) y retoma con <code>Last-Event-ID</code> y <code>?after=</code>.</td></tr>
                <tr><td>Sin stream</td><td>Sondeo de <code>GET {endpoint}/{id}</code> cada <code>poll</code> segundos (3), cada vez más espaciado si nada cambia y cada 30 s con la pestaña en segundo plano.</td></tr>
                <tr><td>Tiempo restante</td><td>Una media móvil de la velocidad: un tramo lento o una ráfaga no lo hacen saltar. Sin total del servidor, la barra es indeterminada y no se estima.</td></tr>
                <tr><td>Varias pestañas</td><td>Una sola mantiene la conexión (<code>BroadcastChannel</code> y <code>navigator.locks</code>) y comparte los eventos; al cerrarse, otra toma su lugar.</td></tr>
                <tr><td>Al terminar</td><td><code>nx-jobs-done</code>, un aviso en la página si el panel está cerrado y, con <code>notify</code>, una notificación del sistema si la pestaña está oculta (el permiso se pide al lanzar, nunca al cargar).</td></tr>
              </tbody>
            </table>
          </div>

    jobs.track(respuesta.jobId);

    jobs.addEventListener("nx-jobs-done", (e) =&gt; bandeja.add(e.detail.job));</code></pre>

    let jobs!: NxJobs;

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>endpoint</code>, <code>stream</code>, <code>poll</code></td><td>La API de trabajos (del mismo origen), el stream de eventos y los segundos entre consultas sin stream (3).</td></tr>
                <tr><td><code>notify</code>, <code>always</code>, <code>recent</code></td><td>Notificación del sistema al terminar con la pestaña oculta; la píldora (tenue) también sin trabajos; cuántos terminados quedan en «Recientes» (10).</td></tr>
                <tr><td><code>labels</code>, <code>locale</code>, <code>disabled</code></td><td>Textos (<code>JOBS_LABELS</code>), formato de números y horas, y la píldora apagada.</td></tr>
                <tr><td><code>start({type, title, params})</code></td><td><code>POST {endpoint}</code>: devuelve el trabajo y lo sigue.</td></tr>
                <tr><td><code>track(id | job)</code>, <code>cancel(id)</code>, <code>retry(id)</code>, <code>dismiss(id)</code></td><td>Seguir uno creado por la app, cancelar (<code>POST /{id}/cancel</code>), reintentar lo que falló (<code>POST /{id}/retry</code>), quitar de la lista.</td></tr>
                <tr><td><code>show()</code>, <code>hide()</code>, <code>jobs</code>, <code>active</code></td><td>El panel; todos los trabajos (en curso y recientes) y solo los en curso.</td></tr>

              </tbody>
            </table>

    <template id="page-ai">
      <p class="eyebrow">Componentes</p>
      <h1>IA <code class="tag">&lt;nx-ai-answer&gt;</code></h1>
      <p class="lead">
        Preguntar y ver a la IA pensar: los pasos en vivo, la respuesta en streaming con citas que iluminan su fuente, y
        al final un resumen plegable, acciones y valoración. No depende de ningún modelo: habla un protocolo de streaming
        que cualquier backend puede emitir.
      </p>

      <div class="ai-demo">
        <nx-ai-answer id="ai-demo" endpoint="/demo/ai" feedback></nx-ai-answer>
      </div>
      <ol class="stage__log btn-events" id="ai-log"></ol>

      <h2>Protocolo</h2>
      <p>
        Una línea por evento, en NDJSON o como <code>data:</code> de SSE. El componente hace <code>POST</code> a
        <code>endpoint</code> con <code>{"question", "context"}</code>. Un tipo que no conoce se ignora, así que el backend
        puede evolucionar sin romper versiones viejas.
      </p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Evento</th><th>Ejemplo</th></tr></thead>
          <tbody>
            <tr><td><code>step</code></td><td><code>{"type":"step","id":"s1","label":"Consultando costos","status":"run"}</code> → luego <code>"status":"done"</code> (o <code>"error"</code>) con <code>"detail"</code> opcional.</td></tr>
            <tr><td><code>text</code></td><td><code>{"type":"text","delta":"El costo subió **11,4 %**[^mayor]"}</code>. Markdown mínimo: <code>**negrita**</code>, <code>`código`</code>, listas con <code>- </code>, párrafos. <code>[^id]</code> cita una fuente. Nunca HTML.</td></tr>
            <tr><td><code>source</code></td><td><code>{"type":"source","id":"mayor","title":"Libro mayor · agosto","detail":"…","href":"/…"}</code></td></tr>
            <tr><td><code>action</code></td><td><code>{"type":"action","label":"Ver órdenes","href":"/…"}</code> (enlace) o <code>{"type":"action","label":"Redactar reclamo","id":"reclamo","data":{…}}</code> (emite <code>nx-ai-action</code>).</td></tr>
            <tr><td><code>note</code></td><td><code>{"type":"note","label":"cifras verificadas","tone":"success"}</code>: chip junto al resumen (<code>neutral</code>, <code>success</code>, <code>warning</code>, <code>danger</code>).</td></tr>
            <tr><td><code>error</code>, <code>done</code></td><td><code>{"type":"error","message":"…"}</code> termina con el mensaje; <code>{"type":"done"}</code> (o <code>[DONE]</code>, o cerrar el stream) termina bien.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
          <button role="tab" aria-selected="false">Backend</button>
          <button role="tab" aria-selected="false">Transporte propio</button>
        </div>
        <pre role="tabpanel"><code>&lt;nx-ai-answer id="ai" endpoint="/ai/preguntar" feedback&gt;&lt;/nx-ai-answer&gt;

ai.suggestions = ["¿Qué proveedores se retrasaron este mes?"];
ai.context = { registro: 2291 };            // viaja con cada pregunta
ai.addEventListener("nx-ai-action", (e) =&gt; abrirReclamo(e.detail.data));
ai.addEventListener("nx-ai-feedback", (e) =&gt; guardarVoto(e.detail));</code></pre>

  onAction={(e) =&gt; navigate(`/reclamos/nuevo?proveedor=${e.detail.data.proveedor}`)} /&gt;</code></pre>
        <pre role="tabpanel" hidden><code>// Cualquier servidor, cualquier modelo: solo escribe líneas.
res.setHeader("Content-Type", "application/x-ndjson");
const send = (e) =&gt; res.write(JSON.stringify(e) + "\n");

send({ type: "step", id: "q", label: "Consultando órdenes", status: "run" });
const ordenes = await db.ordenesRetrasadas();
send({ type: "step", id: "q", status: "done", detail: `${ordenes.length} órdenes` });
ordenes.forEach((o) =&gt; send({ type: "source", id: o.id, title: o.titulo, href: o.url }));

for await (const trozo of modelo.stream(pregunta, ordenes)) send({ type: "text", delta: trozo });

      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>endpoint</code>, <code>method</code></td><td>URL que responde con el protocolo (<code>POST</code> por defecto, cuerpo <code>{question, context}</code>).</td></tr>
            <tr><td><code>question</code></td><td>Pregunta inicial; con <code>endpoint</code> se pregunta al conectar.</td></tr>
            <tr><td><code>suggestions</code>, <code>placeholder</code></td><td>Preguntas sugeridas antes de la primera, y el texto de la caja.</td></tr>
            <tr><td><code>context</code></td><td>Datos (JSON) que viajan con cada pregunta: el registro que se está viendo, los filtros…</td></tr>
