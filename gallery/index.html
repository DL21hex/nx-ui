    <!-- ================================================================ Introducción -->
    <template id="page-intro">
      <p class="eyebrow">Empezar</p>
      <h1>Componentes web ligeros, listos para BDUI</h1>
      <p class="lead">
        nx32-elements es una librería de Custom Elements <strong>sin dependencias</strong>. Se usa igual en una página HTML
        plana, en SolidJS o pintada desde un JSON que manda el backend.
      </p>
      <ul class="facts">
        <li><strong>0</strong> dependencias en tiempo de ejecución</li>
        <li><strong data-size="sidemenu">≈5 KB</strong> el sidemenu (min + gzip)</li>
        <li><strong>100%</strong> props serializables en JSON</li>
      </ul>

      <h2>Principios</h2>
      <ol class="principles">
        <li><strong>Primero una librería normal.</strong> Atributos para lo simple, propiedades para los datos, eventos para las acciones, slots para tu contenido.</li>
        <li><strong>BDUI sin costo.</strong> Ninguna prop es una función: todo lo que acepta un componente puede venir del backend. <code>nx32-elements/bdui</code> es un adaptador opcional de ~25 líneas.</li>
        <li><strong>El navegador hace el trabajo pesado.</strong> Popover API para flotantes y drawer: capa superior, clic fuera, Escape y foco, gratis.</li>
        <li><strong>Neutro y tematizable.</strong> Todo el color sale de variables <code>--nx-*</code>; claro y oscuro con <code>light-dark()</code>.</li>
      </ol>

      <h2>Instalación</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">Módulos (ESM)</button>
          <button role="tab" aria-selected="false">SolidJS</button>
        </div>
        <pre role="tabpanel"><code>&lt;link rel="stylesheet" href="nx32-elements.css"&gt;
&lt;script src="nx32-elements.iife.js"&gt;&lt;/script&gt;   &lt;!-- trae los íconos Lucide ya registrados --&gt;</code></pre>
        <pre role="tabpanel" hidden><code>import "nx32-elements/nx32-elements.css";
import { registerIcons } from "nx32-elements";   // registra &lt;nx-sidemenu&gt;
import { lucide } from "nx32-elements/icons";     // opcional
registerIcons(lucide);</code></pre>
        <pre role="tabpanel" hidden><code>import "nx32-elements/nx32-elements.css";
import { SideMenu } from "nx32-elements/solid/sidemenu";   // tipos JSX + envoltorio</code></pre>
      </div>

      <h2>Compatibilidad</h2>
      <p>
        Navegadores de 2024 en adelante: Chrome/Edge 123+, Safari 17.5+, Firefox 125+ (Popover API y
        <code>light-dark()</code>). Importar la librería en el servidor (SSR) no lanza: los elementos se registran
        solo en el navegador.
      </p>
    </template>

    <!-- ================================================================ Temas -->

      <h1>Temas y tokens</h1>
      <p class="lead">
        Toda la paleta es neutra y sale de variables CSS. Redefine las que quieras para aplicar tu marca; el modo
        oscuro las acompaña solo.
      </p>
      <h2>Paletas</h2>
      <p>
        Nueve paletas listas: elige una y se aplica a toda la galería. En tu proyecto basta con
        <code>nx32-elements/palettes.css</code> y <code>&lt;html data-nx-palette="oceano"&gt;</code>; también sirve en una zona de la
        página.
      </p>
      <div class="palettes" id="palettes" role="radiogroup" aria-label="Paleta"></div>

      <h2>Acento a mano</h2>
      <div class="brand-picker">
        <label>Acento <input type="color" id="primary-picker" value="#3b6ff5" /></label>
        <button type="button" class="btn" id="primary-reset">Restablecer</button>
        <span class="hint">Cambia <code>--nx-primary</code> en vivo, en toda la galería.</span>
      </div>
      <div class="swatches" id="swatches"></div>
      <h2>Aplicar tu marca</h2>
      <pre><code>/* Tu propia paleta: solo los parámetros; claro, oscuro y todos los derivados salen solos. */
[data-nx-palette="mi-marca"] {
  --nx-accent-h: 200;        /* tono del acento (0–360) */
  --nx-accent-c: 0.14;       /* croma: cuánto color (0 = gris) */
  --nx-accent-l: 0.55;       /* luminosidad en claro; --nx-accent-l-dark en oscuro */
  --nx-neutral-h: 210;       /* tono de los grises */
  --nx-tint: 1.8;            /* cuánto color llevan los grises (1 = casi nada) */
}

/* O fijar un token directamente */
:root { --nx-font-sans: "Geist Sans", system-ui, sans-serif; }
/* Forzar tema: .dark / .light o data-theme="dark|light" en cualquier ancestro */</code></pre>

    <!-- ================================================================ Captura -->
    <template id="page-capture">
      <p class="eyebrow">Componentes</p>
      <h1>Captura de documentos <code class="tag">&lt;nx-doc-capture&gt;</code></h1>
      <p class="lead">
        Sueltas una factura y el formulario se llena solo. Cada dato trae su confianza y su evidencia en el documento; lo
        dudoso se revisa con un clic, las validaciones cruzadas avisan, y nada se registra sin que una persona confirme.
      </p>
      <p class="sel-tip">
        Usa la factura de ejemplo (o suelta cualquier archivo: la demo siempre «lee» la misma). Pasa el mouse por un campo o
        por el documento, corrige «Vence» y registra.
      </p>
      <div class="cap-actions">
        <nx-button id="cap-sample" label="Usar la factura de ejemplo" icon="file-text" variant="primary" log-mode="none"></nx-button>
      </div>
      <nx-doc-capture id="cap-demo" endpoint="/demo/capture" action="/demo/capture/registrar"></nx-doc-capture>
      <ol class="stage__log btn-events" id="cap-log"></ol>

      <h2>Protocolo</h2>
      <p>
        El mismo transporte que la IA (NDJSON o <code>data:</code> de SSE). El componente hace <code>POST</code> multipart
        (campo <code>file</code>) a <code>endpoint</code>. Los recuadros van en coordenadas 0–1 de la página.
      </p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Evento</th><th>Ejemplo</th></tr></thead>
          <tbody>
            <tr><td><code>page</code></td><td><code>{"type":"page","n":1,"src":"/docs/7/p1.png","width":1240,"height":1754}</code>: cada página como imagen (el PDF ya rasterizado).</td></tr>
            <tr><td><code>field</code></td><td><code>{"type":"field","key":"nit","value":"900.123.456-7","confidence":0.99,"box":{"page":1,"x":0.06,"y":0.07,"w":0.2,"h":0.02}}</code>. Opcionales: <code>detail</code> (una línea bajo el campo), <code>hint</code> y <code>suggest</code> (para lo dudoso). Una celda de tabla: <code>"key":"items.0.cantidad"</code>.</td></tr>
            <tr><td><code>check</code></td><td><code>{"type":"check","id":"iva","status":"ok","message":"El IVA es el 19 %","fields":["iva","subtotal"]}</code>. <code>error</code> bloquea el registro; <code>warn</code> solo avisa.</td></tr>
            <tr><td><code>error</code>, <code>done</code></td><td>Como en la IA. Cerrar el stream también termina.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
          <button role="tab" aria-selected="false">BDUI</button>
        </div>
        <pre role="tabpanel"><code>&lt;nx-doc-capture id="cap" endpoint="/compras/facturas/leer" action="/compras/facturas/registrar"&gt;&lt;/nx-doc-capture&gt;

cap.schema = [
  { key: "proveedor", label: "Proveedor", section: "Encabezado" },
  { key: "nit", label: "NIT", section: "Encabezado" },
  { key: "vence", label: "Vence", type: "date", section: "Encabezado" },
  { key: "items", label: "Ítems", type: "table", section: "Detalle",
    columns: [{ key: "desc", label: "Descripción" }, { key: "cantidad", label: "Cant.", type: "number" }] },
  { key: "total", label: "Total", type: "money", section: "Totales" },
];
cap.addEventListener("nx-capture-submit", (e) =&gt; console.log(e.detail.values, e.detail.confirmed));</code></pre>
        <pre role="tabpanel" hidden><code>import { DocCapture } from "nx32-elements/solid/capture";

&lt;DocCapture schema={SCHEMA} endpoint="/compras/facturas/leer" reviewBelow={0.85}
  onSubmit={(e) =&gt; { e.preventDefault(); registrar(e.detail.values); }} /&gt;</code></pre>
        <pre role="tabpanel" hidden><code>{ "component": "DocCapture", "props": {
    "schema": [ … ],
    "endpoint": "/compras/facturas/leer",
    "action": "/compras/facturas/registrar",
    "reviewBelow": 0.8 } }</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>schema</code></td><td>Campos <code>{key, label, type?, section?}</code> (tipos <code>text</code>, <code>date</code>, <code>number</code>, <code>money</code>) y tablas <code>{key, label, type: "table", columns}</code>.</td></tr>
            <tr><td><code>endpoint</code></td><td>Lee el documento: <code>POST</code> multipart (<code>file</code>) y responde con el protocolo.</td></tr>
            <tr><td><code>action</code></td><td>Registra: <code>POST</code> JSON <code>{values, confirmed}</code>, con el botón ocupado mientras tanto. Sin ella, solo el evento.</td></tr>
            <tr><td><code>review-below</code></td><td>Confianza bajo la cual un campo exige revisión (0–1, por defecto 0,8).</td></tr>
            <tr><td><code>accept</code>, <code>labels</code></td><td>Tipos de archivo del selector y textos de la interfaz.</td></tr>
            <tr><td><code>extract(file)</code></td><td>Leer un archivo desde código (<code>nx-capture-file</code>, cancelable, deja usar otro transporte).</td></tr>
            <tr><td><code>begin()</code>, <code>push(evento)</code>, <code>end()</code>, <code>setCheck()</code>, <code>reset()</code></td><td>Transporte propio; recalcular una validación tras una corrección; volver a la zona de soltar.</td></tr>
            <tr><td><code>values</code>, <code>pending</code>, <code>state</code></td><td>Lo capturado (tablas como arreglos de filas), los campos por revisar y el estado.</td></tr>
            <tr><td>Eventos</td><td><code>nx-capture-start</code>, <code>nx-capture-done</code> <code>{values, pending}</code>, <code>nx-capture-change</code> <code>{key, value, values}</code>, <code>nx-capture-submit</code> <code>{values, confirmed, checks}</code> (cancelable).</td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- ================================================================ Tabla -->
    <template id="page-grid">
      <p class="eyebrow">Componentes</p>
      <h1>Tabla <code class="tag">&lt;nx-grid&gt;</code></h1>
      <p class="lead">
        Una tabla que se explora sola. El embudo de cada columna abre su filtro: una lista, un rango, fechas o
        «contiene», según el dato. También filtras con el panel de filtros o desde una celda (clic derecho),
        trabajas como en una hoja de cálculo, agrupas con subtotales y exportas a Excel.
      </p>
      <div class="grid-try">
        <select class="grid-locale" aria-label="Formato (locale)">
          <option value="es-CO">es-CO</option>
          <option value="en-US">en-US</option>
          <option value="pt-BR">pt-BR</option>
          <option value="de-DE">de-DE</option>
        </select>
        <span class="grid-mode" role="group" aria-label="Origen de los datos">
          <button type="button" data-grid-mode="client" aria-pressed="true">Cliente · 600</button>
          <button type="button" data-grid-mode="server" aria-pressed="false">Servidor · 20.000</button>
        </span>
      </div>
      <nx-grid id="grid-demo" locale="es-CO" facets-open filename="necesidades-de-compra" views-storage="nx-galeria:compras"></nx-grid>
      <ol class="stage__log btn-events" id="grid-log"></ol>

      <h2>Cómo se usa</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Para</th><th>Haz esto</th></tr></thead>
          <tbody>
            <tr><td>Filtrar una columna</td><td>El embudo de la cabecera (aparece al pasar por ella; con <kbd>Alt</kbd>+<kbd>↓</kbd> desde la tabla o la cabecera). Estados y texto con pocos valores: una lista con cuántas filas quedan en cada uno y «Solo» para quedarse con uno. Montos: barras, manijas y dos campos que aceptan «5 M» o «5 millones». Fechas: «Antes de hoy», «Próximos 30 días», «Este mes»… (se guardan relativos) o entre dos fechas. Lo demás: «contiene». Se aplica mientras eliges; el chip lo vuelve a abrir.</td></tr>
            <tr><td>Buscar</td><td>La caja «Buscar en la tabla» deja las filas que contienen lo que escribes en alguna columna visible, sin tildes ni mayúsculas («quimicos» encuentra «Químicos», «8.000.000» o «8000000» el monto). Se suma a los filtros; la ✕ o <kbd>Esc</kbd> la borran.</td></tr>
            <tr><td>Guardar una vista</td><td>Filtra, ordena, agrupa, esconde columnas («Columnas») o cambia su ancho (arrastra el borde de una cabecera) y usa «Vistas → Guardar como vista nueva…» o «Guardar como vista» junto a los chips. Se aplica con un clic; si cambias algo, el botón dice «modificada». Se guarda en <code>localStorage</code> con <code>views-storage</code>.</td></tr>
            <tr><td>Filtrar desde una celda</td><td>Clic derecho (o <kbd>Mayús</kbd>+<kbd>F10</kbd>): «Solo Aceros», «Sin Aceros», «Desde $ 5.000.000». Si no queda ninguna fila, la tabla propone qué filtro quitar y cuántas volverían.</td></tr>
            <tr><td>Panel de filtros</td><td>Las opciones de una faceta se suman y las facetas se combinan entre sí. Cada conteo refleja los demás filtros; una opción en 0 queda deshabilitada.</td></tr>
            <tr><td>Hoja de cálculo</td><td>Flechas, <kbd>Inicio</kbd>/<kbd>Fin</kbd>, <kbd>RePág</kbd>/<kbd>AvPág</kbd>, <kbd>Mayús</kbd> para seleccionar un rango (o arrastrar); el pie muestra suma, promedio, mínimo y máximo. <kbd>Ctrl</kbd>+<kbd>C</kbd> copia para pegar en Excel, y <kbd>Ctrl</kbd>+<kbd>V</kbd> pega desde Excel en las columnas editables.</td></tr>
            <tr><td>Editar</td><td>Doble clic, <kbd>Enter</kbd>, <kbd>F2</kbd> o simplemente escribir. <kbd>Enter</kbd> guarda y baja, <kbd>Tab</kbd> guarda y avanza, <kbd>Esc</kbd> cancela, <kbd>Supr</kbd> borra. Las celdas editadas llevan una marca. <kbd>Ctrl</kbd>+<kbd>Z</kbd> deshace y <kbd>Ctrl</kbd>+<kbd>Y</kbd> rehace (también con los botones de la barra).</td></tr>
            <tr><td>Desplazar a lo ancho</td><td>La tabla lleva su barra horizontal también arriba (la propia queda al pie de su caja): sin bajar hasta el final para moverla. Es fina y se ensancha al acercar el puntero. Solo aparece si las columnas no caben; prueba a esconder columnas con «Columnas» hasta que quepan.</td></tr>
            <tr><td>Con el dedo</td><td>Un toque marca la celda y otro sobre la misma la edita o abre la fila. La pulsación larga abre el menú de la celda. Arrastrar desplaza la tabla y, al llegar a su final, sigue la página.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Protocolo</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Endpoint</th><th>Petición → respuesta</th></tr></thead>
          <tbody>
            <tr><td><code>source</code></td><td><code>POST {"offset":0,"limit":100,"sort":{"key":"monto","dir":-1},"filters":[…],"search":"aceros"}</code> (<code>search</code> solo si hay algo escrito) → <code>{"rows":[…],"total":20000,"histograms":{"monto":{"kind":"bins","labels":[…],"counts":[…],"filtered":[…],"edges":[…]}},"facets":[{"key":"prov","label":"Proveedor","options":[{"value":"…","count":12}]}],"totals":{"monto":…}}</code>. Los agregados son opcionales: <code>histograms</code> da las barras del filtro de montos y fechas, y <code>facets</code> los valores (con su conteo) de las listas y del panel de filtros. Sin ellos, esos filtros quedan con sus campos.</td></tr>
            <tr><td><code>client-max</code></td><td>Opcional, con <code>source</code>. Si el <code>total</code> de la primera página cabe en el tope, la tabla pide una vez <code>{"offset":0,"limit":client-max + 1,"sort":null,"filters":[]}</code> y sigue en el cliente (conteos exactos, filtros al instante, agrupar). Si no cabe, no pide nada más. <code>grid.mode</code> dice dónde quedó; <code>refresh()</code> vuelve a traer y a mirar.</td></tr>
            <tr><td>Filtros</td><td><code>{"key","op":"in","values":[…]}</code>, <code>"notIn"</code>, <code>{"op":"range","min","max"}</code> (<code>min</code> incluido, <code>max</code> excluido; números o fechas ISO; con <code>"rel":"month"</code>, <code>"past"</code>, <code>"last30"</code>, <code>"next30"</code>, <code>"lastMonth"</code> o <code>"year"</code> el tramo se recalcula con la fecha de hoy) y <code>{"op":"contains","value"}</code>.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
          <button role="tab" aria-selected="false">BDUI</button>
        </div>
        <pre role="tabpanel"><code>&lt;nx-grid id="grid" facets-open&gt;&lt;/nx-grid&gt;

grid.columns = [
  { key: "oc", label: "Pedido" },
  { key: "prov", label: "Proveedor" },
  { key: "fecha", label: "Fecha", type: "date" },
  { key: "estado", label: "Estado", type: "status", options: [{ value: "pend", label: "Pendiente", tone: "warning" }] },
  { key: "monto", label: "Monto", type: "money", editable: true },
];
grid.rows = pedidos;                 // o: grid.source = "/compras/pedidos/buscar"
grid.addEventListener("nx-grid-change", (e) =&gt; guardar(e.detail.changes));</code></pre>
        <pre role="tabpanel" hidden><code>import { Grid } from "nx32-elements/solid/grid";

&lt;Grid columns={COLUMNAS} source="/compras/pedidos/buscar" facetsOpen
  onChange={(e) =&gt; { if (!puedeEditar()) e.preventDefault(); else guardar(e.detail.changes); }} /&gt;</code></pre>
        <pre role="tabpanel" hidden><code>{ "component": "Grid", "props": {
    "columns": [ … ],
    "source": "/compras/pedidos/buscar",
    "groupBy": "prov",
    "filters": [{ "key": "estado", "op": "in", "values": ["pend"] }] } }</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>columns</code></td><td><code>{key, label, type?, width?, editable?, options?, histogram?, facet?, currency?, link?, avatar?}</code>. Tipos: <code>text</code>, <code>number</code>, <code>money</code>, <code>date</code> (ISO) y <code>status</code> (con <code>options</code> y tono).</td></tr>
            <tr><td><code>rows</code> / <code>source</code></td><td>Filas en el cliente (se copian: las ediciones quedan en <code>grid.rows</code>) o URL de datos en el servidor.</td></tr>
            <tr><td><code>filters</code>, <code>sort</code>, <code>group-by</code></td><td>El estado, serializable. Agrupar solo funciona en el cliente.</td></tr>
            <tr><td><code>search</code></td><td>Lo que dice la caja «Buscar en la tabla» (asignarlo busca). No va en las vistas.</td></tr>
            <tr><td><code>locale</code></td><td>Formato de números, montos, fechas, lo que se escribe en una celda y el orden alfabético (<code>es-CO</code>, <code>en-US</code>…). Por defecto, el <code>lang</code> de la página. Con <code>currency</code> ISO en la columna (<code>"COP"</code>, <code>"USD"</code>), el formato de moneda del locale.</td></tr>
            <tr><td><code>facets-open</code>, <code>height</code>, <code>row-key</code>, <code>filename</code>, <code>labels</code></td><td>Panel de filtros abierto, alto en px (o <code>--nx-grid-height</code>), campo identificador (<code>id</code>), nombre del .xlsx y textos.</td></tr>
            <tr><td><code>top-scrollbar</code></td><td>La barra de desplazamiento horizontal también arriba de la tabla, solo si las columnas no caben a lo ancho (con mouse; en una pantalla táctil no se muestra). Es un espejo del scroller de la tabla (<code>aria-hidden</code>, fuera del orden del teclado): se mueven juntas. Viene encendida; <code>top-scrollbar="false"</code> la quita.</td></tr>
            <tr><td><code>clearFilters()</code>, <code>exportXlsx()</code>, <code>removeColumn(key)</code>, <code>refresh()</code></td><td>Lo mismo que la interfaz, desde código.</td></tr>
            <tr><td>Eventos</td><td><code>nx-grid-filter</code> <code>{filters, sort, groupBy, count}</code>, <code>nx-grid-change</code> <code>{changes: [{id, key, value, old}]}</code> (cancelable) y <code>nx-grid-columns</code> <code>{columns}</code>.</td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- ================================================================ Diálogos -->
    <template id="page-dialog">
      <p class="eyebrow">Componentes</p>
      <h1>Diálogos <code class="tag">&lt;nx-dialog&gt;</code></h1>
      <p class="lead">
        Cuatro formas de hacer lo que hoy se hace con un modal, cada una para su caso. Un modal que nace del botón, paneles
        que se apilan para profundizar sin perder contexto, deshacer en vez de preguntar, y cuando sí hay que preguntar,
        mostrar antes qué va a pasar.
      </p>

      <h2>A · El modal que nace del botón</h2>
      <p>
        Se expande desde el botón que lo abrió y vuelve a él. En móvil es una hoja que se arrastra hacia abajo para cerrar.
        Escribe algo y trata de cerrarlo: el aviso de cambios sin guardar aparece dentro del diálogo, no en otro modal.
      </p>
      <div class="dlg-row">
        <nx-button id="dlg-new-btn" label="Nuevo pedido" icon="receipt" variant="primary" log-mode="none"></nx-button>
        <button type="button" class="dlg-plain" popovertarget="dlg-new">Abrir sin JS (popovertarget)</button>
      </div>
      <nx-dialog id="dlg-new" heading="Nuevo pedido" description="Se envía a aprobación al guardar.">
        <form id="dlg-new-form" class="dlg-form">
          <label>Proveedor <input name="prov" placeholder="Aceros del Caribe" autocomplete="off" /></label>
          <div class="dlg-2">
            <label>Monto <input name="monto" inputmode="decimal" placeholder="$ 0" /></label>
            <label>Entrega <input name="fecha" type="date" /></label>
          </div>
          <label>Descripción <textarea name="nota" rows="3" placeholder="Lámina HR 3 mm ×40"></textarea></label>
        </form>
        <div slot="footer">
          <nx-button label="Cancelar" variant="ghost" log-mode="none" data-nx-close="cancel"></nx-button>
          <nx-button id="dlg-new-save" label="Guardar pedido" variant="primary"></nx-button>
        </div>
      </nx-dialog>

      <h2>B · Paneles apilados</h2>
      <p>
        Pedido → proveedor → factura: cada nivel se apila sobre el anterior, con migas para volver, y la lista sigue a la vista.
        El botón «atrás» del navegador cierra el nivel de arriba.
      </p>
      <ul class="dlg-list" id="dlg-orders"></ul>
      <nx-dialog id="dlg-order" mode="panel" url=""></nx-dialog>
      <nx-dialog id="dlg-prov" mode="panel" url=""></nx-dialog>
      <nx-dialog id="dlg-inv" mode="panel" url=""></nx-dialog>

      <h2>C · Deshacer en vez de confirmar</h2>
      <p>
        Anular no pregunta: ocurre al instante y se puede deshacer durante 7 segundos con el botón o
        <kbd>Ctrl</kbd>+<kbd>Z</kbd>. El backend recibe la orden cuando el tiempo termina.
      </p>
      <ul class="dlg-list" id="dlg-undo"></ul>

      <h2>D · Confirmación con impacto</h2>
      <p>
        Cuando sí hay que preguntar, el backend dice antes qué va a pasar (en streaming) y puede bloquear la acción con un
        motivo. Lo destructivo se confirma manteniendo pulsado el botón.
      </p>
      <div class="dlg-row">
        <nx-button id="dlg-c1" label="Anular OC-2291" variant="danger" log-mode="none"></nx-button>
        <nx-button id="dlg-c2" label="Anular OC-2310 (tiene un pago)" variant="secondary" log-mode="none"></nx-button>
      </div>
      <ol class="stage__log btn-events" id="dlg-log"></ol>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">Diálogo</button>
          <button role="tab" aria-selected="false">Deshacer</button>
          <button role="tab" aria-selected="false">Confirmar</button>
          <button role="tab" aria-selected="false">SolidJS</button>
        </div>
        <pre role="tabpanel"><code>&lt;button popovertarget="nuevo"&gt;Nuevo pedido&lt;/button&gt;   &lt;!-- o: const valor = await nuevo.show() --&gt;

&lt;nx-dialog id="nuevo" heading="Nuevo pedido"&gt;       &lt;!-- mode="panel" para apilar; url="" para «atrás» --&gt;
  &lt;form method="dialog"&gt;…&lt;/form&gt;
  &lt;div slot="footer"&gt;
    &lt;button data-nx-close&gt;Cancelar&lt;/button&gt;
    &lt;button onclick="guardar().then(() =&gt; { nuevo.dirty = false; nuevo.close('ok') })"&gt;Guardar&lt;/button&gt;
  &lt;/div&gt;
&lt;/nx-dialog&gt;</code></pre>
        <pre role="tabpanel" hidden><code>import { nxToast } from "nx32-elements/toast";

ocultar(fila);
const r = await nxToast({ message: "OC-2291 anulada", undo: true });
if (r === "undo") mostrar(fila);
else await fetch("/compras/oc/2291/anular", { method: "POST", keepalive: true });</code></pre>
        <pre role="tabpanel" hidden><code>import { nxConfirm } from "nx32-elements/confirm";

if (await nxConfirm({
  heading: "Anular OC-2291",
  confirmLabel: "Anular pedido",
  impact: "/compras/oc/2291/impacto",     // o una lista: [{ label, detail, tone }]
})) anular();

// El endpoint transmite, una línea por evento:
{"type":"impact","icon":"truck","label":"2 recepciones","detail":"se revierten"}
{"type":"block","message":"Ya tiene un pago: primero hay que reversarlo."}
{"type":"note","message":"Se notificará a 2 aprobadores."}
{"type":"done"}</code></pre>
        <pre role="tabpanel" hidden><code>import { Dialog } from "nx32-elements/solid/dialog";
import { nxConfirm } from "nx32-elements/confirm";
import { nxToast } from "nx32-elements/toast";

&lt;Dialog open={abierto()} onOpenChange={(e) =&gt; setAbierto(e.detail.open)} heading="Nuevo pedido"&gt;
  &lt;FormularioPedido /&gt;
&lt;/Dialog&gt;</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>heading</code>, <code>description</code></td><td>Título y bajada (el título da nombre accesible al diálogo).</td></tr>
            <tr><td><code>mode</code></td><td><code>modal</code> (por defecto) o <code>panel</code> (lateral, apilable, con migas). En móvil, los dos son hojas desde abajo.</td></tr>
            <tr><td><code>size</code></td><td><code>sm</code>, <code>md</code>, <code>lg</code> o <code>full</code>.</td></tr>
            <tr><td><code>persistent</code></td><td>Escape y el clic fuera no lo cierran.</td></tr>
            <tr><td><code>url</code></td><td>Al abrir agrega una entrada al historial (esa URL, o la actual con <code>""</code>): «atrás» lo cierra.</td></tr>
            <tr><td><code>open</code>, <code>show(origen?)</code>, <code>close(valor?)</code></td><td><code>show()</code> devuelve una promesa con el valor de cierre. Botones con <code>data-nx-close="valor"</code> y <code>&lt;form method="dialog"&gt;</code> cierran solos.</td></tr>
            <tr><td><code>dirty</code></td><td>Cambios sin guardar: se marca al escribir en un campo. Lo que cierra la persona pasa por el aviso; <code>close()</code> desde código no.</td></tr>
            <tr><td>Eventos</td><td><code>nx-dialog-close</code> <code>{reason, value}</code> (cancelable) y <code>nx-open-change</code> <code>{open, value, reason}</code>.</td></tr>
            <tr><td><code>nxToast(opciones)</code></td><td><code>{message, tone?, undo?, action?, duration?}</code> → <code>"undo" | "action" | "timeout" | "dismiss"</code>. Se pausa con el mouse o el foco encima.</td></tr>
            <tr><td><code>nxConfirm(opciones)</code></td><td><code>{heading, message?, impact?, body?, confirmLabel?, tone?, hold?}</code> → <code>true</code> o <code>false</code>.</td></tr>
            <tr><td><code>&lt;nx-button hold&gt;</code></td><td>Mantener pulsado (ms, 1000 por defecto) para activar. Con teclado, mantener <kbd>Enter</kbd> o <kbd>Espacio</kbd>.</td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- ================================================================ Paleta de comandos -->
    <template id="page-command">
      <p class="eyebrow">Componentes</p>
      <h1>Paleta de comandos <code class="tag">&lt;nx-command&gt;</code></h1>
      <p class="lead">
        Una sola caja para ir a cualquier pantalla, encontrar un registro, ejecutar una acción y, si nada de eso
        responde, preguntarle al asistente. Aprende: lo que eliges seguido sube, y sin escribir nada aparece en
        «Recientes».
      </p>
      <div class="dlg-row">
        <button type="button" class="cmd-open" popovertarget="cmd">
          <span>Busca una pantalla, un registro o una acción…</span> <kbd data-mod>Ctrl K</kbd>
        </button>
      </div>
      <p class="sel-tip">
        Es la misma paleta de toda la galería. Prueba <kbd>np</kbd> (iniciales de «Nuevo pedido»), <kbd>porteria</kbd>
        (sin tilde, sale del menú), <kbd>OC-23</kbd> o <kbd>ana</kbd> (registros del servidor), <kbd>cambiar pa</kbd>
        (un submenú: Escape vuelve), o una pregunta en la página del Directorio de TH, donde hay un asistente.
      </p>
      <ol class="stage__log btn-events" id="cmd-log"></ol>

      <h2>De dónde salen las entradas</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fuente</th><th>Qué aporta</th></tr></thead>
          <tbody>
            <tr><td><code>items</code></td><td>Entradas propias: acciones (<code>nx-command-select</code>), enlaces (<code>href</code>) y submenús (<code>children</code>). Cada una con <code>group</code>, <code>hint</code>, <code>keywords</code> (sinónimos), <code>icon</code> y <code>shortcut</code>.</td></tr>
            <tr><td><code>menu="id"</code></td><td>Las pantallas de un <code>&lt;nx-sidemenu&gt;</code>, con su ruta como pista («Ventas › Pedidos»). Se leen al abrir: siempre al día.</td></tr>
            <tr><td><code>source="/url"</code></td><td>Registros del servidor mientras se escribe: <code>GET /url?q=…</code> → <code>[{label, href, group, hint, …}]</code> (o <code>{items}</code>). Van después de las coincidencias locales, en el orden del servidor.</td></tr>
            <tr><td><code>agent="id"</code></td><td>Lo que se escribe se le puede preguntar a ese <code>&lt;nx-agent&gt;</code> (<code>nx-command-ask</code>, cancelable).</td></tr>
            <tr><td>Recientes</td><td>Lo que se elige se recuerda en <code>localStorage</code> (solo en ese navegador; <code>storage="none"</code> lo desactiva). Pesa más lo usado seguido y reciente: cada semana cuenta la mitad.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
        </div>
        <pre role="tabpanel"><code>&lt;button popovertarget="cmd"&gt;Buscar… ⌘K&lt;/button&gt;
&lt;nx-command id="cmd" menu="nav" source="/buscar" agent="asistente"&gt;&lt;/nx-command&gt;

cmd.items = [
  { id: "nuevo", label: "Nuevo pedido", group: "Acciones", keywords: ["crear"], shortcut: "N" },
  { id: "tema", label: "Cambiar tema", group: "Acciones",
    children: [{ id: "claro", label: "Claro" }, { id: "oscuro", label: "Oscuro" }] },
];
cmd.addEventListener("nx-command-select", (e) =&gt; ejecutar(e.detail.item.id));</code></pre>
        <pre role="tabpanel" hidden><code>import { Command } from "nx32-elements/solid/command";

&lt;Command menu="nav" source="/buscar" items={acciones()}
  onSelect={(e) =&gt; ejecutar(e.detail.item.id)} /&gt;</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>items</code>, <code>menu</code>, <code>source</code>, <code>agent</code></td><td>Las fuentes (arriba).</td></tr>
            <tr><td><code>hotkey</code></td><td>Atajo global (<code>"mod+k"</code>; <code>mod</code> es ⌘ o Ctrl). <code>"none"</code> lo quita. <code>&lt;button popovertarget&gt;</code> la abre sin JS.</td></tr>
            <tr><td><code>placeholder</code>, <code>limit</code>, <code>storage</code>, <code>labels</code></td><td>Texto de la caja, máximo de filas (50), clave de lo reciente y textos.</td></tr>
            <tr><td><code>show(q?)</code>, <code>hide()</code>, <code>clearHistory()</code></td><td>Abrir (con la consulta ya escrita), cerrar y olvidar lo reciente.</td></tr>
            <tr><td>Teclado</td><td><kbd>↑</kbd><kbd>↓</kbd> moverse, <kbd>↵</kbd> abrir, <kbd>⌘/Ctrl</kbd>+<kbd>↵</kbd> en otra pestaña, <kbd>Esc</kbd> sale del submenú y luego cierra, <kbd>⌫</kbd> vacío vuelve.</td></tr>
            <tr><td>Eventos</td><td><code>nx-command-select</code> <code>{item, query, newTab}</code> (cancelable), <code>nx-command-ask</code> <code>{query}</code> (cancelable), <code>nx-open-change</code>.</td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- ================================================================ Explicar cifras -->
    <template id="page-explain">
      <p class="eyebrow">Componentes</p>
      <h1>¿De dónde sale este número? <code class="tag">&lt;nx-explain&gt;</code></h1>
      <p class="lead">
        Cualquier cifra se abre en su desglose: la fórmula término a término, la comparación con otro período, las
        fuentes y una explicación breve. Cada término se puede abrir a su vez, hasta el documento de origen. Y lo que
        muestra se comprueba: si los términos no suman la cifra, lo dice.
      </p>
      <div class="xp-board" lang="es-CO">
        <article class="xp-card">
          <p class="xp-card__label">Factura FE-10482 · Aceros del Caribe</p>
          <p class="xp-card__value"><nx-explain endpoint="/demo/explain?id=factura">$ 10.601.500</nx-explain></p>
          <p class="xp-card__hint">Abre el subtotal y el IVA: cada uno tiene su propio desglose.</p>
        </article>
        <article class="xp-card">
          <p class="xp-card__label">Costo de producción · agosto</p>
          <p class="xp-card__value"><nx-explain endpoint="/demo/explain?id=costo">$ 482,3 M</nx-explain></p>
          <p class="xp-card__hint">Contra julio y contra el presupuesto; subir es malo.</p>
        </article>
        <article class="xp-card">
          <p class="xp-card__label">Margen bruto · agosto</p>
          <p class="xp-card__value"><nx-explain endpoint="/demo/explain?id=margen">31,4 %</nx-explain></p>
          <p class="xp-card__hint">Una división: aquí no hay suma que comprobar.</p>
        </article>
        <article class="xp-card">
          <p class="xp-card__label">Saldo en bancos · hoy</p>
          <p class="xp-card__value"><nx-explain endpoint="/demo/explain?id=bancos">$ 1.284,5 M</nx-explain></p>
          <p class="xp-card__hint">Los extractos no dan la cifra: el componente lo detecta.</p>
        </article>
      </div>
      <p lang="es-CO">
        También dentro de un texto: el IVA de esta factura es de
        <nx-explain id="xp-inline">$ 1.729.000</nx-explain>, y ese desglose viene en la propia página (<code>explanation</code>),
        sin pedir nada al servidor.
      </p>
      <ol class="stage__log btn-events" id="xp-log"></ol>

      <h2>Protocolo</h2>
      <p>
        Una línea por evento (NDJSON o <code>data:</code> de SSE). El componente hace <code>GET</code> a <code>endpoint</code>
        (o <code>POST</code> con <code>{context}</code> si <code>method="POST"</code>). Lo que no conoce lo ignora.
      </p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Evento</th><th>Ejemplo</th></tr></thead>
          <tbody>
            <tr><td><code>value</code></td><td><code>{"type":"value","label":"Total factura","value":10601500,"format":"money","currency":"COP"}</code>: la cifra. <code>format</code>: <code>money</code>, <code>number</code> o <code>percent</code> (0,19 = 19 %).</td></tr>
            <tr><td><code>term</code></td><td><code>{"type":"term","label":"IVA 19 %","value":1729000,"op":"+","detail":"…","source":"fe","explain":"/…","href":"/…"}</code>. <code>op</code>: <code>+</code> (por defecto), <code>-</code>, <code>×</code>, <code>÷</code> o <code>=</code> (subtotal). <code>explain</code> abre su desglose; <code>href</code>, el documento.</td></tr>
            <tr><td><code>total</code></td><td><code>{"type":"total","value":10601500}</code>: contra qué se comprueban los términos (por defecto, la cifra). Solo se comprueban sumas y restas.</td></tr>
            <tr><td><code>compare</code></td><td><code>{"type":"compare","label":"julio","value":432900000,"better":"down"}</code>: «▲ 11,4 % vs. julio», en rojo si subir es malo.</td></tr>
            <tr><td><code>source</code>, <code>text</code>, <code>note</code></td><td>Como en la IA: fuentes con enlace, explicación con <code>**negrita**</code> y citas <code>[^id]</code>, y marcas («cifras del cierre»).</td></tr>
            <tr><td><code>error</code>, <code>done</code></td><td>Terminan el desglose.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">En línea</button>
          <button role="tab" aria-selected="false">SolidJS</button>
        </div>
        <pre role="tabpanel"><code>Total: &lt;nx-explain endpoint="/explicar/factura/10482"&gt;$ 10.601.500&lt;/nx-explain&gt;</code></pre>
        <pre role="tabpanel" hidden><code>iva.explanation = [
  { type: "value", label: "IVA 19 %", value: 1729000, currency: "COP" },
  { type: "term", label: "Base gravable", value: 9100000 },
  { type: "term", label: "Tarifa general", value: 0.19, op: "×", format: "percent" },
];</code></pre>
        <pre role="tabpanel" hidden><code>import { Explain } from "nx32-elements/solid/explain";

&lt;Explain endpoint={`/explicar/factura/${id()}`}&gt;{total()}&lt;/Explain&gt;</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>endpoint</code>, <code>method</code>, <code>context</code></td><td>De dónde sale el desglose (<code>GET</code>; con <code>POST</code>, el cuerpo es <code>{context}</code>).</td></tr>
            <tr><td><code>explanation</code></td><td>El desglose ya armado: los mismos eventos, sin servidor.</td></tr>
            <tr><td><code>locale</code>, <code>labels</code></td><td>Formato de los números (o el <code>lang</code> de la página) y textos.</td></tr>
            <tr><td><code>show()</code>, <code>hide()</code>, <code>refresh()</code>, <code>state</code></td><td>Abrir, cerrar, olvidar lo traído (se guarda por URL) y el desglose que se ve.</td></tr>
            <tr><td>Teclado</td><td><kbd>↵</kbd> o <kbd>Espacio</kbd> abren; <kbd>Esc</kbd> vuelve un nivel y luego cierra; el foco vuelve a la cifra.</td></tr>
            <tr><td>Eventos</td><td><code>nx-open-change</code> <code>{open}</code>.</td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- ================================================================ Bandeja -->
    <template id="page-inbox">
      <p class="eyebrow">Componentes</p>
      <h1>Bandeja de aprobaciones <code class="tag">&lt;nx-inbox&gt;</code></h1>
      <p class="lead">
        Aprobar con el teclado: <kbd>J</kbd>/<kbd>K</kbd> para moverse, <kbd>A</kbd> para aprobar, <kbd>R</kbd> para
        rechazar con un motivo, <kbd>X</kbd> para seleccionar varios. Al decidir, el ítem sale y el siguiente queda listo.
        Nada pregunta «¿está seguro?»: todo se deshace mientras corre el tiempo.
      </p>
      <nx-inbox id="inbox-demo" heading="Órdenes por aprobar" locale="es-CO"></nx-inbox>
      <div class="dlg-row">
        <button type="button" class="dlg-plain" id="inbox-reset">Volver a llenar la bandeja</button>
      </div>
      <ol class="stage__log btn-events" id="inbox-log"></ol>

      <h2>Cómo decide</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Paso</th><th>Qué pasa</th></tr></thead>
          <tbody>
            <tr><td>Impacto</td><td>El detalle muestra qué pasa si se aprueba: una lista, o transmitido desde <code>impact</code> (el protocolo de <code>nxConfirm</code>, <code>POST {id, data}</code>). Un <code>block</code> impide aprobar ese ítem y lo marca con un candado. Prueba la OC-2310.</td></tr>
            <tr><td><code>nx-inbox-decide</code></td><td>Antes de aplicar (cancelable): <code>{decision, ids, items, reason?}</code>.</td></tr>
            <tr><td>Deshacer</td><td>La decisión se ve al instante y se puede deshacer durante <code>undo</code> ms (7000), con el aviso o <kbd>Ctrl</kbd>+<kbd>Z</kbd>: el ítem vuelve a su lugar (<code>nx-inbox-undo</code>).</td></tr>
            <tr><td><code>nx-inbox-commit</code></td><td>Cuando el tiempo termina (o la página se cierra): ahí la app llama al backend.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">

    <template id="page-survey">
      <p class="eyebrow">Componentes</p>
      <h1>Encuesta <code class="tag">&lt;nx-survey&gt;</code></h1>
      <p class="lead">
        Una encuesta que da gusto contestar: una pregunta a la vez y, arriba, lo que ya respondiste (un clic para
        cambiarlo). Se contesta también con el teclado, las preguntas aparecen según lo que respondes y usan tus
        respuestas. Al terminar ves cómo respondieron los demás, con tu respuesta resaltada.
      </p>
      <nx-survey id="survey-demo" heading="¿Cómo va todo por aquí?" description="Encuesta de clima laboral 2026. Es anónima: nadie ve tus respuestas por separado." storage="nx32-elements-demo-encuesta" locale="es-CO"></nx-survey>
      <div class="dlg-row">
        <button type="button" class="dlg-plain" id="survey-reset">Contestar de nuevo</button>
      </div>
      <p class="sel-tip">
        Prueba con el teclado: <kbd>A</kbd>, <kbd>B</kbd>… eligen, los números califican (<kbd>1</kbd><kbd>0</kbd> es un
        10), <kbd>Enter</kbd> sigue. Da un NPS bajo y luego uno alto: la pregunta siguiente cambia. Recarga la página a
        mitad de camino: te ofrece continuar donde quedaste.
      </p>
      <ol class="stage__log btn-events" id="survey-log"></ol>

      <h2>Tipos de pregunta</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Tipo</th><th>Cómo se contesta</th><th>Respuesta</th></tr></thead>
          <tbody>
            <tr><td><code>choice</code></td><td>Una opción (letra o clic); pasa sola a la siguiente. Con <code>other</code>, «Otra…» con texto.</td><td><code>"produccion"</code></td></tr>
            <tr><td><code>multi</code></td><td>Varias, con <code>min</code> y <code>max</code>.</td><td><code>["horario", "salud"]</code></td></tr>
            <tr><td><code>scale</code></td><td>Una fila de números (<code>min</code>–<code>max</code>, 1–5 por defecto). Con <code>nps</code>: 0–10 con los colores de detractores, pasivos y promotores.</td><td><code>9</code></td></tr>
            <tr><td><code>rating</code></td><td>Estrellas, o caras con <code>icon: "face"</code>.</td><td><code>4</code></td></tr>
            <tr><td><code>text</code></td><td>Una línea, o varias con <code>long</code>; <code>max</code> muestra el contador.</td><td><code>"Más capacitación"</code></td></tr>
            <tr><td><code>rank</code></td><td>Ordenar arrastrando, o con <kbd>↑</kbd><kbd>↓</kbd> sobre una opción.</td><td><code>["salario", "ambiente", …]</code></td></tr>
            <tr><td><code>slider</code></td><td>Un deslizador con el valor grande, con <code>format</code> (<code>money</code>, <code>percent</code>) o <code>unit</code>.</td><td><code>35</code></td></tr>
          </tbody>
        </table>
      </div>

      <h2>Lógica y resultados</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
          <tbody>
            <tr><td><code>when</code></td><td><code>{question, equals | in | lt | gt | answered}</code> (o una lista): la pregunta aparece solo si se cumple. Lo contestado en una rama que se abandona no se envía.</td></tr>
            <tr><td><code>{{id}}</code></td><td>En un título, inserta la respuesta a otra pregunta: «¿Qué cambiarías en {{area}}?» → «… en Producción?».</td></tr>
            <tr><td><code>action</code></td><td>Recibe <code>POST {answers, ms}</code> y puede responder con los resultados. O <code>nx-survey-submit</code> (cancelable) y <code>survey.results = …</code>.</td></tr>
            <tr><td><code>aggregate()</code></td><td>Arma los resultados desde muchas respuestas (conteos, promedios, NPS, posición promedio, palabras más repetidas). Sirve en el navegador o en un backend en JavaScript.</td></tr>
            <tr><td><code>storage</code></td><td>Guarda el borrador en <code>localStorage</code> y ofrece continuar.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">Backend</button>
          <button role="tab" aria-selected="false">SolidJS</button>

clima.questions = [
  { id: "area", type: "choice", title: "¿En qué área trabajas?", required: true,

  { id: "nps", type: "scale", nps: true, title: "¿Recomendarías trabajar en {{area}}?" },
  { id: "mejorar", type: "text", long: true, title: "¿Qué cambiarías?", when: { question: "nps", lt: 7 } },
];</code></pre>
        <pre role="tabpanel" hidden><code>import { aggregateSurvey } from "nx32-elements/survey";

app.post("/encuestas/clima", async (req, res) =&gt; {
  await db.respuestas.insert(req.body.answers);

});</code></pre>
        <pre role="tabpanel" hidden><code>import { Survey } from "nx32-elements/solid/survey";

&lt;Survey heading="¿Cómo va todo?" questions={preguntas} action="/encuestas/clima"

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>questions</code>, <code>answers</code>, <code>results</code></td><td>Las preguntas, las respuestas (se pueden precargar) y los resultados de todos.</td></tr>
            <tr><td><code>heading</code>, <code>description</code></td><td>La portada (sin <code>heading</code> empieza directo).</td></tr>
            <tr><td><code>action</code>, <code>storage</code>, <code>locale</code>, <code>labels</code></td><td>Dónde se envía, clave del borrador, formato de números y textos.</td></tr>
            <tr><td><code>start()</code>, <code>next()</code>, <code>back()</code>, <code>goto(i)</code>, <code>submit()</code>, <code>reset()</code></td><td>Moverse desde código; <code>screen</code> y <code>current</code> dicen dónde va.</td></tr>
            <tr><td>Eventos</td><td><code>nx-survey-change</code> <code>{id, value, answers}</code>, <code>nx-survey-submit</code> <code>{answers, ms}</code> (cancelable).</td></tr>
          </tbody>
        </table>
      </div>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>value</code></td><td><code>number | null</code>. El atributo es el valor inicial (y al que vuelve un <code>reset</code>). <code>text</code> lo da formateado.</td></tr>
                <tr><td><code>format</code>, <code>currency</code>, <code>decimals</code></td><td><code>number</code> (por defecto), <code>money</code> (con <code>currency</code> ISO o símbolo; «$» sin ella) o <code>percent</code>. Decimales que se ven y se guardan: 6 en números, 2 en montos y porcentajes.</td></tr>
                <tr><td><code>min</code>, <code>max</code>, <code>step</code></td><td>Límites (se recorta al confirmar y se avisa) y lo que suman las flechas, en las unidades que se ven (puntos en porcentaje).</td></tr>

                <tr><td><code>placeholder</code>, <code>align</code>, <code>label</code>, <code>locale</code>, <code>labels</code></td><td>Texto vacío, alineación (<code>end</code> en montos y porcentajes), nombre accesible si no hay <code>&lt;label&gt;</code>, formato y textos.</td></tr>
                <tr><td>Eventos</td><td><code>input</code> (cambia el número), <code>nx-change</code> <code>{value, text}</code> y <code>change</code> al confirmar.</td></tr>

              <tbody>
                <tr><td>Mover</td><td>Arrastrando (con el dedo, manteniendo pulsado) o con el teclado. Las demás tarjetas se apartan con una animación, y el tablero y la columna se desplazan solos al acercarse a los bordes.</td></tr>
                <tr><td><code>nx-kanban-move</code></td><td>Antes de aplicar (cancelable): <code>{card, from, fromIndex, to, index, via}</code>. Con <code>preventDefault()</code> la tarjeta vuelve.</td></tr>
                <tr><td><code>confirm</code></td><td>Si la columna destino lo tiene, se pide confirmación con impacto (<code>nxConfirm</code>, que se carga solo la primera vez). Si se niega, la tarjeta vuelve.</td></tr>
                <tr><td>Deshacer</td><td>El movimiento se ve al instante y se puede deshacer durante <code>undo</code> ms (7000), con el aviso o <kbd>Ctrl</kbd>+<kbd>Z</kbd> (<code>nx-kanban-undo</code>).</td></tr>
                <tr><td><code>nx-kanban-commit</code></td><td>Cuando el tiempo termina (o la página se cierra): ahí la app llama al backend.</td></tr>
                <tr><td><code>wip</code></td><td>Una columna por encima de su límite se marca en rojo («6/5»), y al llevarle una tarjeta lo avisa.</td></tr>

        <template id="page-history">
          <p class="eyebrow">Componentes</p>
          <h1>Historial <code class="tag">&lt;nx-history&gt;</code></h1>
          <p class="lead">
            La máquina del tiempo de un registro. Quién cambió qué y cuándo, agrupado por día, con los montos formateados y
            las notas largas como diferencias por palabras. Mueve el deslizador y el panel muestra la orden como estaba en ese
            momento, con lo que cambió desde entonces marcado. Un cambio que sigue vigente se revierte con un clic.
          </p>
          <nx-history id="history-demo" heading="OC-2291 · Aceros del Caribe" source="/demo/history/oc-2291" locale="es-CO"></nx-history>
          <p class="sel-tip">
            Enfoca el deslizador y usa <kbd>←</kbd> <kbd>→</kbd> para recorrer los 25 eventos (<kbd>Esc</kbd> vuelve al
            presente), o haz clic en la hora de un evento. Filtra por persona o por campo, busca «póliza», y baja hasta el
            final: los eventos más viejos llegan solos. Revierte el monto y deshazlo desde el aviso.
          </p>
          <ol class="stage__log btn-events" id="history-log"></ol>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Línea de tiempo</td><td>Del más nuevo al más viejo, agrupada por día («Hoy», «Ayer», «lunes 21 de septiembre»), con la hora relativa («hace 3 h») y el avatar o las iniciales de quien lo hizo. Cada cambio se lee «Estado: Por aprobar → Aprobada», con el formato de su campo (monto, fecha, estado con su tono).</td></tr>
                <tr><td>Textos largos</td><td>Una diferencia por palabras (subsecuencia común más larga): lo quitado tachado en rojo suave, lo agregado en verde suave.</td></tr>
                <tr><td>Viaje en el tiempo</td><td>El deslizador recorre los eventos. El registro de ese momento se reconstruye desde el de hoy, deshaciendo los cambios posteriores (<code>historyStateAt()</code>, puro). Lo que cambió desde entonces queda marcado con su valor actual; lo que tocó ese evento, resaltado.</td></tr>
                <tr><td>Filtros</td><td>Por persona y por campo (chips con su conteo) y un buscador sin tildes ni mayúsculas, que también encuentra valores formateados («1.500»).</td></tr>
                <tr><td>Revertir</td><td>Solo un cambio que sigue vigente. Se aplica al instante con un evento que lo cuenta, y se puede deshacer mientras corre el tiempo (<code>undo</code> ms, 7000).</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Protocolo</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Forma</th></tr></thead>
              <tbody>
                <tr><td><code>GET source</code></td><td><code>{events, record?, more?}</code>: los eventos más nuevos (y el registro de hoy, si no se pasó en <code>record</code>).</td></tr>
                <tr><td><code>GET source?before=&lt;id&gt;</code></td><td>La página anterior a ese evento; se pide sola al llegar al final. Sin <code>more</code>, se sigue pidiendo hasta que llegue vacía.</td></tr>
                <tr><td><code>nx-history-revert</code></td><td><code>{event, change}</code>, cancelable: antes de aplicar la reversión.</td></tr>
                <tr><td><code>nx-history-commit</code></td><td><code>{event, change, revert, record}</code>: pasó el tiempo de deshacer; aquí la app guarda en el backend.</td></tr>
                <tr><td><code>nx-history-comment</code></td><td><code>{text}</code>, cancelable: la nota aparece al instante.</td></tr>
                <tr><td><code>nx-history-travel</code></td><td><code>{id, record}</code>: el momento que se está viendo (<code>id: null</code> es el presente).</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>
            <pre role="tabpanel"><code>&lt;nx-history id="historia" heading="OC-2291" source="/compras/oc-2291/historial"&gt;&lt;/nx-history&gt;

    historia.fields = [
      { key: "estado", label: "Estado", type: "status",
        options: [{ value: "aprobada", label: "Aprobada", tone: "success" }, …] },
      { key: "monto", label: "Monto", type: "money", currency: "COP" },
      { key: "observaciones", label: "Observaciones" },
    ];
    historia.user = { name: "Sofía Herrera" };
    historia.addEventListener("nx-history-commit", (e) =&gt;
      fetch("/compras/oc-2291", { method: "PATCH", keepalive: true,
        body: JSON.stringify({ [e.detail.change.field]: e.detail.change.from }) }));</code></pre>
            <pre role="tabpanel" hidden><code>import { History } from "nx32-elements/solid/history";

    &lt;History record={orden()} fields={campos} events={eventos()} user={yo}
      onCommit={(e) =&gt; guardar(e.detail.record)}
      onComment={(e) =&gt; comentar(e.detail.text)} /&gt;</code></pre>
          </div>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>record</code>, <code>fields</code>, <code>events</code></td><td>El registro de hoy, sus campos <code>{key, label, type?, currency?, options?}</code> y los eventos <code>{id, at, actor: {name, avatar?}, action, changes?: [{field, from, to}], note?, revertOf?}</code>.</td></tr>
                <tr><td><code>source</code></td><td>URL que devuelve los eventos y pagina hacia atrás con <code>?before=&lt;id&gt;</code>.</td></tr>
                <tr><td><code>user</code>, <code>undo</code>, <code>heading</code>, <code>locale</code>, <code>labels</code></td><td>Quién comenta y revierte desde aquí, tiempo para deshacer (0 = sin aviso), título, formato y textos.</td></tr>
                <tr><td><code>travel(id)</code>, <code>at</code>, <code>snapshot</code></td><td>Viajar desde código (<code>null</code> = presente), el evento que se ve y el registro de ese momento.</td></tr>
                <tr><td><code>revert(id, field)</code>, <code>comment(text)</code>, <code>reload()</code></td><td>Revertir → <code>"commit"</code>, <code>"undo"</code> o <code>"cancel"</code>; comentar; volver a pedir <code>source</code>.</td></tr>
                <tr><td>Teclado</td><td><kbd>←</kbd>/<kbd>→</kbd>, <kbd>Inicio</kbd>/<kbd>Fin</kbd> sobre el deslizador; <kbd>Esc</kbd> vuelve al presente. <kbd>↵</kbd> envía la nota (<kbd>Mayús</kbd>+<kbd>↵</kbd>, otra línea). <kbd>Ctrl</kbd>+<kbd>Z</kbd> deshace una reversión mientras está el aviso.</td></tr>
                <tr><td>Eventos</td><td><code>nx-history-revert</code> (cancelable), <code>nx-history-commit</code>, <code>nx-history-comment</code> (cancelable), <code>nx-history-travel</code>.</td></tr>
              </tbody>
            </table>
          </div>
        </template>

                <tr><td><code>note</code></td><td><code>{"type":"note","message":"El proveedor no existe todavía en el maestro de terceros."}</code>: se muestra sobre la evidencia.</td></tr>
                <tr><td><code>error</code>, <code>done</code></td><td>Como en la IA. Cerrar el stream también termina.</td></tr>
              </tbody>
            </table>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>fields</code></td><td>Los campos leídos del formulario (lectura), enriquecidos con los que se asignan (<code>{name, label?, type?, kind?, options?}</code>).</td></tr>
                <tr><td><code>endpoint</code>, <code>review-below</code>, <code>for</code>, <code>locale</code>, <code>labels</code></td><td>Servidor opcional, umbral de «Revisar», el <code>id</code> de un formulario que está en otra parte, formato de montos y fechas, textos.</td></tr>

                <tr><td>Funciones</td><td><code>extractPasteData(text)</code> y <code>matchPasteFields(fields, text)</code>: el mismo extractor, para un backend en JavaScript o para probarlo.</td></tr>

        <!-- ================================================================ Presencia -->
        <template id="page-presence">
          <p class="eyebrow">Componentes</p>
          <h1>Presencia <code class="tag">&lt;nx-presence&gt;</code></h1>
          <p class="lead">
            Quién más está aquí, en vivo. Los avatares de quienes tienen abierto el mismo registro, en qué campo está cada
            quien y quién está escribiendo, con un aviso que no bloquea si vas a editar lo que otra persona está editando.
            Sin backend: entre pestañas usa <code>BroadcastChannel</code>; con un servidor, SSE o el transporte que ya tengas.
          </p>

          <section class="prs" aria-labelledby="prs-title">
            <header class="prs__head">
              <div>
                <p class="prs__kicker">Pedido de compra · Por aprobar</p>
                <h2 class="prs__id" id="prs-title">OC-2291</h2>
                <p class="prs__sub">Producción · Planta Malambo</p>
              </div>
              <nx-presence id="presence-demo" channel="oc-2291" for="presence-form" locale="es-CO"></nx-presence>
            </header>
            <form id="presence-form" class="prs__form" autocomplete="off">
              <label class="prs__field">
                <span>Proveedor</span>
                <input name="proveedor" type="text">
              </label>
              <label class="prs__field">
                <span>Monto (COP)</span>
                <input name="monto" type="text" inputmode="decimal">
              </label>
              <label class="prs__field">
                <span>Fecha de entrega</span>
                <input name="entrega" type="date">
              </label>
              <label class="prs__field prs__field--wide">
                <span>Notas</span>
                <textarea name="notas" rows="3"></textarea>
              </label>
            </form>
            <footer class="prs__foot">
              <p class="prs__me">
                <span class="prs__face" id="presence-me-face" aria-hidden="true"></span>
                <span>Esta pestaña es <strong id="presence-me"></strong></span>
              </p>
              <div class="prs__acts">
                <button type="button" class="prs__btn prs__btn--primary" id="presence-open">Abrir otra pestaña</button>
                <button type="button" class="prs__btn" id="presence-sim" aria-pressed="false"><span>Simular compañeros</span></button>
              </div>
            </footer>
          </section>

          <ol class="prs__steps">
            <li><strong>Abre otra pestaña</strong> con el botón (mejor aún: arrástrala a otra ventana, lado a lado). Es otra persona del equipo: cada pestaña ve a la otra entrar.</li>
            <li><strong>Muévete entre campos</strong> en una y mira la otra: el campo se enmarca del color de esa persona, con su nombre encima.</li>
            <li><strong>Escribe</strong>: la otra ve «está escribiendo…» (y el valor, que la demo también comparte). Si enfocas ese mismo campo en la otra pestaña, aparece el aviso de bloqueo suave.</li>
            <li>Cierra una pestaña: la otra la ve salir al instante. Deja una oculta dos minutos y queda <em>inactiva</em>.</li>
          </ol>
          <p class="sel-tip">
            ¿Sin otra pestaña a mano? «Simular compañeros» hace entrar a dos personas de mentira que recorren el formulario.
            La pila y el botón <kbd>+N</kbd> abren la lista completa; <kbd>Esc</kbd> quita el aviso de bloqueo.
          </p>
          <ol class="stage__log btn-events" id="presence-log"></ol>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Pila de avatares</td><td>Quienes ven el mismo registro, sin la persona actual (<code>me</code>). Color estable por persona (sale de su <code>id</code>, igual en todas las pestañas), foto o iniciales, punto verde si está activa y gris si no. Los que no caben van en «+N»; la lista completa dice qué hace cada quien: «viendo», «editando Monto», «inactivo hace 4 min».</td></tr>
                <tr><td>Campos compartidos</td><td>Con <code>for</code>, los campos con <code>data-presence</code> (o con <code>name</code>) de ese formulario muestran un contorno del color de quien los enfoca y su nombre encima, en una capa aparte que no mueve nada. El contorno se desliza al campo siguiente. «Ana está escribiendo…» mientras escribe.</td></tr>
                <tr><td>Bloqueo suave</td><td>Si alguien está editando un campo y lo enfocas, un aviso que no bloquea: «tus cambios podrían pisar los suyos». «Seguir de todas formas» (o <kbd>Esc</kbd>) lo quita, y no vuelve por esa persona hasta que suelte el campo.</td></tr>
                <tr><td>Latidos</td><td>Cada 15 s. Quien no da señales en 45 s se va solo; quien cierra la pestaña se despide al instante. Pestaña oculta o 2 min sin actividad (<code>idle</code>): inactivo.</td></tr>
                <tr><td>Accesible</td><td>La pila es una lista con nombres y actividad. Las entradas, salidas y ediciones se anuncian en una región <code>aria-live</code>, agrupadas («Ana y Héctor entraron») y como mucho una frase cada 3 s.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Protocolo</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Forma</th></tr></thead>
              <tbody>
                <tr><td>Evento</td><td><code>{type, user: {id, name, avatar?}, field?}</code>. <code>type</code>: <code>join</code>, <code>leave</code>, <code>focus</code>, <code>blur</code>, <code>typing</code>, <code>lock</code>, <code>unlock</code>, <code>heartbeat</code>. El latido (y <code>join</code>) lleva además el estado completo: <code>field</code>, <code>editing</code>, <code>idle</code>.</td></tr>
                <tr><td><code>channel="oc-2291"</code></td><td><code>BroadcastChannel</code> entre pestañas del mismo navegador. Nada más que configurar.</td></tr>
                <tr><td><code>source="/url"</code></td><td>Un <code>EventSource</code>: cada <code>data:</code> es un evento en JSON. Los propios que devuelva el servidor se ignoran.</td></tr>
                <tr><td><code>push(evento)</code></td><td>Un transporte propio (WebSocket, Supabase, Ably…): lo que llegue, se empuja.</td></tr>
                <tr><td><code>nx-presence-local</code></td><td>Lo que hace la persona actual, con la misma forma: la app lo manda a su servidor.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>
            <pre role="tabpanel"><code>&lt;nx-presence id="aqui" channel="oc-2291" for="orden"&gt;&lt;/nx-presence&gt;
    &lt;form id="orden"&gt;
      &lt;label&gt;Monto &lt;input name="monto"&gt;&lt;/label&gt;
      &lt;div data-presence="notas" data-presence-label="Notas"&gt;…&lt;/div&gt;
    &lt;/form&gt;

    aqui.me = { id: "u-812", name: "Sofía Herrera", avatar: "/fotos/812.jpg" };

    // Con un servidor: SSE para recibir, y lo propio de vuelta.
    aqui.source = "/compras/oc-2291/presencia";
    aqui.addEventListener("nx-presence-local", (e) =&gt;
      fetch("/compras/oc-2291/presencia", { method: "POST", keepalive: true,
        body: JSON.stringify(e.detail) }));</code></pre>
            <pre role="tabpanel" hidden><code>import { Presence } from "nx32-elements/solid/presence";

    &lt;Presence channel="oc-2291" for="orden" me={yo()}
      onLocal={(e) =&gt; socket.send(JSON.stringify(e.detail))}
      onChange={(e) =&gt; setQuienes(e.detail.users)} /&gt;</code></pre>
          </div>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>me</code></td><td>La persona actual <code>{id, name, avatar?}</code>. Sin ella, el componente solo escucha.</td></tr>
                <tr><td><code>channel</code>, <code>source</code>, <code>push(evento)</code></td><td>Los transportes: entre pestañas, SSE o uno propio. Se pueden combinar.</td></tr>
                <tr><td><code>for</code></td><td><code>id</code> del formulario o contenedor cuyos campos se comparten (<code>data-presence="clave"</code>, o <code>name</code>; <code>data-presence-label</code> les da nombre).</td></tr>
                <tr><td><code>users</code></td><td>Solo lectura: <code>{id, name, avatar?, field, editing, typing, idle, idleSince, joinedAt, seenAt}[]</code>.</td></tr>
                <tr><td><code>idle</code>, <code>max</code>, <code>locale</code>, <code>labels</code></td><td>Milisegundos sin actividad para «inactivo» (120000), círculos en la pila contando «+N» (4), formato y textos.</td></tr>
                <tr><td>Teclado</td><td>El botón «+N» (o <kbd>⌄</kbd>) abre la lista; <kbd>Esc</kbd> la cierra. <kbd>Esc</kbd> en un campo con aviso lo quita.</td></tr>
                <tr><td>Eventos</td><td><code>nx-presence-change</code> <code>{users}</code>, <code>nx-presence-local</code> (un evento del protocolo).</td></tr>
              </tbody>
            </table>
          </div>
        </template>

        <!-- ================================================================ Simulador de escenarios -->
        <template id="page-what-if">
          <p class="eyebrow">Componentes</p>
          <h1>Simulador de escenarios <code class="tag">&lt;nx-what-if&gt;</code></h1>
          <p class="lead">
            «¿Qué pasa con el margen si el acero sube 8 % y vendemos 5 % menos?». Mueve los supuestos y los resultados corren
            hacia su valor nuevo, cada uno con la base al lado y la diferencia en verde o en rojo según lo que conviene. El
            cálculo lo hace el backend, en streaming: el componente no lleva fórmulas. Guarda los escenarios que te gusten y
            compáralos lado a lado.
          </p>
          <nx-what-if id="what-if-demo" heading="Plan de compras 2027 · Planta Malambo" endpoint="/demo/what-if" locale="es-CO"></nx-what-if>
          <p class="sel-tip">
            Enfoca un deslizador y usa <kbd>←</kbd> <kbd>→</kbd> (<kbd>Mayús</kbd> ×10), <kbd>RePág</kbd>/<kbd>AvPág</kbd>,
            <kbd>Inicio</kbd>/<kbd>Fin</kbd>. Haz clic en un valor grande para escribirlo («4.600», «150 mil»). Sube el acero
            al máximo para ver la advertencia del margen, o las ventas al máximo para ver que la planta no alcanza; luego
            «Guardar como…» y compara con los dos escenarios que ya están.
          </p>
          <ol class="stage__log btn-events" id="what-if-log"></ol>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Supuestos</td><td>Deslizadores con la base marcada en la pista y el tramo recorrido desde ella resaltado; el valor grande se escribe con un clic (formato del locale, «4,5 M», «150 mil»; en porcentaje, puntos). Debajo, «+8 % vs. base» y un botón para restablecer ese supuesto.</td></tr>
                <tr><td>Resultados</td><td>Tarjetas con el valor del escenario (el número corre hacia el nuevo; sin animación con movimiento reducido), la base y la diferencia coloreada según <code>better</code>: verde si mejora, rojo si empeora.</td></tr>
                <tr><td>Gráfico</td><td>SVG propio, sin librerías: la base punteada, el escenario continuo y el área entre los dos; el cero si el rango lo cruza. Para el lector de pantalla, los mismos datos en una tabla.</td></tr>
                <tr><td>Cálculo</td><td>Con espera entre cambios (<code>debounce</code>, 250 ms); la petición anterior se cancela (<code>AbortController</code>) y una respuesta vieja no pisa a una nueva. Mientras llega, los resultados se atenúan un poco.</td></tr>
                <tr><td>Escenarios</td><td>«Guardar como…» guarda supuestos y resultados con un nombre. La tabla compara la base, el escenario actual y los guardados, con la mejor celda de cada métrica resaltada. Cargar, renombrar y borrar desde el encabezado de cada columna.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Protocolo</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Forma</th></tr></thead>
              <tbody>
                <tr><td><code>POST endpoint</code></td><td><code>{inputs: {id: valor}}</code> → NDJSON (o <code>data:</code> de SSE), un evento por línea.</td></tr>
                <tr><td><code>metric</code></td><td><code>{"type":"metric","id","label?","value","base?","format?","currency?","unit?","better?"}</code>. Sin <code>base</code>, la da el cálculo con todo en la base.</td></tr>
                <tr><td><code>series</code></td><td><code>{"type":"series","id","label","points":[{x, base, value}]}</code>: reemplaza la serie.</td></tr>
                <tr><td><code>note</code>, <code>error</code></td><td><code>{"type":"note","message","tone"}</code> (<code>neutral</code>, <code>success</code>, <code>warning</code>, <code>danger</code>) · <code>{"type":"error","message"}</code>, con «Reintentar».</td></tr>
                <tr><td><code>done</code></td><td>Terminó: las notas de este cálculo reemplazan a las anteriores.</td></tr>
                <tr><td><code>nx-what-if-compute</code></td><td>Sin <code>endpoint</code>: <code>{inputs, respond(events)}</code>. La app calcula y responde con los mismos eventos (ya, o después de <code>preventDefault()</code>).</td></tr>
                <tr><td><code>nx-what-if-save</code></td><td><code>{action: "save" | "rename" | "delete", scenario, scenarios}</code>, cancelable: aquí la app persiste la lista.</td></tr>
                <tr><td><code>nx-what-if-change</code></td><td><code>{id, inputs}</code>: cambió un supuesto (<code>id: null</code>, varios a la vez).</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>
            <pre role="tabpanel"><code>&lt;nx-what-if id="plan" heading="Plan de compras 2027" endpoint="/finanzas/plan-2027/simular"&gt;&lt;/nx-what-if&gt;

    plan.inputs = [

                <tr><td>Lee un código</td><td>Vibra, suena un «bip» (con el botón de sonido o <code>muted</code> se calla), el visor destella y un recuadro marca el código. Un sobrante suena distinto. El mismo código no vuelve a contar antes de 1,5 s, ni mientras siga quieto frente a la cámara.</td></tr>

                  <span class="sync-switch__track" aria-hidden="true"></span>

                <h3 id="sync-conf-h">Pedidos confirmados <span id="sync-count" class="sync-count">0</span></h3>
