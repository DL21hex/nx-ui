    <!-- ================================================================ Introducción -->
    <template id="page-intro">
      <p class="eyebrow">Empezar</p>
      <h1>Componentes web ligeros, listos para BDUI</h1>
      <p class="lead">
        nx-ui es una librería de Custom Elements <strong>sin dependencias</strong>. Se usa igual en una página HTML
        plana, en SolidJS o pintada desde un JSON que manda el backend.
      </p>
      <ul class="facts">
        <li><strong>0</strong> dependencias en tiempo de ejecución</li>
        <li><strong data-size="sidemenu">≈5 KB</strong> el sidemenu (min + gzip)</li>
        <li><strong>100%</strong> props serializables en JSON</li>
      </ul>

      <h2>Principios</h2>
      <ol class="principles">
        <li><strong>Primero una librería normal.</strong> Atributos para lo simple, propiedades para los datos, eventos para las acciones, slots para tu contenido.</li>
        <li><strong>BDUI sin costo.</strong> Ninguna prop es una función: todo lo que acepta un componente puede venir del backend. <code>nx-ui/bdui</code> es un adaptador opcional de ~25 líneas.</li>
        <li><strong>El navegador hace el trabajo pesado.</strong> Popover API para flotantes y drawer: capa superior, clic fuera, Escape y foco, gratis.</li>
        <li><strong>Neutro y tematizable.</strong> Todo el color sale de variables <code>--nx-*</code>; claro y oscuro con <code>light-dark()</code>.</li>
      </ol>

      <h2>Instalación</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">Módulos (ESM)</button>
          <button role="tab" aria-selected="false">SolidJS</button>
        </div>
        <pre role="tabpanel"><code>&lt;link rel="stylesheet" href="nx-ui.css"&gt;
&lt;script src="nx-ui.iife.js"&gt;&lt;/script&gt;   &lt;!-- trae los íconos Lucide ya registrados --&gt;</code></pre>
        <pre role="tabpanel" hidden><code>import "nx-ui/nx-ui.css";
import { registerIcons } from "nx-ui";   // registra &lt;nx-sidemenu&gt;
import { lucide } from "nx-ui/icons";     // opcional
registerIcons(lucide);</code></pre>
        <pre role="tabpanel" hidden><code>import "nx-ui/nx-ui.css";
import { SideMenu } from "nx-ui/solid";   // tipos JSX + envoltorio</code></pre>
      </div>

      <h2>Compatibilidad</h2>
      <p>
        Navegadores de 2024 en adelante: Chrome/Edge 123+, Safari 17.5+, Firefox 125+ (Popover API y
        <code>light-dark()</code>). Importar la librería en el servidor (SSR) no lanza: los elementos se registran
        solo en el navegador.
      </p>
    </template>

    <!-- ================================================================ Temas -->
    <template id="page-temas">
      <p class="eyebrow">Empezar</p>
      <h1>Temas y tokens</h1>
      <p class="lead">
        Toda la paleta es neutra y sale de variables CSS. Redefine las que quieras para aplicar tu marca; el modo
        oscuro las acompaña solo.
      </p>
      <h2>Paletas</h2>
      <p>
        Nueve paletas listas: elige una y se aplica a toda la galería. En tu proyecto basta con
        <code>nx-ui/palettes.css</code> y <code>&lt;html data-nx-palette="oceano"&gt;</code>; también sirve en una zona de la
        página.
      </p>
      <div class="palettes" id="palettes" role="radiogroup" aria-label="Paleta"></div>

      <h2>Acento a mano</h2>
      <div class="brand-picker">
        <label>Acento <input type="color" id="primary-picker" value="#3b6ff5" /></label>
        <button type="button" class="btn" id="primary-reset">Restablecer</button>
        <span class="hint">Cambia <code>--nx-primary</code> en vivo, en toda la galería.</span>
      </div>
      <div class="swatches" id="swatches"></div>
      <h2>Aplicar tu marca</h2>
      <pre><code>/* Tu propia paleta: solo los parámetros; claro, oscuro y todos los derivados salen solos. */
[data-nx-palette="mi-marca"] {
  --nx-accent-h: 200;        /* tono del acento (0–360) */
  --nx-accent-c: 0.14;       /* croma: cuánto color (0 = gris) */
  --nx-accent-l: 0.55;       /* luminosidad en claro; --nx-accent-l-dark en oscuro */
  --nx-neutral-h: 210;       /* tono de los grises */
  --nx-tint: 1.8;            /* cuánto color llevan los grises (1 = casi nada) */
}

/* O fijar un token directamente */
:root { --nx-font-sans: "Geist Sans", system-ui, sans-serif; }
/* Forzar tema: .dark / .light o data-theme="dark|light" en cualquier ancestro */</code></pre>
    </template>

    <!-- ================================================================ Captura -->
    <template id="page-capture">
      <p class="eyebrow">Componentes</p>
      <h1>Captura de documentos <code class="tag">&lt;nx-doc-capture&gt;</code></h1>
      <p class="lead">
        Sueltas una factura y el formulario se llena solo. Cada dato trae su confianza y su evidencia en el documento; lo
        dudoso se revisa con un clic, las validaciones cruzadas avisan, y nada se registra sin que una persona confirme.
      </p>
      <p class="sel-tip">
        Usa la factura de ejemplo (o suelta cualquier archivo: la demo siempre «lee» la misma). Pasa el mouse por un campo o
        por el documento, corrige «Vence» y registra.
      </p>
      <div class="cap-actions">
        <nx-button id="cap-sample" label="Usar la factura de ejemplo" icon="file-text" variant="primary" log-mode="none"></nx-button>
      </div>
      <nx-doc-capture id="cap-demo" endpoint="/demo/capture" action="/demo/capture/registrar"></nx-doc-capture>
      <ol class="stage__log btn-events" id="cap-log"></ol>

      <h2>Protocolo</h2>
      <p>
        El mismo transporte que la IA (NDJSON o <code>data:</code> de SSE). El componente hace <code>POST</code> multipart
        (campo <code>file</code>) a <code>endpoint</code>. Los recuadros van en coordenadas 0–1 de la página.
      </p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Evento</th><th>Ejemplo</th></tr></thead>
          <tbody>
            <tr><td><code>page</code></td><td><code>{"type":"page","n":1,"src":"/docs/7/p1.png","width":1240,"height":1754}</code>: cada página como imagen (el PDF ya rasterizado).</td></tr>
            <tr><td><code>field</code></td><td><code>{"type":"field","key":"nit","value":"900.123.456-7","confidence":0.99,"box":{"page":1,"x":0.06,"y":0.07,"w":0.2,"h":0.02}}</code>. Opcionales: <code>detail</code> (una línea bajo el campo), <code>hint</code> y <code>suggest</code> (para lo dudoso). Una celda de tabla: <code>"key":"items.0.cantidad"</code>.</td></tr>
            <tr><td><code>check</code></td><td><code>{"type":"check","id":"iva","status":"ok","message":"El IVA es el 19 %","fields":["iva","subtotal"]}</code>. <code>error</code> bloquea el registro; <code>warn</code> solo avisa.</td></tr>
            <tr><td><code>error</code>, <code>done</code></td><td>Como en la IA. Cerrar el stream también termina.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
          <button role="tab" aria-selected="false">BDUI</button>
        </div>
        <pre role="tabpanel"><code>&lt;nx-doc-capture id="cap" endpoint="/compras/facturas/leer" action="/compras/facturas/registrar"&gt;&lt;/nx-doc-capture&gt;

cap.schema = [
  { key: "proveedor", label: "Proveedor", section: "Encabezado" },
  { key: "nit", label: "NIT", section: "Encabezado" },
  { key: "vence", label: "Vence", type: "date", section: "Encabezado" },
  { key: "items", label: "Ítems", type: "table", section: "Detalle",
    columns: [{ key: "desc", label: "Descripción" }, { key: "cantidad", label: "Cant.", type: "number" }] },
  { key: "total", label: "Total", type: "money", section: "Totales" },
];
cap.addEventListener("nx-capture-submit", (e) =&gt; console.log(e.detail.values, e.detail.confirmed));</code></pre>
        <pre role="tabpanel" hidden><code>import { DocCapture } from "nx-ui/solid";

&lt;DocCapture schema={SCHEMA} endpoint="/compras/facturas/leer" reviewBelow={0.85}
  onSubmit={(e) =&gt; { e.preventDefault(); registrar(e.detail.values); }} /&gt;</code></pre>
        <pre role="tabpanel" hidden><code>{ "component": "DocCapture", "props": {
    "schema": [ … ],
    "endpoint": "/compras/facturas/leer",
    "action": "/compras/facturas/registrar",
    "reviewBelow": 0.8 } }</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>schema</code></td><td>Campos <code>{key, label, type?, section?}</code> (tipos <code>text</code>, <code>date</code>, <code>number</code>, <code>money</code>) y tablas <code>{key, label, type: "table", columns}</code>.</td></tr>
            <tr><td><code>endpoint</code></td><td>Lee el documento: <code>POST</code> multipart (<code>file</code>) y responde con el protocolo.</td></tr>
            <tr><td><code>action</code></td><td>Registra: <code>POST</code> JSON <code>{values, confirmed}</code>, con el botón ocupado mientras tanto. Sin ella, solo el evento.</td></tr>
            <tr><td><code>review-below</code></td><td>Confianza bajo la cual un campo exige revisión (0–1, por defecto 0,8).</td></tr>
            <tr><td><code>accept</code>, <code>labels</code></td><td>Tipos de archivo del selector y textos de la interfaz.</td></tr>
            <tr><td><code>extract(file)</code></td><td>Leer un archivo desde código (<code>nx-capture-file</code>, cancelable, deja usar otro transporte).</td></tr>
            <tr><td><code>begin()</code>, <code>push(evento)</code>, <code>end()</code>, <code>setCheck()</code>, <code>reset()</code></td><td>Transporte propio; recalcular una validación tras una corrección; volver a la zona de soltar.</td></tr>
            <tr><td><code>values</code>, <code>pending</code>, <code>state</code></td><td>Lo capturado (tablas como arreglos de filas), los campos por revisar y el estado.</td></tr>
            <tr><td>Eventos</td><td><code>nx-capture-start</code>, <code>nx-capture-done</code> <code>{values, pending}</code>, <code>nx-capture-change</code> <code>{key, value, values}</code>, <code>nx-capture-submit</code> <code>{values, confirmed, checks}</code> (cancelable).</td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- ================================================================ Tabla -->
    <template id="page-grid">
      <p class="eyebrow">Componentes</p>
      <h1>Tabla <code class="tag">&lt;nx-grid&gt;</code></h1>
      <p class="lead">
        Una tabla que se explora sola. Cada columna muestra cómo se reparten sus datos y filtra con un clic. También
        filtras escribiendo una frase o con el panel de filtros, trabajas como en una hoja de cálculo, agrupas con
        subtotales, exportas a Excel y agregas columnas que calcula una IA con los datos de cada fila.
      </p>
      <div class="grid-try">
        <span>Prueba:</span>
        <button type="button" data-grid-ask>pendientes de más de 5 millones</button>
        <button type="button" data-grid-ask>aceros de marzo sin anulados</button>
        <button type="button" data-grid-ask>atraso mayor a 5</button>
        <select class="grid-locale" aria-label="Formato (locale)">
          <option value="es-CO">es-CO</option>
          <option value="en-US">en-US</option>
          <option value="pt-BR">pt-BR</option>
          <option value="de-DE">de-DE</option>
        </select>
        <span class="grid-mode" role="group" aria-label="Origen de los datos">
          <button type="button" data-grid-mode="client" aria-pressed="true">Cliente · 600</button>
          <button type="button" data-grid-mode="server" aria-pressed="false">Servidor · 20.000</button>
        </span>
      </div>
      <nx-grid id="grid-demo" locale="es-CO" ai-endpoint="/demo/grid/ai" facets-open filename="necesidades-de-compra"></nx-grid>
      <ol class="stage__log btn-events" id="grid-log"></ol>

      <h2>Cómo se usa</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Para</th><th>Haz esto</th></tr></thead>
          <tbody>
            <tr><td>Filtrar con el histograma</td><td>Clic en una barra. En una categoría suma o quita el valor; en números y fechas elige ese rango, y <kbd>Mayús</kbd>+clic lo extiende. La barra gris es el total y la de color lo que queda tras los filtros.</td></tr>
            <tr><td>Filtrar con palabras</td><td>«pendientes de marzo de más de 5 millones», «sin anulados», «entre 1 y 2 millones», «atraso mayor a 3», o texto entre comillas. Lo que no entiende te lo dice. Con <code>nl-endpoint</code>, esas frases van al backend.</td></tr>
            <tr><td>Panel de filtros</td><td>Las opciones de una faceta se suman y las facetas se combinan entre sí. Cada conteo refleja los demás filtros; una opción en 0 queda deshabilitada.</td></tr>
            <tr><td>Hoja de cálculo</td><td>Flechas, <kbd>Inicio</kbd>/<kbd>Fin</kbd>, <kbd>RePág</kbd>/<kbd>AvPág</kbd>, <kbd>Mayús</kbd> para seleccionar un rango (o arrastrar); el pie muestra suma, promedio, mínimo y máximo. <kbd>Ctrl</kbd>+<kbd>C</kbd> copia para pegar en Excel, y <kbd>Ctrl</kbd>+<kbd>V</kbd> pega desde Excel en las columnas editables.</td></tr>
            <tr><td>Editar</td><td>Doble clic, <kbd>Enter</kbd>, <kbd>F2</kbd> o simplemente escribir. <kbd>Enter</kbd> guarda y baja, <kbd>Tab</kbd> guarda y avanza, <kbd>Esc</kbd> cancela, <kbd>Supr</kbd> borra. Las celdas editadas llevan una marca. <kbd>Ctrl</kbd>+<kbd>Z</kbd> deshace y <kbd>Ctrl</kbd>+<kbd>Y</kbd> rehace (también con los botones de la barra).</td></tr>
            <tr><td>Columna IA</td><td>«Riesgo de retraso según proveedor, monto y atraso», «¿Es una compra recurrente?», «Ahorro posible si se negocia». Solo se calculan las filas que ves, en lotes.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Protocolo</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Endpoint</th><th>Petición → respuesta</th></tr></thead>
          <tbody>
            <tr><td><code>source</code></td><td><code>POST {"offset":0,"limit":100,"sort":{"key":"monto","dir":-1},"filters":[…]}</code> → <code>{"rows":[…],"total":20000,"histograms":{"monto":{"kind":"bins","labels":[…],"counts":[…],"filtered":[…],"edges":[…]}},"facets":[{"key":"prov","label":"Proveedor","options":[{"value":"…","count":12}]}],"totals":{"monto":…}}</code>. Los agregados son opcionales; sin ellos, la tabla no muestra histogramas ni facetas.</td></tr>
            <tr><td><code>ai-endpoint</code></td><td><code>POST {"prompt","column","label","columns":[…],"rows":[{"id":"2201","monto":…}]}</code> → NDJSON o SSE, una línea por celda y en cualquier orden: <code>{"type":"cell","id":"2201","value":"Alto","tone":"danger"}</code>. El tono (<code>success</code>, <code>warning</code>, <code>danger</code>, <code>info</code>) es opcional.</td></tr>
            <tr><td><code>nl-endpoint</code></td><td><code>POST {"q","columns"}</code> → <code>{"filters":[…],"unknown":["…"]}</code>. Solo se llama si el analizador local no entendió todo.</td></tr>
            <tr><td>Filtros</td><td><code>{"key","op":"in","values":[…]}</code>, <code>"notIn"</code>, <code>{"op":"range","min","max"}</code> (<code>min</code> incluido, <code>max</code> excluido; números o fechas ISO) y <code>{"op":"contains","value"}</code>.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
          <button role="tab" aria-selected="false">BDUI</button>
        </div>
        <pre role="tabpanel"><code>&lt;nx-grid id="grid" ai-endpoint="/ia/columna" facets-open&gt;&lt;/nx-grid&gt;

grid.columns = [
  { key: "oc", label: "Pedido" },
  { key: "prov", label: "Proveedor" },
  { key: "fecha", label: "Fecha", type: "date" },
  { key: "estado", label: "Estado", type: "status", options: [{ value: "pend", label: "Pendiente", tone: "warning" }] },
  { key: "monto", label: "Monto", type: "money", editable: true },
];
grid.rows = pedidos;                 // o: grid.source = "/compras/pedidos/buscar"
grid.addEventListener("nx-grid-change", (e) =&gt; guardar(e.detail.changes));</code></pre>
        <pre role="tabpanel" hidden><code>import { Grid } from "nx-ui/solid";

&lt;Grid columns={COLUMNAS} source="/compras/pedidos/buscar" aiEndpoint="/ia/columna" facetsOpen
  onChange={(e) =&gt; { if (!puedeEditar()) e.preventDefault(); else guardar(e.detail.changes); }} /&gt;</code></pre>
        <pre role="tabpanel" hidden><code>{ "component": "Grid", "props": {
    "columns": [ … ],
    "source": "/compras/pedidos/buscar",
    "groupBy": "prov",
    "filters": [{ "key": "estado", "op": "in", "values": ["pend"] }] } }</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>columns</code></td><td><code>{key, label, type?, width?, editable?, options?, histogram?, facet?, currency?, ai?}</code>. Tipos: <code>text</code>, <code>number</code>, <code>money</code>, <code>date</code> (ISO) y <code>status</code> (con <code>options</code> y tono).</td></tr>
            <tr><td><code>rows</code> / <code>source</code></td><td>Filas en el cliente (se copian: ediciones y valores de IA quedan en <code>grid.rows</code>) o URL de datos en el servidor.</td></tr>
            <tr><td><code>filters</code>, <code>sort</code>, <code>group-by</code></td><td>El estado, serializable. Agrupar solo funciona en el cliente.</td></tr>
            <tr><td><code>ai-endpoint</code>, <code>nl-endpoint</code></td><td>Columnas de IA y frases que el analizador local no entiende.</td></tr>
            <tr><td><code>locale</code></td><td>Formato de números, montos, fechas, lo que se escribe en una celda y el orden alfabético (<code>es-CO</code>, <code>en-US</code>…). Por defecto, el <code>lang</code> de la página. Con <code>currency</code> ISO en la columna (<code>"COP"</code>, <code>"USD"</code>), el formato de moneda del locale.</td></tr>
            <tr><td><code>facets-open</code>, <code>height</code>, <code>row-key</code>, <code>filename</code>, <code>labels</code></td><td>Panel de filtros abierto, alto en px (o <code>--nx-grid-height</code>), campo identificador (<code>id</code>), nombre del .xlsx y textos.</td></tr>
            <tr><td><code>ask(frase)</code>, <code>clearFilters()</code>, <code>exportXlsx()</code>, <code>addAiColumn(nombre, prompt)</code>, <code>removeColumn(key)</code>, <code>refresh()</code></td><td>Lo mismo que la interfaz, desde código.</td></tr>
            <tr><td>Eventos</td><td><code>nx-grid-filter</code> <code>{filters, sort, groupBy, count}</code>, <code>nx-grid-change</code> <code>{changes: [{id, key, value, old}]}</code> (cancelable) y <code>nx-grid-columns</code> <code>{columns}</code>.</td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- ================================================================ Diálogos -->
    <template id="page-dialog">
      <p class="eyebrow">Componentes</p>
      <h1>Diálogos <code class="tag">&lt;nx-dialog&gt;</code></h1>
      <p class="lead">
        Cuatro formas de hacer lo que hoy se hace con un modal, cada una para su caso. Un modal que nace del botón, paneles
        que se apilan para profundizar sin perder contexto, deshacer en vez de preguntar, y cuando sí hay que preguntar,
        mostrar antes qué va a pasar.
      </p>

      <h2>A · El modal que nace del botón</h2>
      <p>
        Se expande desde el botón que lo abrió y vuelve a él. En móvil es una hoja que se arrastra hacia abajo para cerrar.
        Escribe algo y trata de cerrarlo: el aviso de cambios sin guardar aparece dentro del diálogo, no en otro modal.
      </p>
      <div class="dlg-row">
        <nx-button id="dlg-new-btn" label="Nuevo pedido" icon="receipt" variant="primary" log-mode="none"></nx-button>
        <button type="button" class="dlg-plain" popovertarget="dlg-new">Abrir sin JS (popovertarget)</button>
      </div>
      <nx-dialog id="dlg-new" heading="Nuevo pedido" description="Se envía a aprobación al guardar.">
        <form id="dlg-new-form" class="dlg-form">
          <label>Proveedor <input name="prov" placeholder="Aceros del Caribe" autocomplete="off" /></label>
          <div class="dlg-2">
            <label>Monto <input name="monto" inputmode="decimal" placeholder="$ 0" /></label>
            <label>Entrega <input name="fecha" type="date" /></label>
          </div>
          <label>Descripción <textarea name="nota" rows="3" placeholder="Lámina HR 3 mm ×40"></textarea></label>
        </form>
        <div slot="footer">

      <h2>B · Paneles apilados</h2>

      </p>

      <h2>D · Confirmación con impacto</h2>

    <template id="page-command">
      <p class="eyebrow">Componentes</p>
      <h1>Paleta de comandos <code class="tag">&lt;nx-command&gt;</code></h1>
      <p class="lead">
        Una sola caja para ir a cualquier pantalla, encontrar un registro, ejecutar una acción y, si nada de eso
        responde, preguntarle al asistente. Aprende: lo que eliges seguido sube, y sin escribir nada aparece en
        «Recientes».
      </p>
      <div class="dlg-row">
        <button type="button" class="cmd-open" popovertarget="cmd">
          <span>Busca una pantalla, un registro o una acción…</span> <kbd data-mod>Ctrl K</kbd>
        </button>
      </div>
      <p class="sel-tip">
        Es la misma paleta de toda la galería. Prueba <kbd>np</kbd> (iniciales de «Nuevo pedido»), <kbd>porteria</kbd>
        (sin tilde, sale del menú), <kbd>OC-23</kbd> o <kbd>ana</kbd> (registros del servidor), <kbd>cambiar pa</kbd>
        (un submenú: Escape vuelve), o una pregunta en la página del Directorio de TH, donde hay un asistente.
      </p>
      <ol class="stage__log btn-events" id="cmd-log"></ol>

      <h2>De dónde salen las entradas</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Fuente</th><th>Qué aporta</th></tr></thead>
          <tbody>
            <tr><td><code>items</code></td><td>Entradas propias: acciones (<code>nx-command-select</code>), enlaces (<code>href</code>) y submenús (<code>children</code>). Cada una con <code>group</code>, <code>hint</code>, <code>keywords</code> (sinónimos), <code>icon</code> y <code>shortcut</code>.</td></tr>
            <tr><td><code>menu="id"</code></td><td>Las pantallas de un <code>&lt;nx-sidemenu&gt;</code>, con su ruta como pista («Ventas › Pedidos»). Se leen al abrir: siempre al día.</td></tr>
            <tr><td><code>source="/url"</code></td><td>Registros del servidor mientras se escribe: <code>GET /url?q=…</code> → <code>[{label, href, group, hint, …}]</code> (o <code>{items}</code>). Van después de las coincidencias locales, en el orden del servidor.</td></tr>
            <tr><td><code>agent="id"</code></td><td>Lo que se escribe se le puede preguntar a ese <code>&lt;nx-agent&gt;</code> (<code>nx-command-ask</code>, cancelable).</td></tr>
            <tr><td>Recientes</td><td>Lo que se elige se recuerda en <code>localStorage</code> (solo en ese navegador; <code>storage="none"</code> lo desactiva). Pesa más lo usado seguido y reciente: cada semana cuenta la mitad.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
        </div>
        <pre role="tabpanel"><code>&lt;button popovertarget="cmd"&gt;Buscar… ⌘K&lt;/button&gt;
&lt;nx-command id="cmd" menu="nav" source="/buscar" agent="asistente"&gt;&lt;/nx-command&gt;

cmd.items = [
  { id: "nuevo", label: "Nuevo pedido", group: "Acciones", keywords: ["crear"], shortcut: "N" },
  { id: "tema", label: "Cambiar tema", group: "Acciones",
    children: [{ id: "claro", label: "Claro" }, { id: "oscuro", label: "Oscuro" }] },
];
cmd.addEventListener("nx-command-select", (e) =&gt; ejecutar(e.detail.item.id));</code></pre>
        <pre role="tabpanel" hidden><code>import { Command } from "nx-ui/solid";

&lt;Command menu="nav" source="/buscar" items={acciones()}
  onSelect={(e) =&gt; ejecutar(e.detail.item.id)} /&gt;</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>items</code>, <code>menu</code>, <code>source</code>, <code>agent</code></td><td>Las fuentes (arriba).</td></tr>
            <tr><td><code>hotkey</code></td><td>Atajo global (<code>"mod+k"</code>; <code>mod</code> es ⌘ o Ctrl). <code>"none"</code> lo quita. <code>&lt;button popovertarget&gt;</code> la abre sin JS.</td></tr>
            <tr><td><code>placeholder</code>, <code>limit</code>, <code>storage</code>, <code>labels</code></td><td>Texto de la caja, máximo de filas (50), clave de lo reciente y textos.</td></tr>
            <tr><td><code>show(q?)</code>, <code>hide()</code>, <code>clearHistory()</code></td><td>Abrir (con la consulta ya escrita), cerrar y olvidar lo reciente.</td></tr>
            <tr><td>Teclado</td><td><kbd>↑</kbd><kbd>↓</kbd> moverse, <kbd>↵</kbd> abrir, <kbd>⌘/Ctrl</kbd>+<kbd>↵</kbd> en otra pestaña, <kbd>Esc</kbd> sale del submenú y luego cierra, <kbd>⌫</kbd> vacío vuelve.</td></tr>
            <tr><td>Eventos</td><td><code>nx-command-select</code> <code>{item, query, newTab}</code> (cancelable), <code>nx-command-ask</code> <code>{query}</code> (cancelable), <code>nx-open-change</code>.</td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- ================================================================ Explicar cifras -->
    <template id="page-explain">
      <p class="eyebrow">Componentes</p>
      <h1>¿De dónde sale este número? <code class="tag">&lt;nx-explain&gt;</code></h1>
      <p class="lead">
        Cualquier cifra se abre en su desglose: la fórmula término a término, la comparación con otro período, las
        fuentes y una explicación breve. Cada término se puede abrir a su vez, hasta el documento de origen. Y lo que
        muestra se comprueba: si los términos no suman la cifra, lo dice.
      </p>
      <div class="xp-board" lang="es-CO">
        <article class="xp-card">
          <p class="xp-card__label">Factura FE-10482 · Aceros del Caribe</p>
          <p class="xp-card__value"><nx-explain endpoint="/demo/explain?id=factura">$ 10.601.500</nx-explain></p>
          <p class="xp-card__hint">Abre el subtotal y el IVA: cada uno tiene su propio desglose.</p>
        </article>
        <article class="xp-card">
          <p class="xp-card__label">Costo de producción · agosto</p>
          <p class="xp-card__value"><nx-explain endpoint="/demo/explain?id=costo">$ 482,3 M</nx-explain></p>
          <p class="xp-card__hint">Contra julio y contra el presupuesto; subir es malo.</p>
        </article>
        <article class="xp-card">
          <p class="xp-card__label">Margen bruto · agosto</p>
          <p class="xp-card__value"><nx-explain endpoint="/demo/explain?id=margen">31,4 %</nx-explain></p>
          <p class="xp-card__hint">Una división: aquí no hay suma que comprobar.</p>
        </article>
        <article class="xp-card">
          <p class="xp-card__label">Saldo en bancos · hoy</p>
          <p class="xp-card__value"><nx-explain endpoint="/demo/explain?id=bancos">$ 1.284,5 M</nx-explain></p>
          <p class="xp-card__hint">Los extractos no dan la cifra: el componente lo detecta.</p>
        </article>
      </div>
      <p lang="es-CO">
        También dentro de un texto: el IVA de esta factura es de
        <nx-explain id="xp-inline">$ 1.729.000</nx-explain>, y ese desglose viene en la propia página (<code>explanation</code>),
        sin pedir nada al servidor.
      </p>
      <ol class="stage__log btn-events" id="xp-log"></ol>

      <h2>Protocolo</h2>
      <p>
        Una línea por evento (NDJSON o <code>data:</code> de SSE). El componente hace <code>GET</code> a <code>endpoint</code>
        (o <code>POST</code> con <code>{context}</code> si <code>method="POST"</code>). Lo que no conoce lo ignora.
      </p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Evento</th><th>Ejemplo</th></tr></thead>
          <tbody>
            <tr><td><code>value</code></td><td><code>{"type":"value","label":"Total factura","value":10601500,"format":"money","currency":"COP"}</code>: la cifra. <code>format</code>: <code>money</code>, <code>number</code> o <code>percent</code> (0,19 = 19 %).</td></tr>
            <tr><td><code>term</code></td><td><code>{"type":"term","label":"IVA 19 %","value":1729000,"op":"+","detail":"…","source":"fe","explain":"/…","href":"/…"}</code>. <code>op</code>: <code>+</code> (por defecto), <code>-</code>, <code>×</code>, <code>÷</code> o <code>=</code> (subtotal). <code>explain</code> abre su desglose; <code>href</code>, el documento.</td></tr>
            <tr><td><code>total</code></td><td><code>{"type":"total","value":10601500}</code>: contra qué se comprueban los términos (por defecto, la cifra). Solo se comprueban sumas y restas.</td></tr>
            <tr><td><code>compare</code></td><td><code>{"type":"compare","label":"julio","value":432900000,"better":"down"}</code>: «▲ 11,4 % vs. julio», en rojo si subir es malo.</td></tr>
            <tr><td><code>source</code>, <code>text</code>, <code>note</code></td><td>Como en la IA: fuentes con enlace, explicación con <code>**negrita**</code> y citas <code>[^id]</code>, y marcas («cifras del cierre»).</td></tr>
            <tr><td><code>error</code>, <code>done</code></td><td>Terminan el desglose.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">En línea</button>
          <button role="tab" aria-selected="false">SolidJS</button>
        </div>
        <pre role="tabpanel"><code>Total: &lt;nx-explain endpoint="/explicar/factura/10482"&gt;$ 10.601.500&lt;/nx-explain&gt;</code></pre>
        <pre role="tabpanel" hidden><code>iva.explanation = [
  { type: "value", label: "IVA 19 %", value: 1729000, currency: "COP" },
  { type: "term", label: "Base gravable", value: 9100000 },
  { type: "term", label: "Tarifa general", value: 0.19, op: "×", format: "percent" },
];</code></pre>
        <pre role="tabpanel" hidden><code>import { Explain } from "nx-ui/solid";

&lt;Explain endpoint={`/explicar/factura/${id()}`}&gt;{total()}&lt;/Explain&gt;</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>endpoint</code>, <code>method</code>, <code>context</code></td><td>De dónde sale el desglose (<code>GET</code>; con <code>POST</code>, el cuerpo es <code>{context}</code>).</td></tr>
            <tr><td><code>explanation</code></td><td>El desglose ya armado: los mismos eventos, sin servidor.</td></tr>
            <tr><td><code>locale</code>, <code>labels</code></td><td>Formato de los números (o el <code>lang</code> de la página) y textos.</td></tr>
            <tr><td><code>show()</code>, <code>hide()</code>, <code>refresh()</code>, <code>state</code></td><td>Abrir, cerrar, olvidar lo traído (se guarda por URL) y el desglose que se ve.</td></tr>
            <tr><td>Teclado</td><td><kbd>↵</kbd> o <kbd>Espacio</kbd> abren; <kbd>Esc</kbd> vuelve un nivel y luego cierra; el foco vuelve a la cifra.</td></tr>
            <tr><td>Eventos</td><td><code>nx-open-change</code> <code>{open}</code>.</td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- ================================================================ Bandeja -->
    <template id="page-inbox">
      <p class="eyebrow">Componentes</p>
      <h1>Bandeja de aprobaciones <code class="tag">&lt;nx-inbox&gt;</code></h1>
      <p class="lead">
        Aprobar con el teclado: <kbd>J</kbd>/<kbd>K</kbd> para moverse, <kbd>A</kbd> para aprobar, <kbd>R</kbd> para
        rechazar con un motivo, <kbd>X</kbd> para seleccionar varios. Al decidir, el ítem sale y el siguiente queda listo.
        Nada pregunta «¿está seguro?»: todo se deshace mientras corre el tiempo.
      </p>
      <nx-inbox id="inbox-demo" heading="Órdenes por aprobar" locale="es-CO"></nx-inbox>
      <div class="dlg-row">
        <button type="button" class="dlg-plain" id="inbox-reset">Volver a llenar la bandeja</button>
      </div>
      <ol class="stage__log btn-events" id="inbox-log"></ol>

      <h2>Cómo decide</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Paso</th><th>Qué pasa</th></tr></thead>
          <tbody>
            <tr><td>Impacto</td><td>El detalle muestra qué pasa si se aprueba: una lista, o transmitido desde <code>impact</code> (el protocolo de <code>nxConfirm</code>, <code>POST {id, data}</code>). Un <code>block</code> impide aprobar ese ítem y lo marca con un candado. Prueba la OC-2310.</td></tr>
            <tr><td><code>nx-inbox-decide</code></td><td>Antes de aplicar (cancelable): <code>{decision, ids, items, reason?}</code>.</td></tr>
            <tr><td>Deshacer</td><td>La decisión se ve al instante y se puede deshacer durante <code>undo</code> ms (7000), con el aviso o <kbd>Ctrl</kbd>+<kbd>Z</kbd>: el ítem vuelve a su lugar (<code>nx-inbox-undo</code>).</td></tr>
            <tr><td><code>nx-inbox-commit</code></td><td>Cuando el tiempo termina (o la página se cierra): ahí la app llama al backend.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
        </div>
        <pre role="tabpanel"><code>&lt;nx-inbox id="bandeja" heading="Órdenes por aprobar" require-reason&gt;&lt;/nx-inbox&gt;

bandeja.items = await (await fetch("/compras/por-aprobar")).json();
bandeja.addEventListener("nx-inbox-commit", (e) =&gt;
  fetch(`/compras/${e.detail.decision}`, { method: "POST", keepalive: true,
    body: JSON.stringify({ ids: e.detail.ids, motivo: e.detail.reason }) }));</code></pre>
        <pre role="tabpanel" hidden><code>import { Inbox } from "nx-ui/solid";

&lt;Inbox items={pendientes()} heading="Órdenes por aprobar"
  onCommit={(e) =&gt; registrar(e.detail)} /&gt;</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>items</code></td><td><code>{id, title, subtitle?, requester?, amount?, currency?, date?, tags?, facts?, impact?, href?, data?}</code>.</td></tr>
            <tr><td><code>undo</code>, <code>require-reason</code>, <code>heading</code>, <code>locale</code>, <code>labels</code></td><td>Tiempo para deshacer (0 = sin aviso), motivo obligatorio al rechazar, título, formato y textos.</td></tr>
            <tr><td><code>decide(decisión, ids?, motivo?)</code></td><td>Aprueba o rechaza desde código → <code>"commit"</code>, <code>"undo"</code> o <code>"cancel"</code>.</td></tr>
            <tr><td><code>active</code>, <code>selected</code>, <code>pending</code></td><td>El ítem activo, los seleccionados y lo que queda por decidir.</td></tr>
            <tr><td>Teclado</td><td><kbd>J</kbd>/<kbd>K</kbd> o flechas, <kbd>X</kbd>/<kbd>Espacio</kbd> seleccionar, <kbd>Mayús</kbd>+mover extiende, <kbd>Ctrl</kbd>+<kbd>A</kbd> todos, <kbd>A</kbd> aprobar, <kbd>R</kbd> rechazar, <kbd>↵</kbd> abrir el documento, <kbd>Esc</kbd> limpiar.</td></tr>
            <tr><td>Eventos</td><td><code>nx-inbox-decide</code> (cancelable), <code>nx-inbox-commit</code>, <code>nx-inbox-undo</code>, <code>nx-inbox-active</code>, <code>nx-inbox-open</code> (cancelable).</td></tr>
          </tbody>
        </table>
      </div>
    </template>

    <!-- ================================================================ Ejemplo: directorio de TH -->
    <template id="page-th">
      <p class="eyebrow">Ejemplos</p>
      <h1>Directorio de TH</h1>
      <p class="lead">

      <h1>IA <code class="tag">&lt;nx-ai-answer&gt;</code></h1>
      <p class="lead">
        Preguntar y ver a la IA pensar: los pasos en vivo, la respuesta en streaming con citas que iluminan su fuente, y
        al final un resumen plegable, acciones y valoración. No depende de ningún modelo: habla un protocolo de streaming
        que cualquier backend puede emitir.
      </p>

      <div class="ai-demo">
        <nx-ai-answer id="ai-demo" endpoint="/demo/ai" feedback></nx-ai-answer>
      </div>
      <ol class="stage__log btn-events" id="ai-log"></ol>

      <h2>Protocolo</h2>
      <p>
        Una línea por evento, en NDJSON o como <code>data:</code> de SSE. El componente hace <code>POST</code> a
        <code>endpoint</code> con <code>{"question", "context"}</code>. Un tipo que no conoce se ignora, así que el backend
        puede evolucionar sin romper versiones viejas.
      </p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Evento</th><th>Ejemplo</th></tr></thead>
          <tbody>
            <tr><td><code>step</code></td><td><code>{"type":"step","id":"s1","label":"Consultando costos","status":"run"}</code> → luego <code>"status":"done"</code> (o <code>"error"</code>) con <code>"detail"</code> opcional.</td></tr>
            <tr><td><code>text</code></td><td><code>{"type":"text","delta":"El costo subió **11,4 %**[^mayor]"}</code>. Markdown mínimo: <code>**negrita**</code>, <code>`código`</code>, listas con <code>- </code>, párrafos. <code>[^id]</code> cita una fuente. Nunca HTML.</td></tr>
            <tr><td><code>source</code></td><td><code>{"type":"source","id":"mayor","title":"Libro mayor · agosto","detail":"…","href":"/…"}</code></td></tr>
            <tr><td><code>action</code></td><td><code>{"type":"action","label":"Ver órdenes","href":"/…"}</code> (enlace) o <code>{"type":"action","label":"Redactar reclamo","id":"reclamo","data":{…}}</code> (emite <code>nx-ai-action</code>).</td></tr>
            <tr><td><code>note</code></td><td><code>{"type":"note","label":"cifras verificadas","tone":"success"}</code>: chip junto al resumen (<code>neutral</code>, <code>success</code>, <code>warning</code>, <code>danger</code>).</td></tr>
            <tr><td><code>error</code>, <code>done</code></td><td><code>{"type":"error","message":"…"}</code> termina con el mensaje; <code>{"type":"done"}</code> (o <code>[DONE]</code>, o cerrar el stream) termina bien.</td></tr>
          </tbody>
        </table>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
          <button role="tab" aria-selected="false">Backend</button>
          <button role="tab" aria-selected="false">Transporte propio</button>
        </div>
        <pre role="tabpanel"><code>&lt;nx-ai-answer id="ai" endpoint="/ai/preguntar" feedback&gt;&lt;/nx-ai-answer&gt;

ai.suggestions = ["¿Qué proveedores se retrasaron este mes?"];
ai.context = { registro: 2291 };            // viaja con cada pregunta
ai.addEventListener("nx-ai-action", (e) =&gt; abrirReclamo(e.detail.data));
ai.addEventListener("nx-ai-feedback", (e) =&gt; guardarVoto(e.detail));</code></pre>

        <pre role="tabpanel" hidden><code>// Cualquier servidor, cualquier modelo: solo escribe líneas.
res.setHeader("Content-Type", "application/x-ndjson");
const send = (e) =&gt; res.write(JSON.stringify(e) + "\n");

send({ type: "step", id: "q", label: "Consultando órdenes", status: "run" });
const ordenes = await db.ordenesRetrasadas();
send({ type: "step", id: "q", status: "done", detail: `${ordenes.length} órdenes` });
ordenes.forEach((o) =&gt; send({ type: "source", id: o.id, title: o.titulo, href: o.url }));

for await (const trozo of modelo.stream(pregunta, ordenes)) send({ type: "text", delta: trozo });
send({ type: "done" });</code></pre>

socket.onclose = () =&gt; ai.end();</code></pre>
      </div>

      <h2>API</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>endpoint</code>, <code>method</code></td><td>URL que responde con el protocolo (<code>POST</code> por defecto, cuerpo <code>{question, context}</code>).</td></tr>
            <tr><td><code>question</code></td><td>Pregunta inicial; con <code>endpoint</code> se pregunta al conectar.</td></tr>
            <tr><td><code>suggestions</code>, <code>placeholder</code></td><td>Preguntas sugeridas antes de la primera, y el texto de la caja.</td></tr>
            <tr><td><code>context</code></td><td>Datos (JSON) que viajan con cada pregunta: el registro que se está viendo, los filtros…</td></tr>
            <tr><td><code>feedback</code></td><td>👍/👎 al terminar (<code>nx-ai-feedback</code>).</td></tr>
            <tr><td><code>ask(q)</code>, <code>stop()</code></td><td>Preguntar y detener (lo recibido se queda).</td></tr>
            <tr><td><code>begin(q)</code>, <code>push(evento)</code>, <code>end()</code></td><td>Transporte propio: la app entrega los eventos.</td></tr>
            <tr><td><code>state</code>, <code>text</code></td><td><code>idle</code>, <code>working</code>, <code>streaming</code>, <code>done</code>, <code>error</code>, <code>stopped</code>; y el texto sin marcas.</td></tr>
            <tr><td>Eventos</td><td><code>nx-ai-start</code>, <code>nx-ai-done</code> <code>{question, text, sources, status}</code>, <code>nx-ai-action</code> <code>{id, label, data}</code>, <code>nx-ai-feedback</code> <code>{value, question, text}</code>.</td></tr>
          </tbody>
        </table>
      </div>

        La demo se pinta con <code>render(payload, contenedor)</code>. Edita el JSON (o usa los controles de arriba) y se
        vuelve a pintar.
      </p>
      <div class="payload">
        <textarea id="payload" spellcheck="false" aria-label="Payload BDUI"></textarea>
        <p class="payload__error" id="payload-error" hidden></p>
      </div>

      <h2>Uso</h2>
      <div class="tabs" data-tabs>
        <div role="tablist">
          <button role="tab" aria-selected="true">HTML</button>
          <button role="tab" aria-selected="false">SolidJS</button>
          <button role="tab" aria-selected="false">BDUI</button>
        </div>
        <pre role="tabpanel"><code>&lt;button popovertarget="menu" aria-label="Abrir menú"&gt;☰&lt;/button&gt;   &lt;!-- solo se ve en móvil --&gt;

&lt;nx-sidemenu id="menu" active="/ventas/pedidos" collapsible&gt;
  &lt;a slot="header" href="/"&gt;Mi app&lt;/a&gt;
  &lt;div slot="footer"&gt;…&lt;/div&gt;
&lt;/nx-sidemenu&gt;

&lt;script&gt;
  menu.items = [
    { id: "inicio", label: "Inicio", href: "/", icon: "house" },
    { id: "ventas", label: "Ventas", icon: "shopping-cart", section: "Operación",
      children: [{ id: "pedidos", label: "Pedidos", href: "/ventas/pedidos" }] },
  ];
&lt;/script&gt;</code></pre>
        <pre role="tabpanel" hidden><code>import { SideMenu } from "nx-ui/solid";
import { useLocation } from "@solidjs/router";

const loc = useLocation();
const [compact, setCompact] = createSignal(false);

&lt;SideMenu
  items={menu()}
  active={loc.pathname}              // los &lt;a href&gt; los intercepta el router solo
  collapsible
  collapsed={compact()}
  onToggle={(e) =&gt; { e.preventDefault(); setCompact(e.detail.collapsed); }}
&gt;
  &lt;a slot="header" href="/"&gt;Mi app&lt;/a&gt;
&lt;/SideMenu&gt;

// Sin envoltorio: &lt;nx-sidemenu prop:items={…} attr:active={…} bool:collapsed={…} /&gt;</code></pre>
        <pre role="tabpanel" hidden><code>import { render } from "nx-ui/bdui";

// Lo que responde el backend:
const node = {
  component: "SideMenu",
  props: { items: [...], active: "/ventas/pedidos", collapsible: true },
};
render(node, document.querySelector("#menu-slot"));</code></pre>
      </div>

      <h2>API</h2>
      <h3>Propiedades y atributos</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Tipo</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>items</code></td><td><code>MenuItem[]</code></td><td>Los ítems. El atributo acepta el mismo arreglo como JSON.</td></tr>
            <tr><td><code>active</code></td><td><code>string</code></td><td>Href (o id) de la pantalla actual. Coincidencia exacta; si no, el prefijo más largo por segmentos (un último segmento <code>index…</code> cuenta como su carpeta); si no, el <code>id</code> de un padre, que se enciende sin hoja activa (útil para una ficha de detalle).</td></tr>
            <tr><td><code>collapsed</code></td><td><code>boolean</code></td><td>Modo compacto de solo íconos (56 px). <code>"false"</code> cuenta como falso.</td></tr>
            <tr><td><code>collapsible</code></td><td><code>boolean</code></td><td>Pinta el botón de contraer al pie.</td></tr>
            <tr><td><code>auto-collapse</code> / <code>autoCollapse</code></td><td><code>boolean</code></td><td>En tablet (768–1023 px) arranca compacto; al volver a escritorio se expande si lo había contraído él. El usuario puede expandirlo a mano.</td></tr>
            <tr><td><code>labels</code></td><td><code>Partial&lt;SidemenuLabels&gt;</code></td><td>Textos: <code>nav</code>, <code>filter</code>, <code>empty</code>, <code>back</code>, <code>collapse</code>, <code>expand</code>. En español por defecto.</td></tr>
            <tr><td><code>open</code>, <code>show()</code>, <code>hide()</code>, <code>toggle()</code></td><td></td><td>El drawer móvil (&lt; 768 px). También sirve <code>&lt;button popovertarget="id"&gt;</code>.</td></tr>
          </tbody>
        </table>
      </div>
      <h3><code>MenuItem</code></h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Campo</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>id</code>, <code>label</code></td><td>Obligatorios. La etiqueta siempre se pinta como texto.</td></tr>
            <tr><td><code>href</code></td><td>Destino. Solo rutas relativas, <code>http(s)</code>, <code>mailto</code> y <code>tel</code>; lo demás se descarta.</td></tr>
            <tr><td><code>icon</code></td><td>Nombre registrado con <code>registerIcons</code>. Sin ícono: iniciales.</td></tr>
            <tr><td><code>section</code></td><td>Título del grupo (en el riel y en el panel de hijos).</td></tr>
            <tr><td><code>description</code></td><td>Segunda línea en el panel de hijos; también se busca en ella.</td></tr>
            <tr><td><code>children</code></td><td>Lo convierte en padre: abre su panel flotante (o un drill-down en el drawer) y nunca navega. El buscador solo aparece con más de 3 hijos.</td></tr>
            <tr><td><code>utility</code></td><td>En el panel del padre va como chip al pie (configuración, reportes).</td></tr>
            <tr><td><code>badge</code></td><td>Contador o marca (<code>12</code>, <code>"Nuevo"</code>). <code>0</code> no se pinta y más de 99 es «99+». En compacto se reduce a un punto y entra en el nombre accesible.</td></tr>
          </tbody>
        </table>
      </div>
      <h3>Eventos</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Evento</th><th><code>detail</code></th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>nx-select</code></td><td><code>{ item, href }</code></td><td>Al elegir una hoja. Cancelable: <code>preventDefault()</code> cancela la navegación del enlace.</td></tr>
            <tr><td><code>nx-toggle</code></td><td><code>{ collapsed, auto }</code></td><td>Botón de contraer (<code>auto: false</code>) o <code>auto-collapse</code> (<code>auto: true</code>). Cancelable: la app controla el estado.</td></tr>
            <tr><td><code>nx-open-change</code></td><td><code>{ open }</code></td><td>El drawer móvil se abrió o cerró.</td></tr>
          </tbody>
        </table>
      </div>
      <h3>Slots y variables CSS</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
          <tbody>
            <tr><td><code>slot="header"</code>, <code>slot="footer"</code></td><td>Tu contenido arriba y abajo del menú. No se mueve del DOM (seguro para hidratación).</td></tr>
            <tr><td><code>--nx-sidemenu-width</code></td><td>240px</td></tr>
            <tr><td><code>--nx-sidemenu-width-collapsed</code></td><td>56px</td></tr>
            <tr><td><code>--nx-sidemenu-drawer-width</code></td><td>280px (máx. 86vw)</td></tr>
            <tr><td><code>--nx-flyout-width</code></td><td>320px</td></tr>
          </tbody>
        </table>
      </div>
    </template>
  </body>
</html>
