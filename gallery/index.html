          <p class="sel-tip">
            Toma un pedido con «Simular sin conexión» encendido: queda en la píldora, ámbar. Toma otro y apaga el
            interruptor: salen los dos, en orden. Un pedido para <strong>Minimercado El Progreso</strong> choca con uno de
            televentas: abre la píldora y resuélvelo campo por campo. <strong>Tienda Doña Carmen</strong> tiene cupo de
            $ 250.000: un pedido mayor se rechaza y se corrige desde el panel. Recarga la página sin conexión: los
            pendientes siguen ahí.
          </p>
          <ol class="stage__log btn-events" id="sync-log"></ol>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>La cola</td><td><code>nxSync.enqueue()</code> guarda la operación en IndexedDB (en memoria si no hay) antes de intentar nada: cerrar la pestaña no la pierde. Se envían de a una, en el orden en que llegaron.</td></tr>
                <tr><td>Reintentos</td><td>Sin respuesta, 5xx, 429 o 408: toda la cola espera 1 s, 2 s, 4 s… hasta 60 s, con ±20 % al azar para que los teléfonos que recuperan la señal a la vez no lleguen juntos. Si el servidor manda <code>Retry-After</code>, se respeta.</td></tr>
                <tr><td>Conexión real</td><td><code>navigator.onLine</code> y los eventos <code>online</code>/<code>offline</code>, más un <code>ping</code> opcional: con red «arriba» pero sin llegar a ningún lado, se sigue probando antes de gastar intentos.</td></tr>
                <tr><td>Sin duplicados</td><td>Cada envío lleva <code>Idempotency-Key</code> con el id de la operación: si el servidor guardó el pedido pero la respuesta se perdió, el reintento no crea otro.</td></tr>
                <tr><td>Conflictos</td><td>Un 409 con la versión del servidor deja la operación «en conflicto». El comparador muestra, campo por campo, lo mío y lo del servidor con lo distinto resaltado; se elige por campo o «todo lo mío / todo lo del servidor», y la versión resuelta sale con <code>If-Match</code>.</td></tr>
                <tr><td>Rechazos</td><td>Otro 4xx queda «rechazado» con el mensaje del servidor; se corrige el cuerpo (JSON) y se reintenta, o se descarta. Ni conflictos ni rechazos frenan la cola: solo a las siguientes de su mismo <code>group</code>.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Protocolo</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Forma</th></tr></thead>
              <tbody>
                <tr><td>Cada envío</td><td><code>method url</code> con <code>Idempotency-Key: &lt;id&gt;</code>, <code>Content-Type: application/json</code> y, al resolver un conflicto, <code>If-Match: &lt;etag&gt;</code>.</td></tr>
                <tr><td><code>2xx</code></td><td>Listo: sale de la cola y llega <code>nx-sync-done</code> <code>{op, data}</code> con la respuesta.</td></tr>
                <tr><td><code>503</code>, <code>429</code>…</td><td>Se reintenta con la misma llave; <code>Retry-After</code> (segundos o fecha) manda.</td></tr>
                <tr><td><code>409</code></td><td><code>{server, local?, fields?, etag?, message?}</code>: la versión del servidor, la que recibió, los campos en disputa (<code>["cantidad"]</code> o <code>[{key, label}]</code>, con rutas «productos.0.cantidad») y su versión (o la cabecera <code>ETag</code>).</td></tr>
                <tr><td>Otro <code>4xx</code></td><td><code>{message}</code> (o <code>error</code>, <code>detail</code>, <code>title</code>): se muestra tal cual.</td></tr>
                <tr><td><code>GET ping</code></td><td>Cualquier respuesta: hay conexión.</td></tr>
                <tr><td><code>nx-sync-change</code></td><td><code>{online, pending, conflicts}</code> cada vez que cambia algo de eso.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>
            <pre role="tabpanel"><code>&lt;nx-sync ping="/api/ping"&gt;&lt;/nx-sync&gt;

    import { nxSync } from "nx32-elements/sync";

    // Sin conexión también: se guarda y se envía cuando se pueda.
    await nxSync.enqueue({
      method: "POST", url: "/api/pedidos", body: pedido,
      label: `Pedido · ${tienda.nombre}`, group: tienda.nit,
    });

    nxSync.subscribe((state, event) =&gt; {
      if (event?.type === "done") pintarConfirmado(event.data);
    });</code></pre>
            <pre role="tabpanel" hidden><code>import { Sync } from "nx32-elements/solid/sync";
    import { nxSync } from "nx32-elements/sync";

    &lt;Sync ping="/api/ping"
      fields={[{ key: "productos.*.cantidad", label: "Cantidad · {nombre}" }]}
      onChange={(e) =&gt; setPendientes(e.detail.pending)}
      onDone={(e) =&gt; agregar(e.detail.data)} /&gt;

    const tomar = (p) =&gt; nxSync.enqueue({ method: "POST", url: "/api/pedidos", body: p, label: p.cliente.nombre });</code></pre>
          </div>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>nxSync.enqueue({id?, method, url, body?, label, group?})</code></td><td>Guarda y envía cuando se pueda. Devuelve la operación. El mismo <code>id</code> otra vez reemplaza el cuerpo de la que aún no sale.</td></tr>
                <tr><td><code>pending()</code>, <code>retry(id, body?)</code>, <code>resolve(id, body)</code>, <code>discard(id)</code></td><td>Lo que falta (en orden), reintentar ya (con otro cuerpo, si se corrigió), reenviar un conflicto resuelto, sacar de la cola.</td></tr>
                <tr><td><code>flush()</code>, <code>check()</code>, <code>clear()</code></td><td>Intentar todo ya; comprobar la conexión con <code>ping</code>; vaciar la cola (al cerrar sesión).</td></tr>
                <tr><td><code>subscribe(fn)</code>, <code>state</code>, <code>configure({ping, base, max, timeout, headers})</code></td><td><code>fn(state, event)</code> con <code>{online, ops, pending, conflicts, failed, progress}</code>; los ajustes de la cola. <code>createSync()</code> crea otra (otra base, o para pruebas).</td></tr>
                <tr><td><code>&lt;nx-sync&gt;</code>: <code>ping</code>, <code>fields</code>, <code>labels</code>, <code>locale</code></td><td>URL de comprobación (ajusta la cola de la página), nombres de los campos para el comparador (con <code>*</code> y <code>{hermano}</code>), textos y formato.</td></tr>
                <tr><td><code>show()</code>, <code>hide()</code>, <code>toggle()</code>, <code>resolve(id)</code></td><td>El panel, y el comparador de un conflicto directamente.</td></tr>
                <tr><td>Teclado</td><td><kbd>Enter</kbd> o <kbd>Espacio</kbd> en la píldora abre el panel; <kbd>Tab</kbd> recorre las acciones; <kbd>↑</kbd>/<kbd>↓</kbd> eligen lado en el comparador; <kbd>Esc</kbd> cancela un descarte, vuelve a la lista y cierra.</td></tr>
                <tr><td>Eventos</td><td><code>nx-sync-change</code> <code>{online, pending, conflicts}</code>, <code>nx-sync-done</code> <code>{op, data}</code>.</td></tr>
              </tbody>
            </table>
          </div>
        </template>

          <p class="lead">
            Importar una hoja de Excel o un CSV sin sufrir. Se suelta el archivo, las columnas se acomodan solas (por el
            nombre o por lo que traen), los errores se corrigen ahí mismo y se importa. Nada de «error en la fila 412» y volver
            a empezar.
          </p>
          <p class="sel-tip">
            Prueba con un archivo de ejemplo, suelta uno tuyo o copia unas filas de Excel y presiona <kbd>Ctrl</kbd><kbd>V</kbd>
            sobre el componente. El CSV de ejemplo viene como lo exporta otro sistema: separador <code>;</code>, en windows-1252,
            con títulos arriba, un NIT con el dígito mal, un correo sin @, un repetido y una fecha 31/02. Con servidor, dos
            clientes ya existen y vuelven a la revisión. La segunda vez que cargues el mismo archivo, las columnas salen como
            las dejaste.
          </p>

            <div class="imp-samples" id="import-samples" role="group" aria-label="Archivos de ejemplo"></div>

            <h2 class="imp-card__title" id="imp-card-title">Importar clientes</h2>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Paso</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Archivo</td><td>CSV, TSV, TXT o .xlsx, arrastrado, elegido o pegado desde Excel. En CSV detecta el separador (<code>,</code> <code>;</code> tabulador <code>|</code>), las comillas, los saltos de línea dentro de una celda, el BOM y la codificación (UTF-8, y si no, windows-1252). El .xlsx se lee sin dependencias con un lector que se carga solo cuando llega un libro; si tiene varias hojas, se elige. La fila de encabezados se encuentra aunque haya títulos arriba, y se cambia a mano.</td></tr>
                <tr><td>Columnas</td><td>Cada campo queda asociado a una columna del archivo, con una muestra y la confianza: por el nombre (sin tildes, con <code>aliases</code>, tolerante a una letra de más) o, si el encabezado no dice nada, por lo que trae (correos, NIT con dígito válido, fechas, montos, opciones). Uno a uno. Un campo puede llevar un mismo valor para todas las filas. El mapeo se recuerda por encabezados (<code>memory</code> o el <code>id</code>).</td></tr>
                <tr><td>Revisión</td><td>Cada fila se normaliza según el tipo: números en el formato del archivo aunque no sea el del locale, montos con <code>$</code>, contables <code>(1.200)</code>, porcentajes, fechas dd/mm o mm/dd decididas por columna, seriales de Excel, sí/no/x. Primero las filas con errores, con su número de fila y la celda editable ahí mismo. Nunca se pintan más de 200.</td></tr>
                <tr><td>Importar</td><td>Sin <code>endpoint</code>, <code>nx-import-done</code> con las filas normalizadas. Con <code>endpoint</code>, en lotes con avance y cancelable; lo que el servidor rechaza vuelve a la revisión para corregirlo y reenviar solo eso. Al final, un CSV con lo que no entró y el motivo.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Protocolo</h2>
          <p>
            Con <code>endpoint</code>, las filas listas van en lotes de <code>batch</code> (500): <code>POST {"rows":[…],"offset":500}</code>.
            La respuesta puede traer errores; <code>row</code> es la posición en el envío (<code>offset</code> + índice), y sin
            <code>field</code> el error es de la fila entera. Un 4xx con <code>errors</code> también vale; sin <code>errors</code>, es un fallo del envío.
          </p>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Respuesta</th><th>Qué pasa</th></tr></thead>
              <tbody>
                <tr><td><code>{}</code></td><td>Todo el lote entró.</td></tr>
                <tr><td><code>{"errors":[{"row":503,"field":"nit","message":"NIT ya existe en el sistema"}]}</code></td><td>Esa fila vuelve a la revisión con el mensaje en su celda; el resto del lote entró.</td></tr>
                <tr><td>Error de red o 5xx</td><td>Se detiene, dice cuántas entraron y deja reintentar el resto.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>
            <pre role="tabpanel"><code>&lt;nx-import id="clientes" endpoint="/api/clientes/importar" columns='[
      {"key":"nit","label":"NIT","type":"nit","required":true,"unique":true,"aliases":["nit/cc","documento"]},
      {"key":"razon_social","label":"Razón social","required":true},
      {"key":"ciudad","label":"Ciudad","type":"option","options":[{"value":"05001","label":"Medellín"},{"value":"11001","label":"Bogotá D.C."}]},
      {"key":"correo","label":"Correo","type":"email"},
      {"key":"cupo","label":"Cupo de crédito","type":"money","min":0},
      {"key":"alta","label":"Fecha de alta","type":"date"}
    ]'&gt;&lt;/nx-import&gt;
    &lt;script&gt;
      clientes.addEventListener("nx-import-done", (e) =&gt; console.log(e.detail.rows, e.detail.skipped));
    &lt;/script&gt;</code></pre>
            <pre role="tabpanel" hidden><code>import { Import } from "nx32-elements/solid/import";

    &lt;Import
      id="clientes"
      columns={[{ key: "nit", label: "NIT", type: "nit", required: true }, { key: "correo", label: "Correo", type: "email" }]}
      onDone={(e) =&gt; guardar(e.detail.rows)}
    /&gt;</code></pre>
          </div>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>columns</code></td><td>Los campos de destino: <code>{key, label, type?, required?, unique?, options?, aliases?, min?, max?, pattern?, hint?}</code>. <code>type</code>: <code>text</code>, <code>number</code>, <code>money</code>, <code>percent</code>, <code>date</code>, <code>email</code>, <code>phone</code>, <code>nit</code>, <code>bool</code>, <code>option</code>.</td></tr>
                <tr><td><code>endpoint</code>, <code>batch</code></td><td>A dónde se envían las filas (mismo origen, o uno de <code>allowOrigins</code>) y cuántas por lote.</td></tr>
                <tr><td><code>accept</code>, <code>max-size</code></td><td>Tipos de archivo del selector y tamaño máximo (por defecto 20 MB; acepta «5MB», «500 KB»).</td></tr>
                <tr><td><code>memory</code>, <code>locale</code>, <code>labels</code>, <code>disabled</code></td><td>Clave para recordar el mapeo (sin ella, el <code>id</code>), formato de números y fechas, textos (<code>IMPORT_LABELS</code>; «uno|varios» para el plural).</td></tr>
                <tr><td><code>load(archivo | texto)</code>, <code>reset()</code></td><td>Cargar desde código; volver al paso 1. <code>state</code>, <code>rows</code> y <code>mapping</code> dicen cómo va.</td></tr>
                <tr><td>Eventos</td><td><code>nx-import-parsed</code> <code>{name, sheet?, sheets?, headers, headerRow, rows}</code>, <code>nx-import-mapped</code> <code>{mapping, fixed, remembered}</code>, <code>nx-import-done</code> <code>{rows, skipped, mapping, fixed, headers}</code>, <code>nx-import-error</code> <code>{code, message}</code>.</td></tr>
                <tr><td>Funciones</td><td><code>parseCsv</code>, <code>detectHeaderRow</code>, <code>autoMapColumns</code>, <code>validateImportRows</code>, <code>parseImportNumber</code>, <code>parseImportDate</code>… la misma lógica, sin DOM, para un backend en JavaScript o para probarla.</td></tr>
              </tbody>
            </table>
          </div>
        </template>

        <!-- ================================================================ Detector de dedazos -->
        <template id="page-guard">
          <p class="eyebrow">Componentes</p>
          <h1>Detector de dedazos <code class="tag">&lt;nx-guard&gt;</code></h1>
          <p class="lead">
            Los errores más caros de un ERP no son los que la validación rechaza, sino los valores válidos pero absurdos: un
            precio con un cero de más, una cantidad de 120 donde siempre van 12, una fecha en 2062, dos dígitos invertidos en
            un total. <code>&lt;nx-guard&gt;</code> envuelve tu formulario y, al salir de un campo, lo compara con lo
            habitual: si algo no cuadra, lo dice junto al campo, sin bloquear, con la corrección a un clic.
          </p>

          <div class="gd-tools" lang="es-CO">
            <div class="gd-try" role="group" aria-labelledby="gd-try-label">
              <span class="gd-try__label" id="gd-try-label">Prueba esto</span>
              <span id="gd-try"></span>
            </div>
            <fieldset class="gd-mode">
              <legend>Al registrar</legend>
              <label><input type="radio" name="gd-mode" value="warn" checked /> Solo avisar</label>
              <label><input type="radio" name="gd-mode" value="confirm" /> Pedir confirmación</label>
            </fieldset>
          </div>

          <nx-guard id="gd-demo" lang="es-CO" endpoint="/demo/guard/check">
            <form class="gd-form" id="gd-form">
              <header class="gd-form__head">
                <div>
                  <p class="gd-form__kicker">Cuentas por pagar · Registrar factura de proveedor</p>
                  <h2 class="gd-form__title">Aceros del Caribe S.A.S.</h2>
                  <p class="gd-form__meta">NIT 900.359.742-3 · Barranquilla · Crédito 30 días</p>
                </div>
                <dl class="gd-oc">
                  <div><dt>Orden de compra</dt><dd>OC-2291</dd></div>
                  <div><dt>Lámina HR 4×8 cal. 14</dt><dd>12 × $ 1.275.000</dd></div>
                  <div><dt>Total de la OC</dt><dd id="gd-oc-total">$ 15.300.000</dd></div>
                </dl>
              </header>
              <div class="gd-field">
                <label for="gd-factura">Número de factura</label>
                <input id="gd-factura" name="factura" autocomplete="off" placeholder="FC-0000" />
                <small class="gd-hint">La última registrada de este proveedor es la FC-8811.</small>
              </div>
              <div class="gd-field">
                <label for="gd-fecha">Fecha de la factura</label>
                <input id="gd-fecha" name="fecha" type="date" />
              </div>
              <div class="gd-field">
                <label for="gd-cantidad">Cantidad (láminas)</label>
                <input id="gd-cantidad" name="cantidad" inputmode="decimal" autocomplete="off" placeholder="0" />
              </div>
              <div class="gd-field">
                <label for="gd-precio">Precio unitario</label>
                <nx-number id="gd-precio" name="precio" format="money" currency="COP" min="0" placeholder="$ 0"></nx-number>
              </div>
              <div class="gd-field">
                <label for="gd-total">Total de la factura</label>
                <nx-number id="gd-total" name="total" format="money" currency="COP" min="0" placeholder="$ 0"></nx-number>
              </div>
              <div class="gd-form__foot">
                <button type="reset" class="dlg-plain">Limpiar</button>
                <button type="submit" class="gd-save">Registrar factura</button>
              </div>
            </form>
          </nx-guard>
          <ol class="stage__log btn-events" id="guard-log"></ol>

          <h2>Qué detecta</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Dedazo</th><th>Cómo lo ve</th></tr></thead>
              <tbody>
                <tr><td>Un cero de más o de menos</td><td>Con <code>history</code> (valores recientes del campo) calcula lo habitual con mediana y MAD: un atípico en la historia no mueve nada. Si lo escrito está lejos y dividido (o multiplicado) por 10, 100 o 1.000 cae en lo habitual, lo dice así: «$ 12.000.000 es 10 veces lo habitual ($ 1.200.000). ¿Sobra un cero?». Si solo está muy lejos: «Muy por encima de lo habitual ($1,1 M – $1,3 M)». Con menos de 4 datos, solo lo obvio.</td></tr>
                <tr><td>El separador confundido</td><td>«1.500» queriendo 1,5, o «1,500» de un sistema en inglés queriendo mil quinientos: si la otra lectura de lo que se tecleó cae en lo habitual, pregunta «¿Querías 1,5?». Lee igual que <code>&lt;nx-number&gt;</code>: «1.5» en es-CO es 1,5.</td></tr>
                <tr><td>Dígitos invertidos</td><td>Con <code>expected</code> (el total de la OC, el saldo, lo que dice el documento): dos dígitos vecinos cambiados de lugar («¿Invertiste dos dígitos? Esperado $ 15.300.000») o uno distinto.</td></tr>
                <tr><td>Fechas raras</td><td>Un año con dígitos invertidos o de otro siglo (2062, 2206, 0226 → 2026), fuera del rango del campo (<code>typical: ["-60d", "today"]</code>), fin de semana o festivo con <code>workdays</code>.</td></tr>
                <tr><td>Repetidos, decimales, negativos</td><td><code>repeat</code>: igual al último registrado. Decimales donde siempre van enteros (dicho o deducido de la historia) y negativos donde nunca los hay.</td></tr>
                <tr><td>Lo que sabe el servidor</td><td>Con <code>endpoint</code>: «Esta factura ya se registró». Si el servidor falla o tarda, silencio.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Haces</th><th>Pasa</th></tr></thead>
              <tbody>
                <tr><td>Escribes</td><td>Nada: no interrumpe mientras se escribe.</td></tr>
                <tr><td>Sales del campo</td><td>Si algo no cuadra, aparece debajo una línea con el aviso, «Corregir a …» (si hay una corrección) y «Está bien». El campo la tiene en su <code>aria-describedby</code> (nunca <code>aria-invalid</code>: no es un error) y se anuncia por una región <code>role="status"</code>.</td></tr>
                <tr><td>«Corregir a …»</td><td>Pone el valor (en <code>&lt;nx-number&gt;</code> por su <code>value</code>; en un input, con <code>input</code> y <code>change</code> para que tu framework se entere) y vuelve al campo.</td></tr>
                <tr><td>«Está bien»</td><td>No vuelve a avisar por ese valor en ese campo.</td></tr>
                <tr><td>Envías</td><td>Con <code>mode="warn"</code> (por defecto), nunca bloquea. Con <code>mode="confirm"</code>, el primer envío con avisos sin reconocer se detiene y dice cuántos hay arriba del botón; el segundo pasa.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Protocolo</h2>
          <p>
            Con <code>endpoint</code>, tras una pausa de 300 ms desde el cambio, se hace <code>POST {field, value, values}</code>
            (un cambio nuevo cancela el anterior). Lo que responde va primero, antes de lo local; si falla o tarda más de 4 s,
            no pasa nada. El <code>endpoint</code> es del mismo origen (o de uno de <code>allowOrigins()</code>).
          </p>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Ejemplo</th></tr></thead>
              <tbody>
                <tr><td>Pide</td><td><code>{"field":"factura","value":"FC-8812","values":{"factura":"FC-8812","fecha":"2026-09-24","cantidad":"12","precio":1275000,"total":null}}</code></td></tr>
                <tr><td>Responde</td><td><code>{"findings":[{"field":"factura","kind":"duplicate","message":"Esta factura ya se registró el 12 sept 2026 (CP-004512)"}]}</code>. Opcionales: <code>suggestion</code> y <code>severity</code> (<code>warn</code> o <code>info</code>).</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>
            <pre role="tabpanel"><code>&lt;nx-guard mode="confirm" endpoint="/facturas/revisar" fields='{
      "precio": {"history": [1180000, 1210000, 1195000, 1240000], "format": "money", "currency": "COP"},
      "cantidad": {"typical": [1, 50]},
      "total": {"expected": "#oc-total", "format": "money", "currency": "COP"},
      "fecha": {"typical": ["-60d", "today"]},
      "factura": {"repeat": true, "history": ["FC-8809", "FC-8811"]}
    }'&gt;
      &lt;form&gt;
        &lt;label&gt;Factura &lt;input name="factura"&gt;&lt;/label&gt;
        &lt;label&gt;Fecha &lt;input name="fecha" type="date"&gt;&lt;/label&gt;
        &lt;label&gt;Cantidad &lt;input name="cantidad" data-guard='{"integer": true}'&gt;&lt;/label&gt;
        &lt;label for="precio"&gt;Precio unitario&lt;/label&gt;
        &lt;nx-number id="precio" name="precio" format="money" currency="COP"&gt;&lt;/nx-number&gt;
      &lt;/form&gt;
    &lt;/nx-guard&gt;</code></pre>
            <pre role="tabpanel" hidden><code>import { Guard } from "nx32-elements/solid/guard";

    &lt;Guard mode="confirm" fields={{ precio: { history: historia(), format: "money", currency: "COP" } }}
      onWarn={(e) =&gt; console.log(e.detail.field, e.detail.finding.message)}&gt;
      &lt;form onSubmit={registrar}&gt;
        &lt;label for="precio"&gt;Precio unitario&lt;/label&gt;
        &lt;NumberInput id="precio" name="precio" format="money" currency="COP" /&gt;
      &lt;/form&gt;
    &lt;/Guard&gt;</code></pre>
          </div>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>fields</code></td><td>La configuración por <code>name</code> (JSON). También <code>data-guard='{…}'</code> en el propio campo, que gana. Campos sin configuración: nada, salvo un <code>&lt;input type="date"&gt;</code> con un año absurdo.</td></tr>
                <tr><td>Por campo</td><td><code>history</code>, <code>typical: [lo, hi]</code>, <code>min</code>/<code>max</code> (blandos), <code>expected</code> (un número, <code>"#id"</code> o <code>"@name"</code>), <code>format</code>/<code>currency</code>, <code>integer</code>, <code>negative</code>, <code>repeat</code>, <code>type</code> (<code>number</code>, <code>date</code>, <code>text</code>), <code>workdays</code>, <code>holidays</code>, <code>remote: false</code>. En fechas, <code>typical</code> acepta ISO o relativas a hoy: <code>"-30d"</code>, <code>"+2w"</code>, <code>"+6m"</code>, <code>"-1y"</code>, <code>"today"</code>.</td></tr>
                <tr><td><code>mode</code>, <code>endpoint</code>, <code>locale</code>, <code>labels</code>, <code>disabled</code></td><td><code>warn</code> o <code>confirm</code>, chequeo remoto, formato de montos y fechas, textos (con <code>{value}</code>, <code>{typical}</code>, <code>{n}</code>…), apagarlo.</td></tr>
                <tr><td><code>check(name?)</code>, <code>reset()</code>, <code>findings</code></td><td>Revisar ya (un campo o todos) y devolver los hallazgos; olvidar avisos y reconocidos; los avisos vigentes.</td></tr>
                <tr><td>Eventos</td><td><code>nx-guard-warn</code> <code>{field, finding}</code>, <code>nx-guard-fix</code> <code>{field, from, to}</code>, <code>nx-guard-ack</code> <code>{field, value}</code>, <code>nx-guard-block</code> <code>{findings}</code> (cancelable: cancelarlo deja pasar el envío).</td></tr>
                <tr><td>Funciones</td><td><code>guardCheck(valor, regla, {locale, raw})</code> y <code>robustRange(historia)</code>: la misma lógica, para revisar un lote importado en un backend en JavaScript.</td></tr>
              </tbody>
            </table>
          </div>
        </template>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Haces</th><th>Pasa</th></tr></thead>
              <tbody>
                <tr><td>«Usar el celular»</td><td><code>POST {endpoint}</code> crea una sesión de un solo uso y el panel muestra el QR del enlace (con el token de la sesión), «Copiar enlace» por si el celular no lee QR, cuánto falta para que venza y «Cancelar».</td></tr>
                <tr><td>El celular abre el enlace</td><td>El servidor lo marca conectado: «Celular conectado» (o el nombre del equipo, si el servidor lo sabe). Nadie más puede usar esa sesión.</td></tr>
                <tr><td>Toma la foto</td><td>Se reduce en el teléfono (lado mayor 2000 px, JPEG 0,85) y se sube una por una, con avance y reintento. En el computador: «Recibiendo 2 fotos…».</td></tr>
                <tr><td>Llega al formulario</td><td>Se descarga, sale <code>nx-handoff-item</code> (cancelable) y se entrega al elemento <code>for</code>: <code>extract(file)</code> de <code>&lt;nx-doc-capture&gt;</code>, un <code>&lt;input type=file&gt;</code> (con su <code>change</code>), <code>add(código)</code> de <code>&lt;nx-scan&gt;</code> o un campo de texto.</td></tr>
                <tr><td>Termina</td><td>El panel se cierra solo y queda «2 fotos desde el celular» con «Recibir más» (misma sesión si no ha vencido).</td></tr>

            </table>

          <h2>Protocolo</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Ruta</th><th>Qué hace</th></tr></thead>

                <tr><td><code>POST {endpoint}</code></td><td><code>{kind, accept?, multiple?, context?}</code> → <code>{id, url, expiresIn, token?}</code>. <code>url</code> es la página del celular, del mismo origen (o de <code>allowOrigins()</code>).</td></tr>
                <tr><td><code>GET {endpoint}/{id}/events?after=</code></td><td>SSE o NDJSON: <code>connected {device?}</code>, <code>progress {received, total?}</code>, <code>item {item}</code>, <code>done</code>, <code>expired</code>, <code>error {message}</code>, cada uno con <code>seq</code>.</td></tr>
                <tr><td><code>GET {endpoint}/{id}?after=</code></td><td>Polling de respaldo: <code>{events: […]}</code>.</td></tr>
                <tr><td><code>GET {endpoint}/{id}?t=</code></td><td>El celular: <code>{kind, accept?, multiple?, title?, hint?}</code>; marca «conectado». 410 si venció o ya se usó.</td></tr>
                <tr><td><code>POST {endpoint}/{id}/items?t=</code></td><td>Una foto (<code>multipart</code>, campo <code>file</code>) o un código (<code>{kind: "code", code, format?}</code>) → <code>{item}</code>. <code>POST …/done?t=</code> cierra la tanda.</td></tr>

          <h2>Cómo funciona</h2>

            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Celdas</td><td>Tres marcas y nada más: contorno punteado con ✦ (sugerida por la IA), relleno (lo elegido) y ámbar (una alerta). Cuando coinciden, relleno con ✦. «—» donde el proveedor no cotizó.</td></tr>
                <tr><td>Resumen</td><td>Total adjudicado, lo que cuestan tus cambios frente a la IA (en rojo si suben, en verde si bajan), cuántas órdenes salen y cuántas alertas quedan por abrir, con «Siguiente alerta».</td></tr>
                <tr><td>Detalle</td><td>Clic en un artículo: sus alertas, la razón de la IA, el ranking con el aporte de cada criterio, el precio original antes de normalizar y, si te apartaste, el costo del cambio, el motivo (con sugerencias o escrito) y «Volver a la sugerencia».</td></tr>
                <tr><td>Proveedor</td><td>Clic en su columna: cuántos artículos cotizó y cuántos se le adjudican. «Excluir de la sugerencia» vuelve a pedir la recomendación sin él; «Darle todo lo que cotizó» consolida con un clic y se deshace con otro.</td></tr>
                <tr><td>Criterios y escenarios</td><td>Mover un peso vuelve a pedir la recomendación y los contornos cambian de celda. Los escenarios del backend («Máximo 3 proveedores») cambian la sugerencia de los artículos que tocan, con cuántas órdenes dan y cuánto cuestan.</td></tr>
                <tr><td>Vista</td><td>Precio unitario, total de la línea, plazo o puntaje; todos los artículos, los que tienen alertas o los cambiados. Encabezado, primera columna y pie fijos al desplazarse.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Protocolo</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Forma</th></tr></thead>
              <tbody>
                <tr><td><code>POST endpoint</code></td><td><code>{weights: {criterio: peso}, excluded: [proveedor]}</code> → NDJSON (o <code>data:</code> de SSE), un evento por línea. Se pide al conectar, al mover un peso (con espera) y al excluir.</td></tr>
                <tr><td><code>recommend</code></td><td><code>{"type":"recommend","item","supplier","reason?","ranking":[{supplier, score, scores?: {criterio: 0–100}}]}</code>. <code>supplier: null</code> si no hay a quién sugerir.</td></tr>
                <tr><td><code>flag</code></td><td><code>{"type":"flag","item","supplier?","message","tone?"}</code> (<code>warning</code> por defecto, <code>danger</code>, <code>neutral</code>). Con <code>supplier</code>, también se marca su celda.</td></tr>
                <tr><td><code>scenario</code></td><td><code>{"type":"scenario","id","label","detail?","picks":{artículo: proveedor}}</code>.</td></tr>
                <tr><td><code>note</code>, <code>error</code>, <code>done</code></td><td>Avisos sobre la tabla; un error deja «Reintentar». Al terminar, lo que la recomendación no volvió a mandar desaparece.</td></tr>

                <tr><td><code>nx-award-submit</code></td><td><code>{orders: [{supplier, lines, total}], changes: [{item, supplier, recommended, reason, delta}], value, total, unassigned, scenario, weights, excluded, pending}</code>.</td></tr>
              </tbody>
            </table>
          </div>

              <tbody>

                <tr><td><code>session</code>, <code>expires-at</code>, <code>warn-before</code></td><td><code>{expiresAt, extendEndpoint?}</code>; aviso <code>warn-before</code> minutos antes (5) con cuenta regresiva y «Extender».</td></tr>
                <tr><td><code>view-as</code>, <code>view-as-source</code></td><td>La persona suplantada (muestra la franja y marca la tarjeta con <code>data-view-as</code>) y dónde buscar personas (<code>GET ?q=</code>).</td></tr>
                <tr><td><code>logout-url</code>, <code>logout-method</code>, <code>logout-csrf</code>, <code>logout-csrf-field</code></td><td>A dónde ir al salir (solo del mismo origen): un <code>POST</code> con el token en el campo <code>_csrf</code> (o el que digas); <code>logout-method="get"</code> navega.</td></tr>
                <tr><td><code>sync</code>, <code>commands</code></td><td>Propiedades: la cola de <code>nx-sync</code> y las acciones para <code>&lt;nx-command&gt;</code>.</td></tr>
                <tr><td><code>labels</code>, <code>locale</code>, <code>disabled</code></td><td>Textos, locale de los números y apagar la tarjeta.</td></tr>
                <tr><td>Métodos</td><td><code>show()</code>, <code>hide()</code>, <code>logout()</code>.</td></tr>
                <tr><td>Eventos</td><td><code>nx-account-switch</code> y <code>nx-account-view-as</code> (cancelables; este al entrar y al salir), <code>nx-account-status</code>, <code>nx-account-theme</code>, <code>nx-account-locale</code>, <code>nx-account-select</code>, <code>nx-account-extend</code> (cancelable), <code>nx-account-expired</code>, <code>nx-account-logout</code> (cancelable) y <code>nx-open-change</code>.</td></tr>
              </tbody>
            </table>

        <!-- ================================================================ Launcher -->
        <template id="page-launcher">
          <p class="eyebrow">Componentes</p>
          <h1>Launcher <code class="tag">&lt;nx-launcher&gt;</code></h1>
          <p class="lead">
            Tarjetas para entrar a los módulos de un área. Cada una dice para qué sirve el módulo y trae un solo dato vivo
            («3 de tu equipo por aprobar»). Pasa el puntero: la descripción cede su lugar a las pestañas del módulo, para
            entrar directo a una. Al hacer clic, la tarjeta se convierte en la página.
          </p>

          <h2>Autoservicio de Talento humano</h2>
          <div class="la-demo" data-la-demo="talento">
            <nx-launcher locale="es-CO" labels='{"nav":"Trámites de Talento humano","views":"Pestañas de {name}"}'></nx-launcher>
            <div class="la-page" hidden></div>
          </div>

          <h2>Compras: secciones, destacada y buscador</h2>
          <div class="la-demo" data-la-demo="compras">
            <nx-launcher locale="es-CO" search></nx-launcher>
            <div class="la-page" hidden></div>
          </div>
          <p class="sel-tip">
            Escribe en cualquier parte de la página (sin tener un campo enfocado): va al buscador, lo que no coincide se apaga
            sin moverse y <kbd>↵</kbd> abre la primera coincidencia; prueba «diferencia» o «pólizas». Con el foco en una
            tarjeta, las flechas pasan a la vecina. Cada tanto llega una solicitud nueva y su número cambia con un pulso.
          </p>
          <ol class="stage__log btn-events" id="la-log"></ol>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Tarjeta</td><td>Un <code>&lt;a href&gt;</code> real que ocupa toda la tarjeta: el router de la app lo intercepta y en HTML plano navega. Sin <code>href</code>, el de su primera vista; sin ninguno, un botón.</td></tr>
                <tr><td>Vistas</td><td>Con puntero, al pasar por la tarjeta (o al llegar con <kbd>Tab</kbd>) la descripción cede su lugar a las vistas, sin cambiar el tamaño. En pantallas táctiles se ven siempre, debajo. Pueden llevar contador y una pista («15 sep 2026»).</td></tr>
                <tr><td>Señal</td><td>El dato grande, su etiqueta y una nota con punto de color (<code>success</code>, <code>warning</code>, <code>danger</code>), una barra (<code>meter</code>) o una minigráfica (<code>trend</code>). Si el dato cambia, pulsa; si solo cambia la señal, la tarjeta no se rehace.</td></tr>
                <tr><td>Destacada</td><td><code>featured</code>: dos columnas con el acento de fondo, una línea superior y una barra por partes («38 adjudicados · 7 con sugerencia · 15 sin decidir»).</td></tr>
                <tr><td>Columnas</td><td>Las que caben con <code>--nx-launcher-min</code> (240 px), hasta <code>columns</code> (4). Entre esas y una menos, las que dejan menos tarjetas huérfanas: 4 módulos donde caben 3 van en 2 × 2.</td></tr>
                <tr><td>Buscador</td><td><code>search</code>: lo que no coincide se apaga en su sitio (la memoria de dónde está cada módulo vale más que un reacomodo). Busca en el nombre, la descripción y las vistas; <kbd>↵</kbd> abre la primera coincidencia, que puede ser una vista.</td></tr>
                <tr><td>Transición</td><td>La tarjeta abierta lleva los nombres <code>nx-launcher-card</code>, <code>-icon</code> y <code>-label</code>. El encabezado de la página de destino usa los mismos (<code>.nx-launcher-hero</code>, <code>.nx-launcher-hero-icon</code>, <code>.nx-launcher-hero-label</code>) y el navegador anima el paso: con <code>startViewTransition</code> en una SPA, o entre documentos con <code>@view-transition { navigation: auto }</code>. Al volver, <code>reveal()</code> (o solo, con <code>pagereveal</code>) devuelve los nombres a la tarjeta de la que se salió.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>

                <tr><td><code>focusItem(id?)</code>, <code>reveal(id?)</code></td><td>Enfocar una tarjeta; marcar para la transición de vuelta la tarjeta de la que se salió (o <code>id</code>).</td></tr>

        <template id="page-org">
          <p class="eyebrow">Componentes</p>
          <h1>Organigrama <code class="tag">&lt;nx-org&gt;</code></h1>
          <p class="lead">
            Un grupo de tres empresas con unas 300 personas, con dos lentes sobre los mismos datos. <strong>Yo</strong> muestra el
            lugar de quien mira: su cadena hacia arriba, su jefe, quienes comparten jefe, su equipo y a quién acude para cada cosa.
            <strong>Organización</strong> muestra el árbol de unidades, cada una con quien la dirige, y al abrir una, su gente
            con las mismas ramas.
          </p>
          <nx-org id="org-demo" locale="es-CO" searchable></nx-org>
          <p class="sel-tip">
            Pulsa a cualquier persona para centrarte en ella: arriba aparece el camino desde ti («Tu jefe común con… es…»). En
            <em>Organización</em>, el camino hasta tu unidad llega abierto y marcado; pulsa una unidad para ver su gente
            (<kbd>Esc</kbd> vuelve al árbol), y «n subunidades» o las flechas <kbd>→</kbd> / <kbd>←</kbd> las despliegan o pliegan.
            El menú <em>Color</em> muestra una sola cifra a la vez en cada unidad.
          </p>
          <ol class="stage__log btn-events" id="org-log"></ol>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Yo</td><td>La persona del centro (por defecto, <code>me</code>) con su cadena en una línea, su jefe, quienes comparten jefe (los primeros ocho y «+n») y su equipo directo, con cuántos tiene cada uno a cargo. Para quien mira, <code>contacts</code>: «Para… / Acudes a…».</td></tr>
                <tr><td>Camino</td><td>Si el centro es otra persona, el jefe común más cercano y cuántos niveles hay hasta él. «Volver a mí» regresa.</td></tr>
                <tr><td>Organización</td><td>El árbol de unidades: la raíz arriba, sus hijas en fila con ramas y debajo de cada una sus subunidades sobre un riel (hasta 12 y «+n»). Cada unidad lleva el tono de su rama, su líder (<code>leader</code>), cuántas personas tiene y algunas caras. Al abrir una, su gente como en «Yo»: el líder, cada jefe con su equipo en pila y los directos aparte.</td></tr>
                <tr><td>Color</td><td>Una cifra de <code>unit.metrics</code> a la vez (<code>metrics</code>) en cada unidad, en el acento, ámbar o rojo, más intensa cuanto más alta entre sus hermanas; con <code>per: "count"</code>, por persona de la unidad.</td></tr>
                <tr><td>Por partes</td><td>Con <code>source</code>, un POST pide lo que falta: <code>{unit}</code> (sus personas), <code>{person}</code> (su cadena, sus pares y su equipo) o <code>{search}</code>, y responde <code>{people?, units?}</code>. Lo que llega completo de arranque no se vuelve a pedir. Una persona con <code>locked</code> se ve pero no se abre.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>

        <template id="page-cards">
          <p class="eyebrow">Componentes</p>
          <h1>Tarjetas con zoom <code class="tag">&lt;nx-cards&gt;</code></h1>
          <p class="lead">
            142 proveedores en tres niveles de la misma vista: <strong>Mapa</strong> (un cuadro por proveedor: el color dice el
            estado y la intensidad, cuánto se le compra), <strong>Tarjetas</strong> y <strong>Fichas</strong>. Al pasar de uno a
            otro cada tarjeta se transforma en su sitio, y la que está bajo el puntero no se mueve.
          </p>
          <nx-cards id="cards-demo" locale="es-CO" group="cat" sort="compras"></nx-cards>
          <p class="sel-tip">
            Cambia de nivel con el selector, con <kbd>Ctrl</kbd> + rueda (o pellizcando en el trackpad) sobre las tarjetas, o
            con <kbd>+</kbd> / <kbd>−</kbd> con el foco en una. Haz clic en una tarjeta para abrirla donde está; <kbd>Esc</kbd>
            la cierra. Agrupa por estado u ordena por cumplimiento: las tarjetas se deslizan a su nuevo lugar.
          </p>
          <ol class="stage__log btn-events" id="cards-log"></ol>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Mapa</td><td>Un cuadro por registro. Los estados <code>neutral</code> y <code>success</code> usan el acento, más intenso cuanto más peso (<code>layout.weight</code>, o el dato grande); <code>warning</code> y <code>danger</code>, su color; <code>info</code> (en trámite), un contorno punteado. Al pasar el puntero, el nombre, el dato y el estado. La leyenda cuenta cada estado.</td></tr>
                <tr><td>Tarjetas</td><td>Título, estado, subtítulo, una nota con el color del estado, el dato grande con su cambio y su minigráfica, y una línea corta. El 10 % de más peso ocupa dos columnas; el estado normal (<code>quiet</code>) no se anuncia, para que resalten los demás.</td></tr>
                <tr><td>Fichas</td><td>Todos los datos de <code>layout.facts</code>; un porcentaje con <code>good</code> / <code>bad</code> lleva barra verde, ámbar o roja.</td></tr>
                <tr><td>Abierta</td><td>Ocupa la fila, con la lista de <code>layout.related</code>, las acciones (<code>nx-cards-action</code>; deshabilitadas en los estados de <code>disabledFor</code>) y «Abrir» si hay <code>layout.href</code>.</td></tr>
                <tr><td>Movimiento</td><td>Un nodo por registro en los tres niveles: cambiar de nivel, ordenar, agrupar o buscar los mueve desde donde estaban (FLIP). Sin animación si se pidió menos movimiento. El mapa no arma el cuerpo de las tarjetas: con miles de registros solo pinta cuadros.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>
            <pre role="tabpanel"><code>&lt;nx-cards id="prov" group="cat" sort="compras"&gt;&lt;/nx-cards&gt;

    prov.fields = [
      { key: "name", label: "Nombre", sort: "asc" },

        { value: "ok", label: "Al día", tone: "success", quiet: true },
        { value: "bloqueado", label: "Bloqueado", tone: "danger" }] },
      { key: "compras", label: "Compras en 12 meses", type: "money", currency: "COP", sort: "desc" },
      { key: "cumpl", label: "Entregas a tiempo", type: "percent", good: 90, bad: 80 },
    ];
    prov.layout = { title: "name", subtitle: ["cat", "city"], status: "state", value: "compras",
      trend: "months", brief: ["cumpl"], facts: ["cumpl", "city"] };
    prov.rows = await (await fetch("/api/proveedores")).json();</code></pre>
            <pre role="tabpanel" hidden><code>import { Cards } from "nx32-elements/solid/cards";

    &lt;Cards fields={campos} layout={distribucion} rows={proveedores()} group="cat" sort="compras"
      actions={[{ id: "orden", label: "Nueva orden de compra", primary: true, disabledFor: ["bloqueado"] }]}
      onAction={(e) =&gt; navegar(`/ordenes/nueva?proveedor=${e.detail.row.id}`)} /&gt;</code></pre>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>fields</code></td><td><code>[{key, label, type?, currency?, compact?, unit?, options?, sort?, group?, search?, good?, bad?}]</code>. <code>type</code>: <code>text</code>, <code>number</code>, <code>money</code>, <code>percent</code>, <code>rating</code>, <code>date</code> o <code>status</code> (con <code>options: [{value, label?, tone?, quiet?}]</code>).</td></tr>
                <tr><td><code>layout</code></td><td>Dónde va cada campo (por su <code>key</code>): <code>{title, subtitle?, status?, note?, value?, delta?, trend?, weight?, brief?, facts?, related?, href?}</code>.</td></tr>
                <tr><td><code>rows</code>, <code>row-key</code></td><td>Los registros tal como salen de la base de datos; el campo que los identifica (<code>id</code>).</td></tr>
                <tr><td><code>actions</code></td><td><code>[{id, label, primary?, disabledFor?}]</code>: botones de la tarjeta abierta.</td></tr>
                <tr><td><code>level</code>, <code>group</code>, <code>sort</code>, <code>query</code></td><td><code>map</code>, <code>cards</code> o <code>detail</code>; el campo de los estantes; <code>campo</code> o <code>campo:asc</code> / <code>campo:desc</code>; lo buscado.</td></tr>

                <tr><td><code>zoom(dir, anchor?)</code>, <code>openRow(key)</code>, <code>openKey</code></td><td>Acercar o alejar (con el registro <code>anchor</code> fijo), abrir o cerrar una tarjeta, la abierta.</td></tr>
                <tr><td>Eventos</td><td><code>nx-cards-level</code> <code>{level}</code>, <code>nx-cards-open</code> <code>{row, open}</code>, <code>nx-cards-action</code> <code>{action, row}</code>.</td></tr>
                <tr><td>Teclado</td><td>Flechas entre tarjetas (también entre estantes), <kbd>Inicio</kbd>/<kbd>Fin</kbd>, <kbd>+</kbd>/<kbd>−</kbd> para el nivel, <kbd>↵</kbd> abre y <kbd>Esc</kbd> cierra.</td></tr>

            </table>

                La remisión suma el peso: al pie de la primera hoja dice cuánto «Van» y la segunda empieza con «Vienen». Imprime
                cualquiera de las dos con su botón, o con <kbd>Ctrl</kbd> <kbd>P</kbd> (toma la primera de la página); en el diálogo,
                «Guardar como PDF» usa el número del documento como nombre del archivo.
              </p>
              <ol class="stage__log btn-events" id="pr-log"></ol>

              <h2>Cómo funciona</h2>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
                  <tbody>
                    <tr><td>Documento</td><td>Los hijos del elemento, en su sitio: quedan ocultos a la vista y disponibles para el lector de pantalla (el documento de verdad, sin repeticiones). Las hojas se arman con copias sin <code>id</code>, con <code>aria-hidden</code> e <code>inert</code>.</td></tr>
                    <tr><td>Encabezado y pie</td><td><code>slot="header"</code> y <code>slot="footer"</code> se repiten en cada hoja. <code>{page}</code> y <code>{pages}</code> se reemplazan allí y en cualquier elemento con <code>data-print-page</code>, que en el original queda oculto (el lector no oye las marcas).</td></tr>
                    <tr><td>Tablas</td><td>Una <code>&lt;table&gt;</code> hija directa se parte por filas, con su <code>&lt;thead&gt;</code> en cada hoja y los anchos de columna fijos; <code>&lt;caption&gt;</code> solo al comienzo y <code>&lt;tfoot&gt;</code> al final. Al menos dos filas a cada lado del corte.</td></tr>
                    <tr><td>Van / Vienen</td><td>Las columnas con <code>data-print-sum</code> en su <code>&lt;th&gt;</code> suman: montos con la moneda de <code>data-currency</code> (o del atributo <code>currency</code>), o números con <code>data-print-sum="number"</code>. El valor de cada celda sale de <code>data-value</code> o de su texto.</td></tr>
                    <tr><td>Cortes</td><td><code>data-print-keep</code> (o <code>break-inside: avoid</code>) no parte un bloque; <code>data-print-keep-with-next</code> (o <code>break-after: avoid</code>) pega un título al bloque siguiente; <code>data-print-break="before"</code> / <code>"after"</code> (o <code>break-before: page</code>) fuerza el salto. Un bloque más alto que una hoja se parte igual.</td></tr>
                    <tr><td>Paginar</td><td>Una sola lectura de alturas y un reparto puro (<code>paginatePrint</code>). Se repite solo si cambia el contenido, el tamaño, los márgenes, las fuentes o carga una imagen.</td></tr>
                    <tr><td>Imprimir</td><td>Se pone una hoja con <code>@page { size; margin: 0 }</code> que oculta todo menos las hojas de este elemento, y el título del documento pasa a <code>heading</code> (el nombre sugerido del PDF). Al cerrar el diálogo se quita todo.</td></tr>
                    <tr><td>PDF</td><td>«Guardar como PDF» abre el mismo diálogo con una pista. No hay un PDF propio: sin dependencias no se puede hacer bien (fuentes, texto seleccionable, acentos); el del navegador sí lo es.</td></tr>
                  </tbody>
                </table>
              </div>

              <h2>Uso</h2>
              <div class="tabs" data-tabs>
                <div role="tablist">
                  <button role="tab" aria-selected="true">HTML</button>
                  <button role="tab" aria-selected="false">SolidJS</button>
                </div>

    &lt;/nx-print&gt;

    /* Estilos del documento: con selectores de descendiente, no de hijo directo. */
    .factura td { padding: 3px 6px; }</code></pre>

              <h2>API</h2>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
                  <tbody>
                    <tr><td><code>size</code></td><td><code>letter</code> (carta, por defecto), <code>a4</code>, <code>a5</code>, <code>legal</code>, <code>oficio</code>, <code>half-letter</code> (media carta) o dos medidas: <code>"216mm 140mm"</code>.</td></tr>
                    <tr><td><code>orientation</code>, <code>margin</code></td><td><code>portrait</code> / <code>landscape</code>; márgenes de uno a cuatro valores, como en CSS (12 mm).</td></tr>
                    <tr><td><code>heading</code>, <code>currency</code>, <code>locale</code></td><td>Título del documento (nombre sugerido del PDF); moneda de las sumas; formato de los números.</td></tr>
                    <tr><td><code>zoom</code>, <code>toolbar</code>, <code>labels</code></td><td><code>fit</code> (ajustar al ancho, sin pasar de 100 %) o un factor; <code>toolbar="false"</code> quita la barra; textos.</td></tr>

              </figure>

            </div>

              <summary>El SVG y los metadatos (JSON)</summary>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Trazo</td><td>Pointer Events con captura y eventos coalescidos (mouse, lápiz y dedo por igual), <code>touch-action: none</code>. El ancho cambia con la velocidad (rápido, fino) y con la presión del lápiz; las curvas son cuadráticas por los puntos medios, y el canvas se pinta a la densidad de la pantalla.</td></tr>
                <tr><td>Papel</td><td>La zona de firma es clara también en modo oscuro, con la línea, la «×» y «Firme aquí»: una firma se archiva sobre papel, con tinta oscura (<code>pen-color</code>).</td></tr>
                <tr><td>Vector</td><td>Cada trazo es un <code>&lt;path&gt;</code> relleno (su contorno), recortado a lo firmado con un margen. El SVG es la fuente de verdad: <code>toPNG(escala)</code> y el valor del formulario salen de él, y se vuelve a pintar a cualquier tamaño.</td></tr>
                <tr><td>Firmar</td><td>«Firmar» exige una firma de verdad (ni un punto ni una raya) y, con <code>required</code>, el nombre y la cédula que se pidan. Congela la firma, pone la fecha («Firmado el 28 sept 2026, 3:42 p. m.») y emite <code>nx-signature-done</code>.</td></tr>
                <tr><td>Huella</td><td>Con <code>document</code> (un texto o el <code>id</code> de un elemento), SHA-256 del texto normalizado más la fecha, en hexadecimal: prueba qué se firmó. No es una firma electrónica certificada.</td></tr>
                <tr><td>Sin trazo</td><td>«Escribir mi nombre» genera la firma con la cursiva del sistema (nada se descarga), marcada <code>typed: true</code>. Es el camino por teclado y para quien no puede firmar con el dedo.</td></tr>
                <tr><td>En el celular</td><td>Con <code>handoff</code> (o un <code>&lt;nx-handoff for&gt;</code> que apunte aquí), «Firmar en el celular» muestra el QR de <code>&lt;nx-handoff kind="signature"&gt;</code>. El celular carga <code>&lt;nx-signature&gt;</code> aparte, manda <code>{svg, meta}</code> y la firma aparece aquí, con la huella calculada donde está el documento.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>
            <pre role="tabpanel"><code>&lt;form method="post" action="/remisiones/REM-4471/recibido"&gt;
      &lt;article id="remision"&gt;…&lt;/article&gt;
      &lt;nx-signature name="recibido" ask-name ask-id required document="remision"
        handoff="/api/handoff"&gt;&lt;/nx-signature&gt;
      &lt;button&gt;Registrar el recibido&lt;/button&gt;
    &lt;/form&gt;

    &lt;!-- Mostrar una firma guardada --&gt;
    &lt;nx-signature readonly value='{"svg":"&lt;svg …&gt;","meta":{…}}'&gt;&lt;/nx-signature&gt;</code></pre>
            <pre role="tabpanel" hidden><code>import { Signature } from "nx32-elements/solid/signature";

    &lt;Signature name="recibido" askName askId required document="remision" handoff="/api/handoff"
      onDone={(e) =&gt; guardar(e.detail.svg, e.detail.meta)} /&gt;</code></pre>
          </div>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>name</code>, <code>required</code>, <code>value-format</code></td><td>Participa en el <code>&lt;form&gt;</code>. Envía <code>json</code> (por defecto: <code>{svg, meta}</code>), <code>svg</code> o <code>png</code> (un archivo). <code>required</code> exige una firma de verdad y los campos que se pidan. El <code>reset</code> del formulario la borra.</td></tr>
                <tr><td><code>ask-name</code>, <code>ask-id</code></td><td>Nombre y cédula de quien firma (van en <code>meta.name</code> y <code>meta.id</code>).</td></tr>
                <tr><td><code>document</code></td><td>El texto que se firma, o el <code>id</code> de un elemento cuyo texto se firma: con él sale <code>meta.hash</code>.</td></tr>
                <tr><td><code>geo</code></td><td>Pide la ubicación una vez, con tope de tiempo; si la niegan, firma sin ella (<code>meta.geo</code>).</td></tr>
                <tr><td><code>auto</code></td><td>Sin botón «Firmar»: la firma se da por hecha un momento después del último trazo.</td></tr>
                <tr><td><code>handoff</code></td><td>La base de las rutas de <code>&lt;nx-handoff&gt;</code>: muestra «Firmar en el celular».</td></tr>
                <tr><td><code>readonly</code>, <code>disabled</code>, <code>value</code></td><td>Mostrar una firma guardada (<code>value</code>: el JSON o el SVG); apagarla.</td></tr>
                <tr><td><code>pen-color</code>, <code>height</code>, <code>locale</code>, <code>labels</code></td><td>Tinta (casi negro azulado), alto de la zona (180 px), formato de la fecha y textos (<code>SIGNATURE_LABELS</code>).</td></tr>
                <tr><td>Métodos</td><td><code>clear()</code>, <code>undo()</code>, <code>toSVG()</code>, <code>toPNG(escala?)</code> → <code>Promise&lt;Blob | null&gt;</code>, <code>load(valor)</code>, <code>isEmpty()</code>, <code>checkValidity()</code>. Propiedad <code>strokes</code>: los puntos (x, y, t, presión).</td></tr>
                <tr><td>Eventos</td><td><code>nx-signature-change</code> <code>{empty}</code>, <code>nx-signature-done</code> <code>{svg, meta}</code>.</td></tr>
                <tr><td><code>meta</code></td><td><code>{signedAt, name?, id?, typed, strokes, points, width, height, device, hash?, geo?}</code>.</td></tr>
                <tr><td>Funciones</td><td><code>signatureSVG</code>, <code>signaturePath</code>, <code>signatureWidth</code>, <code>smoothSignaturePoints</code>, <code>signatureBounds</code>, <code>signatureCheck</code>, <code>signatureHash</code>, <code>typedSignatureSVG</code>, <code>parseSignatureValue</code>.</td></tr>
              </tbody>
            </table>
          </div>
        </template>

        <!-- ================================================================ Agenda de recursos -->
        <template id="page-planner">
          <p class="eyebrow">Componentes</p>
          <h1>Agenda de recursos <code class="tag">&lt;nx-planner&gt;</code></h1>
          <p class="lead">
            Los despachos de Aceros del Caribe: nueve camiones y tres montacargas en filas y la semana del festivo en columnas.
            Arrastra una entrega a otra hora o a otro camión, estírala por los bordes o crea una arrastrando sobre un hueco: la
            sombra dice la hora de inicio y fin y si chocaría. Se ve al instante; si el servidor no la acepta, vuelve a su lugar
            y dice por qué.
          </p>
          <nx-planner id="planner-demo" view="week" date="2026-10-13" hours="06:00-18:00" holidays='["2026-10-12"]'
            summary="equipos" endpoint="/demo/planner/reservas" locale="es-CO"></nx-planner>
          <div class="dlg-row">
            <button type="button" class="dlg-plain" id="planner-big">Cargar 300 recursos</button>
          </div>
          <p class="sel-tip">
            Lleva una entrega al <strong>SXT-904</strong> el miércoles: está en mantenimiento y la API la rechaza. El jueves el
            <strong>KLM-317</strong> tiene dos entregas a la vez (el choque marcado). <kbd>Ctrl</kbd>+<kbd>Z</kbd> deshace; con
            <kbd>Ctrl</kbd> + rueda se acerca o aleja. Con el teclado: <kbd>Tab</kbd> hasta la rejilla, flechas por camión y
            franja, <kbd>↵</kbd> abre la entrega o crea una; en la entrega, flechas la mueven y <kbd>Mayús</kbd>+flechas cambian
            la duración.
          </p>
          <ol class="stage__log btn-events" id="planner-log"></ol>

          <h2>Cómo funciona</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Pieza</th><th>Qué hace</th></tr></thead>
              <tbody>
                <tr><td>Vistas</td><td><code>day</code> (franjas de 60, 30 o 15 min según el zoom), <code>week</code> y <code>month</code> (un día por columna; con <code>hours</code>, solo el horario laboral). Fines de semana, festivos y horas fuera del horario, sombreados; una línea marca «ahora».</td></tr>
                <tr><td>Carriles y choques</td><td>Las reservas que se solapan en un recurso se apilan en carriles. Si pasan de su <code>capacity</code> (1), la fila y las barras se marcan y la barra dice cuántos recursos tienen choque. Un <code>block</code> (mantenimiento) ocupa el recurso entero.</td></tr>
                <tr><td>Editar</td><td>Mover (en el tiempo y entre recursos), cambiar la duración por los bordes y crear sobre un hueco, ajustado a <code>snap</code>. Con el dedo, manteniendo pulsado. Soltar emite el evento (cancelable) y, con <code>endpoint</code>, el <code>PATCH</code>/<code>POST</code>/<code>DELETE</code>; si la app cancela o el servidor falla, vuelve con un aviso.</td></tr>
                <tr><td>Deshacer</td><td>El último cambio, con el aviso, <kbd>Ctrl</kbd>/<kbd>⌘</kbd>+<kbd>Z</kbd> o <code>undo()</code>: emite el evento inverso (<code>via: "undo"</code>) y su petición.</td></tr>
                <tr><td>Datos grandes</td><td>Solo se pintan las filas y columnas visibles (y un margen). Con <code>source</code> pide cada período: <code>GET {source}?from=…&amp;to=…</code> → <code>{resources?, bookings}</code>, y aborta la petición anterior.</td></tr>
              </tbody>
            </table>
          </div>

          <h2>Uso</h2>
          <div class="tabs" data-tabs>
            <div role="tablist">
              <button role="tab" aria-selected="true">HTML</button>
              <button role="tab" aria-selected="false">SolidJS</button>
            </div>
            <pre role="tabpanel"><code>&lt;nx-planner id="despachos" view="week" hours="06:00-18:00" holidays='["2026-10-12"]'
      summary="equipos" endpoint="/api/despachos/reservas"&gt;&lt;/nx-planner&gt;

    despachos.resources = [
      { id: "TKR-512", name: "TKR-512", detail: "Jorge Pérez · 10 t", icon: "truck", group: "Camiones" },
      { id: "MC-01", name: "Montacargas 1", icon: "warehouse", group: "Montacargas", capacity: 1 },
    ];
    despachos.bookings = await (await fetch("/api/despachos?semana=2026-W42")).json();
    // [{ id, resource, start: "2026-10-13T07:30", end: "2026-10-13T09:30", title, detail?, status? }]
    despachos.addEventListener("nx-planner-change", (e) =&gt; {
      if (e.detail.to.resource === "SXT-904") {
        e.detail.message = "El SXT-904 está en mantenimiento";
        e.preventDefault();
      }
    });</code></pre>
            <pre role="tabpanel" hidden><code>import { Planner } from "nx32-elements/solid/planner";

    &lt;Planner view="week" hours="06:00-18:00" resources={flota()} bookings={entregas()}
      endpoint="/api/despachos/reservas" summary="equipos"
      onSelect={(e) =&gt; abrirEntrega(e.detail.booking.id)}
      onCreate={(e) =&gt; { e.preventDefault(); nuevaEntrega(e.detail); }} /&gt;</code></pre>
          </div>

          <h2>API</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
              <tbody>
                <tr><td><code>resources</code></td><td><code>[{id, name, detail?, avatar?, icon?, group?, capacity?}]</code>, en orden; <code>group</code> los agrupa bajo encabezados plegables.</td></tr>
                <tr><td><code>bookings</code></td><td><code>[{id, resource, start, end, title, detail?, status?, color?, readonly?, data?}]</code>. <code>status</code>: <code>confirmed</code>, <code>tentative</code>, <code>active</code> o <code>block</code>. <code>start</code>/<code>end</code> sin zona son hora local de quien mira. Devuelve el estado actual, con los cambios aplicados.</td></tr>
                <tr><td><code>view</code>, <code>date</code>, <code>snap</code></td><td><code>day</code>, <code>week</code> (por defecto) o <code>month</code>; el día a la vista (ISO); minutos de la rejilla (15 en día, 30 en semana; en mes, un día).</td></tr>
                <tr><td><code>hours</code>, <code>workdays</code>, <code>holidays</code></td><td>Horario laboral (<code>"07:00-18:00"</code>), días laborables (<code>[1,2,3,4,5]</code>, lunes = 1) y festivos (<code>["2026-10-12"]</code>).</td></tr>
                <tr><td><code>summary</code></td><td>Fila de ocupación por columna («7/12»); su valor, si lo tiene, nombra lo que se cuenta («equipos»).</td></tr>
                <tr><td><code>source</code>, <code>endpoint</code></td><td>Carga por período (<code>GET ?from=&amp;to=</code>) y a dónde van los cambios (<code>PATCH</code>/<code>POST</code>/<code>DELETE {endpoint}/{id}</code>; si responde error con <code>{message}</code>, ese es el motivo del aviso). Mismo origen o <code>allowOrigins()</code>.</td></tr>
                <tr><td><code>readonly</code>, <code>locale</code>, <code>labels</code></td><td>Solo mirar y seleccionar; formato de fechas; textos (<code>PLANNER_LABELS</code>).</td></tr>
                <tr><td>Métodos</td><td><code>goTo(fecha)</code>, <code>today()</code>, <code>scrollToBooking(id)</code>, <code>undo()</code>.</td></tr>
                <tr><td>Eventos</td><td><code>nx-planner-change</code> <code>{booking, from, to, via}</code>, <code>nx-planner-create</code> <code>{booking, resource, start, end, via}</code>, <code>nx-planner-delete</code> <code>{booking, via}</code> (los tres cancelables; <code>detail.message</code> es el motivo del aviso), <code>nx-planner-select</code> <code>{booking}</code>, <code>nx-planner-range</code> <code>{from, to, view}</code>.</td></tr>
                <tr><td>Teclado</td><td>Rejilla: flechas por recurso y franja, <kbd>Inicio</kbd>/<kbd>Fin</kbd>, <kbd>↵</kbd> crea o abre. Reserva: flechas la mueven, <kbd>Mayús</kbd>+flechas cambian la duración, <kbd>Supr</kbd> la borra, <kbd>Esc</kbd> vuelve (o deshace lo que no se registró).</td></tr>
              </tbody>
            </table>
          </div>
        </template>

              <h2>Cómo funciona</h2>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Haces</th><th>Pasa</th></tr></thead>
                  <tbody>
                    <tr><td>Cargas el formulario</td><td>Guarda cómo está cada campo (o toma <code>initial</code>, o lo que haya cuando llamas <code>snapshot()</code> después de traer el registro).</td></tr>
                    <tr><td>Escribes</td><td>Nada, salvo la cuenta de <code>dirty</code> con una pausa: <code>nx-review-dirty</code> <code>{dirty, count}</code>, para el «¿Salir sin guardar?».</td></tr>
                    <tr><td>Envías</td><td>Si hay algo importante (un monto que cambió 20 % o más, una fecha que se movió más de 7 días, un estado, un campo <code>data-review="important"</code>, un aviso de <code>&lt;nx-guard&gt;</code>) o más de 5 cambios, el envío se detiene y el resumen se despliega encima del botón, agrupado por sección y con lo importante primero. Si no, pasa directo.</td></tr>
                    <tr><td>«Guardar»</td><td>Vuelve a enviar con el mismo botón (<code>requestSubmit(submitter)</code>), avisa <code>nx-review-confirm</code> <code>{changes}</code> y, después del envío, lo guardado pasa a ser la base.</td></tr>
                    <tr><td>«Seguir editando» o <kbd>Esc</kbd></td><td>Cierra y lleva el foco al primer campo cambiado. Cada línea del resumen es un botón que lleva a su campo.</td></tr>
                    <tr><td>Envías sin cambios</td><td>Pasa; con <code>empty="notice"</code>, dice «No hay cambios que guardar» y no envía.</td></tr>
                  </tbody>
                </table>
              </div>

              <h2>Cómo lo dice</h2>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Campo</th><th>Así</th></tr></thead>
                  <tbody>
                    <tr><td>Montos y números</td><td>«Precio unitario: $ 10.000 → $ 12.000 (+$ 2.000 · +20%)». El formato sale de <code>&lt;nx-number format currency&gt;</code> o de <code>data-format</code> / <code>data-currency</code>, con el <code>locale</code>.</td></tr>
                    <tr><td>Fechas</td><td>«Fecha de entrega: 12 oct 2026 → 15 oct 2026 (+3 días)».</td></tr>
                    <tr><td>Selects y radios</td><td>Por la etiqueta de la opción: «Estado: Por aprobar → Aprobada». También <code>&lt;nx-select&gt;</code>.</td></tr>
                    <tr><td>Casillas</td><td>«Facturar con IVA: Sí → No».</td></tr>
                    <tr><td>Textos largos</td><td>La diferencia por palabras: lo quitado tachado y lo agregado resaltado.</td></tr>
                    <tr><td>Filas de detalle</td><td>Nombres como <code>lineas[0].cantidad</code>, <code>lineas[2][precio]</code> o <code>lineas.3.cantidad</code>, o un <code>data-review-row</code> por fila: «2 líneas nuevas · 1 quitada · 1 cambiada», con cada una. Las reconoce por su campo <code>id</code>; sin él, por posición.</td></tr>
                    <tr><td>Nunca</td><td>Contraseñas y campos con <code>data-review="off"</code>.</td></tr>
                  </tbody>
                </table>
              </div>

              <h2>Uso</h2>
              <div class="tabs" data-tabs>
                <div role="tablist">
                  <button role="tab" aria-selected="true">HTML</button>
                  <button role="tab" aria-selected="false">SolidJS</button>
                </div>
                <pre role="tabpanel"><code>&lt;nx-review mode="significant" threshold="20"&gt;
      &lt;form&gt;
        &lt;fieldset&gt;&lt;legend&gt;Encabezado&lt;/legend&gt;
          &lt;label&gt;Fecha de entrega &lt;input name="entrega" type="date" value="2026-10-12"&gt;&lt;/label&gt;
          &lt;label&gt;Estado &lt;select name="estado"&gt;…&lt;/select&gt;&lt;/label&gt;
        &lt;/fieldset&gt;
        &lt;table data-label="Líneas de la orden"&gt;
          &lt;tr&gt;&lt;td&gt;&lt;input type="hidden" name="lineas[0].id" value="L-101"&gt;
              &lt;nx-number name="lineas[0].precio" format="money" currency="COP" value="1275000"&gt;&lt;/nx-number&gt;&lt;/td&gt;&lt;/tr&gt;
        &lt;/table&gt;
        &lt;button&gt;Guardar&lt;/button&gt;
      &lt;/form&gt;
    &lt;/nx-review&gt;
    &lt;script&gt;
      review.addEventListener("nx-review-confirm", (e) =&gt; bitacora.push(e.detail.changes));
      // Sin formulario, con tu propio botón:
      if (await review.review()) await guardar();
    &lt;/script&gt;</code></pre>
                <pre role="tabpanel" hidden><code>import { Review } from "nx32-elements/solid/review";

    &lt;Review mode="significant" initial={orden()} onConfirm={(e) =&gt; guardarBitacora(e.detail.changes)}
      onDirty={(e) =&gt; setSucio(e.detail.dirty)}&gt;
      &lt;form onSubmit={guardar}&gt;…&lt;/form&gt;
    &lt;/Review&gt;</code></pre>
              </div>

              <h2>API</h2>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Nombre</th><th>Descripción</th></tr></thead>
                  <tbody>
                    <tr><td><code>mode</code></td><td><code>significant</code> (por defecto), <code>always</code> o <code>never</code> (solo con <code>review()</code>).</td></tr>
                    <tr><td><code>threshold</code>, <code>max-silent</code></td><td>Desde qué porcentaje un monto es importante (20) y más de cuántos cambios se muestran aunque nada lo sea (5).</td></tr>
                    <tr><td><code>empty</code></td><td><code>notice</code>: al enviar sin cambios, «No hay cambios que guardar» y no envía.</td></tr>
                    <tr><td><code>initial</code></td><td>La base (JSON <code>{campo: valor}</code>, con filas anidadas <code>{lineas: [{id, cantidad}]}</code> o planas).</td></tr>
                    <tr><td><code>rebase</code></td><td><code>false</code>: después de guardar, la base no cambia (tú llamas <code>snapshot()</code>).</td></tr>
                    <tr><td><code>locale</code>, <code>labels</code>, <code>disabled</code></td><td>Formato de montos y fechas, textos (<code>REVIEW_LABELS</code>; «uno|varios» con <code>{n}</code>), apagarlo.</td></tr>
                    <tr><td>En los campos</td><td><code>data-label</code>, <code>data-format</code> (<code>money</code>, <code>number</code>, <code>percent</code>, <code>date</code>, <code>text</code>), <code>data-currency</code>, <code>data-review="important|status|off"</code>, <code>data-review-section</code>; en el contenedor de filas, <code>data-review-rows</code> y <code>data-label</code>; <code>data-review-row="clave"</code> por fila.</td></tr>
                    <tr><td><code>snapshot()</code>, <code>review()</code>, <code>reset()</code></td><td>Lo de ahora es la base; mostrar el resumen sin formulario (promesa <code>true</code>/<code>false</code>); volver cada campo a la base.</td></tr>
                    <tr><td><code>changes</code>, <code>dirty</code></td><td>La lista <code>{field, label, section, from, to, fromText, toText, kind, significant, reason, delta, diff, rows, warnings}</code>; ¿hay algo distinto?</td></tr>
                    <tr><td>Eventos</td><td><code>nx-review-open</code> <code>{changes}</code> (cancelable: cancelarlo envía directo), <code>nx-review-confirm</code> <code>{changes, silent}</code>, <code>nx-review-cancel</code>, <code>nx-review-dirty</code> <code>{dirty, count}</code>.</td></tr>
                    <tr><td>Funciones</td><td><code>diffReview</code>, <code>describeReview</code>, <code>groupReview</code>, <code>reviewShouldOpen</code>, <code>flattenReview</code>…: la misma lógica, para armar la bitácora en un backend en JavaScript.</td></tr>
                  </tbody>
                </table>
              </div>
            </template>

        <!-- ================================================================ Dictar -->
        <template id="page-voice">

          <h1>Dictar <code class="tag">&lt;nx-voice&gt;</code></h1>

            <section class="vc-card" aria-labelledby="vc-notes-title">

                Mantén presionado el botón (o la barra espaciadora sobre él) y di los signos: «coma», «punto», «punto y
